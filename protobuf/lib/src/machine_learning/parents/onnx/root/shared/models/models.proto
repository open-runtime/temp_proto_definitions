syntax = "proto3";
import "lib/src/core/root/grpc/shared/models/cancellation.proto";

package runtime.aot.machine_learning.onnx;


// ======================================================
// ======================================================
// Models needed for prediction

// anything that's returnable should always have a cancellation
message OnnxInferencePredictionInput {
  runtime.aot.core.Cancellation cancellation = 1;
  OnnxNodes nodes = 2;
}

message OnnxInferencePredictionOutput {
  runtime.aot.core.Cancellation cancellation = 1;
  OnnxNodes nodes = 2;
}

enum OnnxIOType {
  FLOAT = 0;
  UINT8 = 1;
  INT8 = 2;
  UINT16 = 3;
  INT16 = 4;
  UINT32 = 5;
  INT32 = 6;
  UINT64 = 7;
  INT64 = 8;
  STRING = 9;
  BOOL = 10;
  DOUBLE = 11;
};


// Mapped to match the types in the ORT API
message OnnxNodeData {
  // https://developers.google.com/protocol-buffers/docs/proto#scalar
  repeated float floatList = 1 [packed = true];
  repeated uint32 uint8List = 2 [packed = true];
  repeated int32 int8List = 3 [packed = true];
  repeated uint32 uint16List = 4 [packed = true];
  repeated int32 int16List = 5 [packed = true];
  repeated uint32 uint32List = 6 [packed = true];
  repeated int32 int32List = 7 [packed = true];
  repeated uint64 uint64List = 8 [packed = true];
  repeated int64 int64List = 9 [packed = true];
  repeated string stringList = 10;
  // cant pack strings to advanced encoding i.e. [packed = true] can only be specified for repeated primitive fields.
  repeated bool boolList = 11 [packed = true];
  repeated double doubleList = 12 [packed = true];
}

