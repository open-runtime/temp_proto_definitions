syntax = "proto3";

import "lib/src/google/protobuf/struct.proto";
import "lib/src/google/protobuf/timestamp.proto";

package runtime.aot.machine_learning.parents.msft_azure_openai;

// =============================================================================
// Microsoft Azure OpenAI Inference Protocol Buffer Definition
// =============================================================================
// This file defines the protocol buffer messages and enums for Microsoft Azure
// OpenAI inference service integrated with our enterprise configuration system.
//
// Core Design Principles:
// 1. Config-Driven: Uses enriched JSON from our enterprise onboarding system
// 2. OpenAI API Compatible: Leverages openai_dart package for API communication
// 3. Multi-Tenant: Organization-level credentials from GCP Secrets Manager
// 4. Compressed Storage: Supports gzip + base64 compression (75% savings)
// 5. Auto-Discovery: Deployments, rate limits, and metadata auto-discovered
//
// Azure OpenAI Service Documentation:
// - API Reference: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/reference
// - Quickstart: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/quickstart
// - Authentication: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/managed-identity
// - Models: https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models
//
// Our Enterprise Config System:
// - Minimal input (4 fields) → Complete config (3 seconds)
// - Auto-discovery: Region, rate limits, models, additional deployments
// - Compression: 3.4KB → 844 bytes (75% savings)
// - Storage: GCP Secrets Manager per org
//
// =============================================================================

//------------------------------------------------------------------------------
// Model Identification
//------------------------------------------------------------------------------
// Model identifier supporting both enum (known models) and string (custom models)
// Similar to AWS Bedrock's AWSBedrockModelIdentifier pattern
//
// Client specifies the MODEL (e.g., GPT_5_MINI, GPT_4_1, O3_MINI)
// Server maps model to appropriate DEPLOYMENT based on org's config
// This decouples client code from enterprise-specific deployment naming

message MSFTAzureOpenAIModelIdentifier {
  oneof model {
    // Enum for known/common models (recommended for type safety)
    // Use this for well-known Azure OpenAI models
    MSFTAzureOpenAIModelEnum common_model = 1;
    
    // String for custom/unknown/new model IDs (flexible option)
    // Use this for:
    // - Newly released models not yet in enum
    // - Fine-tuned models
    // - Custom model IDs
    // Examples: "gpt-5", "gpt-4.1", "o3-mini", "custom-finetuned-model"
    // Server will match this to a deployment in the org's config
    string custom_model_id = 2;
  }
}

