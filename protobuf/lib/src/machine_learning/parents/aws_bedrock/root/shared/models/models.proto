  AWS_BEDROCK_MODEL_ENUM_META_LLAMA_3_3_70B = 12;
  
  // Llama 3.2 90B Instruct (Vision)
  // Model ID: meta.llama3-2-90b-instruct-v1:0
  // Base Model: llama3-2-90b-instruct
  // Use Cases: Multimodal understanding with vision, image analysis
  // Status: Active
  AWS_BEDROCK_MODEL_ENUM_META_LLAMA_3_2_90B = 13;
  
  // Llama 3.2 11B Instruct (Vision)
  // Model ID: meta.llama3-2-11b-instruct-v1:0
  // Base Model: llama3-2-11b-instruct
