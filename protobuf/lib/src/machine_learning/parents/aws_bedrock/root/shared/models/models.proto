//------------------------------------------------------------------------------
// Common Request/Response Structures
//------------------------------------------------------------------------------

// Top-level inference request supporting multiple model families
// Maps to AWS Bedrock InvokeModel/InvokeModelWithResponseStream HTTP requests
// Endpoint: POST https://bedrock-runtime.{region}.amazonaws.com/model/{modelId}/invoke
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeModel.html
message AWSBedrockInferenceRequest {
  // Required: AWS region (e.g., "us-east-1")
  // Used to construct endpoint URL: bedrock-runtime.{region}.amazonaws.com
  // Reference: https://docs.aws.amazon.com/general/latest/gr/bedrock.html
  string region = 1;
  
  // Required: Model identifier
  // Maps to {modelId} path parameter in HTTP endpoint
  // Examples: "anthropic.claude-3-5-sonnet-20240620-v1:0", "meta.llama3-70b-instruct-v1:0"
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
  AWSBedrockModelIdentifier model_identifier = 2;
  
  // Model-specific request formats
  // Each provider has distinct request structures reflecting their native API patterns
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters.html
  oneof request_format {
    // Anthropic Claude models (Messages API format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
    AWSBedrockClaudeRequest claude = 10;
    
    // Meta Llama models (Instruction format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-meta.html
    AWSBedrockLlamaRequest llama = 11;
    
    // Amazon Titan models (Text, Embeddings, Image Generator)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan.html
    AWSBedrockTitanRequest titan = 12;
    
    // Amazon Nova models (Understanding and Generation)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-nova.html
    AWSBedrockNovaRequest nova = 13;
    
    // Mistral AI models (Chat format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral.html
    AWSBedrockMistralRequest mistral = 14;
    
    // Cohere Command models (Text generation)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-cohere-command.html
    AWSBedrockCohereRequest cohere = 15;
    
    // Cohere Embed models (Text/image embeddings)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed.html
    AWSBedrockCohereEmbedRequest cohere_embed = 16;
    
    // Cohere Rerank models (Document reranking)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
    AWSBedrockCohereRerankRequest cohere_rerank = 17;
    
    // AI21 Labs Jamba models (Conversational format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jamba.html
    AWSBedrockAI21Request ai21 = 18;
    
    // AI21 Labs Jurassic-2 models (Completion format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jurassic2.html
    AWSBedrockAI21JurassicRequest ai21_jurassic = 19;
    
    // Stability AI image generation models
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-stability-diffusion.html
    AWSBedrockStabilityRequest stability = 20;
    
    // DeepSeek models (Reasoning and coding)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-deepseek.html
    AWSBedrockDeepSeekRequest deepseek = 21;
    
    // Qwen models (Agentic intelligence)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-qwen.html
    AWSBedrockQwenRequest qwen = 22;
    
    // OpenAI GPT-OSS models (OpenAI Chat Completions format)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-openai.html
    AWSBedrockOpenAIOSSRequest openai_oss = 23;
    
    // TwelveLabs models (Video understanding and embeddings)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-twelvelabs.html
    AWSBedrockTwelveLabsRequest twelvelabs = 24;
    
    // Luma AI Ray2 models (Video generation - async only)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-luma.html
    AWSBedrockLumaRequest luma = 25;
    
    // Generic format for unknown/new models or direct JSON passthrough
    // Use this for models not yet fully supported or custom fine-tuned models
    google.protobuf.Struct generic = 99;
  }
  
  // Optional: Global configuration (guardrails, caching, performance)
  AWSBedrockGlobalConfig global_config = 3;
  
  // Optional: Enable content accumulation in streaming responses
  // 
  // STREAMING OPTIMIZATION FLAG:
  // Controls whether streaming responses include full accumulated content
  // or just deltas (incremental changes).
  //
  // accumulate = false (DEFAULT - Recommended for Production):
  //   - Streaming responses contain ONLY delta field (new content)
  //   - success.claude.content will be EMPTY (saves bandwidth)
  //   - Client must accumulate deltas manually: myText += response.delta.text
  //   - Benefits: Minimal payload size, maximum speed, lower bandwidth costs
  //   - Best for: Large responses, mobile clients, bandwidth-constrained environments
  //
  // accumulate = true (Opt-in for Simplicity):
  //   - Streaming responses contain FULL accumulated content in success field
  //   - success.claude.content has complete text so far
  //   - delta field ALSO populated for clients that want both
  //   - Client can be stateless: justDisplay(response.success.claude.content.first.text)
  //   - Benefits: Simpler client code, stateless components, easier debugging
  //   - Cost: Larger payloads (sends all accumulated text in each response)
  //   - Best for: Prototyping, simple UIs, desktop apps with ample bandwidth
  //
  // Example payload size comparison (1000 token response, ~750 chars/token):
  //   accumulate=false: ~100 responses × ~7.5 chars each = ~750 bytes total
  //   accumulate=true:  ~100 responses × (7.5+15+22.5+...+750) avg ~375 chars = ~37.5 KB total
  //   Savings: ~98% bandwidth reduction with accumulate=false!
  //
  // Default: false (optimized for production performance)
  // Type: bool
  // Applies to: PredictWithStream() only (ignored by Predict())
  bool accumulate = 4;
}

// Global configuration (guardrails, caching, performance)
// Applies to all model requests regardless of provider
message AWSBedrockGlobalConfig {
  // Guardrail configuration
  AWSBedrockGuardrailConfig guardrail = 1;
  
  // Prompt cache configuration (Claude models)
  AWSBedrockPromptCacheConfig prompt_cache = 2;
  
  // Performance configuration
  AWSBedrockPerformanceConfig performance = 3;
}

message AWSBedrockGuardrailConfig {
  string guardrail_identifier = 1;
  string guardrail_version = 2;
}

message AWSBedrockPromptCacheConfig {
  bool enabled = 1;
  repeated AWSBedrockCacheCheckpoint checkpoints = 2;
}

message AWSBedrockCacheCheckpoint {
  AWSBedrockCacheCheckpointType type = 1;
  uint32 location = 2;
}

enum AWSBedrockCacheCheckpointType {
  // Unspecified checkpoint type
  AWS_BEDROCK_CACHE_CHECKPOINT_TYPE_UNSPECIFIED = 0;
  
  // Message checkpoint - cache checkpoint placed in messages array
  // Used for caching repeated message prefixes in multi-turn conversations
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  AWS_BEDROCK_CACHE_CHECKPOINT_TYPE_MESSAGE = 1;
  
  // System checkpoint - cache checkpoint placed in system prompt
  // Used for caching system prompts that remain constant across requests
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  AWS_BEDROCK_CACHE_CHECKPOINT_TYPE_SYSTEM = 2;
  
  // Tool checkpoint - cache checkpoint placed in tools array
  // Used for caching tool definitions that remain constant across requests
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  AWS_BEDROCK_CACHE_CHECKPOINT_TYPE_TOOL = 3;
}

message AWSBedrockPerformanceConfig {
  AWSBedrockPerformanceMode mode = 1;
}

enum AWSBedrockPerformanceMode {
  // Unspecified performance mode (uses default)
  AWS_BEDROCK_PERFORMANCE_MODE_UNSPECIFIED = 0;
  
  // Standard - Standard performance mode
  // Balanced performance and cost
  // Recommended for: Most use cases
  AWS_BEDROCK_PERFORMANCE_MODE_STANDARD = 1;
  
  // Optimized - Optimized performance mode
  // Higher performance with potentially higher cost
  // Recommended for: High-throughput, low-latency requirements
  AWS_BEDROCK_PERFORMANCE_MODE_OPTIMIZED = 2;
}

//------------------------------------------------------------------------------
// Anthropic Claude Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock Claude Messages API format
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
// Request/Response Format: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-request-response.html

message AWSBedrockClaudeRequest {
  // Required: Anthropic version (always "bedrock-2023-05-31" for Bedrock)
  // Maps to "anthropic_version" field in JSON request body
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
  string anthropic_version = 1;
  
  // Required: Messages array for conversational API
  repeated AWSBedrockClaudeMessage messages = 2;
  
  // Optional: System prompt
  string system = 3;
  
  // Required: Maximum tokens to generate
  int32 max_tokens = 4;
  
  // Inference parameters (mutually exclusive for Sonnet 4.5/Haiku 4.5)
  AWSBedrockClaudeInferenceConfig config = 5;
  
  // Optional: Stop sequences
  repeated string stop_sequences = 6;
  
  // Optional: Tool definitions for tool use
  repeated AWSBedrockClaudeTool tools = 7;
  
  // Optional: Tool choice configuration
  AWSBedrockClaudeToolChoice tool_choice = 8;
  
  // Optional: Extended thinking configuration (Claude 4+)
  AWSBedrockClaudeExtendedThinkingConfig extended_thinking = 9;
  
  // Optional: Structured output configuration
  AWSBedrockClaudeStructuredOutputConfig structured_output = 10;
}

message AWSBedrockClaudeMessage {
  AWSBedrockClaudeRole role = 1;
  AWSBedrockClaudeContent content = 2;
}

enum AWSBedrockClaudeRole {
  AWS_BEDROCK_CLAUDE_ROLE_UNSPECIFIED = 0;
  AWS_BEDROCK_CLAUDE_ROLE_USER = 1;
  AWS_BEDROCK_CLAUDE_ROLE_ASSISTANT = 2;
}

message AWSBedrockClaudeContent {
  oneof content_type {
    string text = 1;
    AWSBedrockClaudeContentBlocks blocks = 2;
  }
}

message AWSBedrockClaudeContentBlocks {
  repeated AWSBedrockClaudeContentBlock blocks = 1;
}

message AWSBedrockClaudeContentBlock {
  // Content block (use oneof for type safety)
  // Only one field can be set at a time, enforced by protobuf
  oneof content {
    // Text content block
    string text = 1;
    
    // Image content block
    AWSBedrockClaudeImageSource image = 2;
    
    // Document content block
    AWSBedrockClaudeDocumentSource document = 3;
    
    // Tool use block (model requesting tool invocation)
    AWSBedrockClaudeToolUse tool_use = 4;
    
    // Tool result block (returning tool execution results)
    AWSBedrockClaudeToolResult tool_result = 5;
    
    // Thinking/reasoning block (for extended thinking)
    string thinking = 6;
  }
}

// Note: AWSBedrockClaudeContentBlockType enum removed - oneof provides type safety

message AWSBedrockClaudeImageSource {
  // Required: Source type indicating how image is provided
  AWSBedrockClaudeImageSourceType source_type = 1;
  
  // Required: Media type of the image
  // Specifies the image format for proper decoding
  AWSBedrockImageMediaType media_type = 2;
  
  // Image data (when source_type is BASE64)
  // Binary image bytes - protobuf automatically handles base64 encoding/decoding in JSON
  // When serialized to JSON, this bytes field is automatically base64-encoded
  bytes base64 = 3;
  
  // Optional: S3 location (when source_type is S3)
  // Specifies bucket and key for S3-hosted images
  AWSBedrockS3Location s3_location = 4;
}

// Image Media Types
// Supported image formats for AWS Bedrock multimodal processing
enum AWSBedrockImageMediaType {
  // Unspecified media type
  AWS_BEDROCK_IMAGE_MEDIA_TYPE_UNSPECIFIED = 0;
  
  // PNG - Portable Network Graphics
  // Supports RGB and RGBA color spaces with lossless compression
  // Ideal for: Images with text, transparency requirements
  // MIME type: image/png
  AWS_BEDROCK_IMAGE_MEDIA_TYPE_PNG = 1;
  
  // JPEG - Joint Photographic Experts Group
  // Lossy compression suitable for photographic content
  // Ideal for: Photographs, complex imagery
  // MIME type: image/jpeg, image/jpg
  AWS_BEDROCK_IMAGE_MEDIA_TYPE_JPEG = 2;
  
  // GIF - Graphics Interchange Format
  // Supports animation and transparency
  // Ideal for: Animated images, simple graphics
  // MIME type: image/gif
  AWS_BEDROCK_IMAGE_MEDIA_TYPE_GIF = 3;
  
  // WEBP - Web Picture format
  // Modern format with superior compression
  // Ideal for: Web-optimized images
  // MIME type: image/webp
  AWS_BEDROCK_IMAGE_MEDIA_TYPE_WEBP = 4;
}

enum AWSBedrockClaudeImageSourceType {
  AWS_BEDROCK_CLAUDE_IMAGE_SOURCE_TYPE_UNSPECIFIED = 0;
  AWS_BEDROCK_CLAUDE_IMAGE_SOURCE_TYPE_BASE64 = 1;
  AWS_BEDROCK_CLAUDE_IMAGE_SOURCE_TYPE_S3 = 2;
}

// AWSBedrockClaudeDocumentSource represents a document source for Claude models in AWS Bedrock.
// Documents enable Claude to analyze, extract information from, and answer questions about
// various file formats including PDFs, Word documents, spreadsheets, and text files.
//
// This message wraps document content with metadata that guides how Claude processes the document.
// Documents are included in Converse API requests as DocumentBlock objects within message content,
// allowing Claude to understand document structure, extract visual elements (charts, graphs, tables),
// and generate citations referencing specific document locations.
//
// AWS Bedrock supports two primary source types:
// - BASE64: Document content embedded directly in the API request as base64-encoded bytes.
//   Best for small to medium documents (< 1 MB) that are already in memory or dynamically generated.
//   Note: Base64 encoding increases payload size by ~33% compared to binary content.
//   AWS SDKs automatically handle base64 encoding, so manual encoding is not required.
//
// - S3: Document stored in Amazon S3, referenced by bucket and key.
//   Optimal for large documents (> 1 MB), batch processing, or documents already in cloud storage.
//   Reduces API payload size and enables processing documents larger than API payload limits.
//   Requires appropriate IAM permissions for Bedrock to access the S3 bucket.
//   S3 URI format: s3://bucket-name/path/to/document
//
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentSource.html
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
message AWSBedrockClaudeDocumentSource {
  // Required: Source type indicating how the document content is provided.
  // Determines which field (base64 or s3_location) contains the actual document data.
  // When source_type is BASE64, the base64 field must be populated.
  // When source_type is S3, the s3_location field must be populated.
  //
  // BASE64 is suitable for:
  // - Documents already loaded in memory as binary data
  // - Dynamically generated documents
  // - Small to medium documents (< 1 MB)
  // - Real-time single-document processing
  //
  // S3 is suitable for:
  // - Large documents (> 1 MB) to avoid API payload size limits
  // - Documents already stored in cloud infrastructure
  // - Batch processing scenarios
  // - Applications where documents are pre-uploaded to S3
  //
  // Performance considerations:
  // - BASE64: Entire document must be in memory before API call, increases payload by ~33%
  // - S3: Introduces latency for S3 retrieval, but often overlaps with model processing time
  AWSBedrockClaudeDocumentSourceType source_type = 1;
  
  // Required: Document format/file type.
  // Specifies the format of the document to enable format-specific parsing and optimization.
  // Claude can process documents differently based on format (e.g., CSV parsing for tabular data,
  // visual understanding for PDFs with charts and graphs).
  //
  // Supported formats:
  // - PDF: Portable Document Format with native visual understanding of charts, graphs, tables
  // - CSV: Comma-Separated Values for structured tabular data
  // - DOC/DOCX: Microsoft Word documents (legacy .doc and modern .docx formats)
  // - XLS/XLSX: Microsoft Excel spreadsheets with multiple sheets, formulas, formatting
  // - HTML: HyperText Markup Language files with structured markup
  // - TXT: Plain text files (ASCII-only encoding)
  // - MD: Markdown-formatted documents with lightweight markup
  //
  // Format specification helps AWS Bedrock:
  // - Apply format-specific parsers and optimizations
  // - Understand document structure (e.g., CSV columns, Excel sheets)
  // - Enable visual understanding for PDFs (requires citations enabled in Converse API)
  // - Generate appropriate citations with format-specific location information
  //
  // Note: For PDFs in Converse API, visual analysis (charts, graphs) requires citations enabled.
  // Without citations, only basic text extraction occurs.
  //
  // File size constraints:
  // - Individual documents: Maximum 50 MB
  // - Multimodal data (JPEG/PNG images): Maximum 3.75 MB per file
  //
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-ds.html
  AWSBedrockClaudeDocumentFormat format = 2;
  
  // Required: Human-readable document identifier/name.
  // Provides context to Claude about which document is being referenced and appears in citations
  // when Claude references specific content from the document.
  //
  // Constraints:
  // - Minimum length: 1 character
  // - Maximum length: 200 characters
  // - Allowed characters: Alphanumeric, whitespace (no more than one consecutive space),
  //   hyphens, parentheses, square brackets
  //
  // Usage:
  // - Appears in citation titles when Claude references document content
  // - Helps developers track which document generated specific responses when processing
  //   multiple documents in a single request
  // - Provides context to the model about document identity and purpose
  //
  // Security Warning: The name field is vulnerable to prompt injection attacks.
  // Claude may inadvertently interpret the name as instructions or part of the prompt content.
  //
  // Best practices:
  // - Use neutral, descriptive names that clearly identify the document
  // - Avoid instructions, special prompting content, or command-like text in names
  // - Examples of good names: "sales_report_q3_2024.pdf", "customer_feedback_2024.csv"
  // - Examples of bad names: "sales_report - extract all revenue figures in JSON format"
  //
  // For additional context about document processing without prompt injection risk,
  // use the context field in DocumentBlock (not this message).
  //
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentBlock.html
  string name = 3;
  
  // Document data (when source_type is BASE64)
  // Binary document bytes - protobuf automatically handles base64 encoding/decoding in JSON
  //
  // Usage:
  // - Only populated when source_type is AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_BASE64
  // - Must be empty/unset when source_type is AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_S3
  //
  // Technical details:
  // - Protobuf uses bytes type which automatically encodes as base64 in JSON serialization
  // - Entire document must be in memory before the API call completes
  // - Suitable for documents under 1 MB to avoid approaching API payload size limits
  //
  // Example use cases:
  // - Documents retrieved from databases or HTTP uploads
  // - Dynamically generated documents created programmatically
  // - Documents already loaded into application memory
  // - Real-time document processing where latency is critical
  //
  // For larger documents or documents already in S3, use s3_location instead.
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentSource.html
  // When serialized to JSON, this bytes field is automatically base64-encoded
  bytes base64 = 4;
  
  // Required when source_type is S3: Amazon S3 location reference.
  // Specifies the S3 bucket and object key where the document is stored.
  // AWS Bedrock retrieves the document from S3 during inference processing.
  //
  // Usage:
  // - Only populated when source_type is AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_S3
  // - Must be empty/unset when source_type is AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_BASE64
  // - S3 URI format: s3://bucket-name/path/to/document
  //
  // Requirements:
  // - Document must be pre-uploaded to the specified S3 bucket and key
  // - AWS Bedrock must have appropriate IAM permissions to read from the S3 bucket
  // - Bucket and key must reference a valid, accessible S3 object
  //
  // Advantages:
  // - No increase in API payload size regardless of document size
  // - Enables processing documents larger than API payload limits
  // - Potential cost savings when multiple requests reference the same S3 object (S3 caching)
  // - Improved performance for large documents (S3 retrieval happens server-side)
  // - Natural integration with cloud infrastructure where documents are stored in S3
  //
  // Considerations:
  // - Introduces latency for S3 retrieval during processing (often overlaps with model processing)
  // - Requires S3 upload step before inference
  // - Requires IAM permission configuration for Bedrock to access S3 bucket
  // - Documents must be accessible from the AWS region where Bedrock is invoked
  //
  // Best for:
  // - Documents larger than 1 MB
  // - Batch processing scenarios
  // - Documents already stored in cloud infrastructure
  // - Applications with persistent document storage in S3
  //
  // The s3_location message contains:
  // - bucket: S3 bucket name (e.g., "my-documents-bucket")
  // - key: S3 object key/path (e.g., "reports/q3_2024/sales_report.pdf")
  //
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentSource.html
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_S3Location.html
  AWSBedrockS3Location s3_location = 5;
}

// AWSBedrockClaudeDocumentSourceType specifies how document content is delivered to Claude.
// This enum determines which field in AWSBedrockClaudeDocumentSource contains the actual
// document data (base64 for embedded content, s3_location for cloud-stored documents).
//
// The choice between BASE64 and S3 has significant implications for:
// - API payload size (BASE64 increases size by ~33%, S3 adds no payload overhead)
// - Document size limits (BASE64 limited by API payload limits, S3 supports larger documents)
// - Performance characteristics (BASE64 requires in-memory document, S3 introduces retrieval latency)
// - Use case suitability (BASE64 for small/dynamic documents, S3 for large/persistent documents)
//
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_DocumentSource.html
enum AWSBedrockClaudeDocumentSourceType {
  // Default/unspecified value. Should not be used in production.
  // Indicates that the source type has not been explicitly set.
  AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_UNSPECIFIED = 0;
  
  // Document content is provided as base64-encoded bytes in the base64 field.
  // The entire document content is embedded directly in the API request payload.
  //
  // Use this option when:
  // - Document is small to medium size (< 1 MB recommended)
  // - Document is already loaded in memory as binary data
  // - Document is dynamically generated programmatically
  // - Real-time processing with minimal latency is required
  // - Document originates from sources other than file storage (database, HTTP upload, etc.)
  //
  // Considerations:
  // - Base64 encoding increases payload size by approximately 33%
  // - Entire document must be in memory before API call
  // - AWS SDKs automatically handle base64 encoding
  // - May approach or exceed API payload size limits for large documents
  //
  // Example: Reading a PDF from disk and sending it directly in the request
  AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_BASE64 = 1;
  
  // Document is stored in Amazon S3, referenced by bucket and key in s3_location field.
  // AWS Bedrock retrieves the document from S3 during inference processing.
  //
  // Use this option when:
  // - Document is large (> 1 MB) to avoid API payload size limits
  // - Document is already stored in Amazon S3
  // - Processing multiple documents in batch scenarios
  // - Documents are pre-uploaded to cloud storage
  // - Building applications with persistent document storage infrastructure
  //
  // Requirements:
  // - Document must be pre-uploaded to the specified S3 bucket and key
  // - AWS Bedrock must have IAM permissions to read from the S3 bucket
  // - S3 bucket must be accessible from the AWS region where Bedrock is invoked
  //
  // Advantages:
  // - No increase in API payload size regardless of document size
  // - Supports documents larger than API payload limits
  // - Potential cost savings through S3 caching for frequently accessed documents
  // - Server-side S3 retrieval can overlap with model processing time
  //
  // Considerations:
  // - Introduces latency for S3 retrieval during processing
  // - Requires S3 upload step before inference
  // - Requires IAM permission configuration
  //
  // Example: Referencing a document at s3://my-bucket/reports/q3_2024.pdf
  AWS_BEDROCK_CLAUDE_DOCUMENT_SOURCE_TYPE_S3 = 2;
}

// AWSBedrockClaudeDocumentFormat specifies the file format/type of the document.
// Format specification enables AWS Bedrock to apply format-specific parsers, optimizations,
// and understanding (e.g., CSV column parsing, PDF visual element extraction, Excel sheet handling).
//
// Claude supports comprehensive document format coverage for business and technical documents:
// - Office documents: Word (.doc, .docx), Excel (.xls, .xlsx)
// - Data formats: CSV for structured tabular data
// - Web formats: HTML with structured markup
// - Document formats: PDF with native visual understanding
// - Text formats: Plain text (.txt), Markdown (.md)
//
// Format-specific capabilities:
// - PDF: Native visual understanding of charts, graphs, tables, and layout (requires citations
//   enabled in Converse API for full visual analysis)
// - CSV: Structured parsing of tabular data with column awareness
// - Excel: Multi-sheet support, formula understanding, formatting preservation
// - HTML: Semantic element preservation and structured markup understanding
//
// File size constraints:
// - Individual documents: Maximum 50 MB
// - Multimodal data (images): Maximum 3.75 MB per file
//
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-ds.html
enum AWSBedrockClaudeDocumentFormat {
  // Default/unspecified value. Should not be used in production.
  // Format should be explicitly specified to enable format-specific optimizations.
  AWS_BEDROCK_CLAUDE_DOCUMENT_FORMAT_UNSPECIFIED = 0;
  
  // Portable Document Format (.pdf)
  // Claude processes PDFs natively with full visual understanding of charts, graphs, tables,
  // and document layout. Can extract both text content and interpret visual elements.
  //
  // Visual understanding capabilities:
  // - Chart and graph interpretation
  // - Table structure understanding
  // - Layout and formatting preservation
  // - Image and diagram comprehension
  //
  // Important: In Converse API, visual PDF analysis requires citations to be enabled.
  // Without citations, only basic text extraction occurs.
  //
  // Use cases: Reports, research papers, forms, invoices, presentations with visual elements
  PDF = 1;
  
  // Comma-Separated Values (.csv)
  // Structured tabular data format where each row contains related fields separated by commas.
  // Claude can parse CSV structure, understand column relationships, and extract tabular data.
  //
  // CSV-specific handling:
  // - Column-aware parsing
  // - Row and field extraction
  // - Structured data queries
  // - Knowledge base metadata configuration support
  //
  // Use cases: Data exports, spreadsheets exported to CSV, structured data files
  CSV = 2;
  
  // Microsoft Word Document (.doc)
  // Legacy binary format for Microsoft Word documents. Contains text, formatting, styles,
  // tables, and embedded objects. Claude extracts text content and preserves document structure.
  //
  // Note: In AWS Bedrock Data Automation (BDA), DOCX files are converted to PDF internally,
  // which affects page number mapping in BDA output.
  //
  // Use cases: Legacy Word documents, older business documents
  DOC = 3;
  
  // Microsoft Word Document (.docx)
  // Modern XML-based format for Microsoft Word documents. Contains text, formatting, styles,
  // tables, embedded objects, and document metadata. More structured than legacy .doc format.
  //
  // DOCX capabilities:
  // - Text and formatting extraction
  // - Table structure understanding
  // - Style and metadata preservation
  //
  // Note: In AWS Bedrock Data Automation (BDA), DOCX files are converted to PDF internally,
  // which affects page number mapping in BDA output.
  //
  // Use cases: Modern Word documents, business reports, formatted text documents
  DOCX = 4;
  
  // Microsoft Excel Spreadsheet (.xls)
  // Legacy binary format for Microsoft Excel spreadsheets. Contains multiple sheets, formulas,
  // formatting, embedded charts, and cell data. Claude can extract data and understand structure.
  //
  // Excel capabilities:
  // - Multi-sheet support
  // - Formula and cell reference understanding
  // - Formatting and style preservation
  // - Chart and embedded object extraction
  //
  // Use cases: Legacy Excel spreadsheets, older data files
  XLS = 5;
  
  // Microsoft Excel Spreadsheet (.xlsx)
  // Modern XML-based format for Microsoft Excel spreadsheets. Contains multiple sheets,
  // formulas, formatting, embedded charts, and cell data with improved structure.
  //
  // XLSX capabilities:
  // - Multi-sheet navigation and extraction
  // - Formula understanding and calculation awareness
  // - Formatting and conditional formatting preservation
  // - Chart and embedded object extraction
  // - Better structure preservation than legacy .xls format
  //
  // Use cases: Modern Excel spreadsheets, financial models, data analysis files
  XLSX = 6;
  
  // HyperText Markup Language (.html)
  // Web page format with structured markup defining both content and presentation.
  // Claude preserves semantic elements and understands HTML structure.
  //
  // HTML capabilities:
  // - Semantic element preservation
  // - Structured markup understanding
  // - Content and presentation separation awareness
  // - Link and reference extraction
  //
  // Use cases: Web pages, HTML exports, formatted web content
  HTML = 7;
  
  // Plain Text (.txt)
  // Simple text format containing ASCII-only content. Most basic and universally compatible format.
  // Requires no special parsing and is processed directly as character sequences.
  //
  // Text capabilities:
  // - Direct character sequence processing
  // - No formatting or structure overhead
  // - Maximum compatibility
  //
  // Constraints:
  // - ASCII-only encoding
  // - No formatting or structure preservation
  //
  // Use cases: Log files, plain text documents, simple data files
  TXT = 8;
  
  // Markdown (.md)
  // Lightweight markup format commonly used in documentation and technical writing.
  // Preserves structural elements like headers, emphasis, code blocks, lists, and links.
  //
  // Markdown capabilities:
  // - Structural element preservation (headers, lists, code blocks)
  // - Emphasis and formatting understanding
  // - Link and reference extraction
  // - Code block syntax awareness
  //
  // Use cases: Documentation, README files, technical writing, formatted text with structure
  MD = 9;
}

// AWSBedrockS3Location specifies the location of an object stored in Amazon S3.
// Used to reference documents, images, or other files stored in S3 buckets for AWS Bedrock processing.
//
// When AWS Bedrock processes a request with an S3 location, it retrieves the object from S3
// during inference, eliminating the need to embed large files directly in API requests.
//
// S3 URI format: s3://bucket-name/path/to/object
//
// Requirements:
// - The S3 object must exist and be accessible
// - AWS Bedrock must have appropriate IAM permissions to read from the specified bucket
// - The bucket must be in the same AWS region as the Bedrock service (or cross-region access configured)
// - The object key must reference a valid, accessible S3 object
//
// IAM Permissions:
// Bedrock requires s3:GetObject permission for the specified bucket and key.
// Example IAM policy:
// {
//   "Effect": "Allow",
//   "Action": "s3:GetObject",
//   "Resource": "arn:aws:s3:::bucket-name/*"
// }
//
// Performance considerations:
// - S3 retrieval latency is introduced during processing (often overlaps with model processing time)
// - S3 objects may be cached by Bedrock for frequently accessed files
// - Cross-region access may introduce additional latency
//
// Use cases:
// - Large documents (> 1 MB) to avoid API payload size limits
// - Documents already stored in cloud infrastructure
// - Batch processing scenarios with pre-uploaded files
// - Applications with persistent file storage in S3
//
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_S3Location.html
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_S3Location.html
message AWSBedrockS3Location {
  // Required: Amazon S3 bucket name.
  // The name of the S3 bucket containing the object to be processed.
  //
  // Bucket naming rules:
  // - Must be globally unique across all AWS accounts
  // - Must be between 3 and 63 characters long
  // - Can contain lowercase letters, numbers, periods (.), and hyphens (-)
  // - Must start and end with a letter or number
  // - Must not be formatted as an IP address (e.g., 192.168.1.1)
  //
  // Examples: "my-documents-bucket", "company-reports-2024", "data-storage-bucket"
  //
  // The bucket must:
  // - Exist and be accessible
  // - Have appropriate IAM permissions configured for Bedrock to access
  // - Be in a region accessible by the Bedrock service (or cross-region access configured)
  string bucket = 1;
  
  // Required: S3 object key (path to the object within the bucket).
  // The full path to the object within the S3 bucket, including any prefixes or folder structure.
  //
  // Key format:
  // - Can contain any Unicode characters
  // - Represents the full path from bucket root to the object
  // - May include forward slashes (/) to represent folder structure
  // - Case-sensitive
  //
  // Examples:
  // - "reports/q3_2024/sales_report.pdf" (object in nested folders)
  // - "documents/invoice_12345.pdf" (object in a folder)
  // - "data.csv" (object at bucket root)
  // - "archive/2024/01/15/document.docx" (deeply nested structure)
  //
  // The key must:
  // - Reference an existing, accessible S3 object
  // - Match the exact object key in S3 (case-sensitive)
  // - Include the file extension if the object has one
  //
  // Note: The key should match the document format specified in the format field
  // of AWSBedrockClaudeDocumentSource for proper processing.
  string key = 2;
}

message AWSBedrockClaudeInferenceConfig {
  // Temperature (0.0-1.0) - mutually exclusive with top_p for Sonnet 4.5/Haiku 4.5
  float temperature = 1;
  
  // Top-P (0.0-1.0) - mutually exclusive with temperature for Sonnet 4.5/Haiku 4.5
  float top_p = 2;
  
  // Top-K (0-500) - available for all models
  uint32 top_k = 3;
}

message AWSBedrockClaudeTool {
