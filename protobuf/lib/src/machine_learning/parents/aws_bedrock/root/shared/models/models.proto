//------------------------------------------------------------------------------
// Model Identification
//------------------------------------------------------------------------------
// Model identifier supporting both enum (known models) and string (custom/unknown models)
//
// IMPORTANT: ALL AWS Bedrock models require a subscription to use.
// This includes all foundation models from all providers:
// - Anthropic Claude models (require use case submission)
// - Mistral AI models
// - Meta Llama models
// - Amazon Titan/Nova models
// - Cohere models
// - AI21 Labs models
// - Stability AI models
// - DeepSeek models
// - Qwen models
// - OpenAI GPT-OSS models
// - Luma AI models
// - TwelveLabs models
// - Writer AI models
// - And all other foundation models
//
// Model Subscription:
// - Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-marketplace-subscribe-to-a-model.html
// - Anthropic Claude: Requires one-time use case submission through model catalog
// - Other models: May require subscription through AWS Bedrock Marketplace
//
// Model ID Format:
// - Full format: {provider}.{model-family}-{version}-{date}-v{revision}:{build}
// - Example: "anthropic.claude-sonnet-4-5-20250929-v1:0"
// - Base format (for availableModels): "{model-family}-{version}-{date}"
// - Example: "claude-sonnet-4-5-20250929"
//
// Supported Models Reference:
// - Complete list: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
// - Model availability by region: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html#model-region-support
message AWSBedrockModelIdentifier {
  oneof model {
    // Enum for known/common models (recommended for type safety)
    // Use this for models that are well-known and frequently used
    AWSBedrockModelEnum common_model = 1;
    
    // String for custom/unknown/new models (flexible option)
    // Use this for:
    // - Newly released models not yet in enum
    // - Custom fine-tuned models
    // - Models from providers not yet fully supported
    // Format: Full model ID (e.g., "anthropic.claude-sonnet-4-5-20250929-v1:0")
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
    string custom_model_id = 2;
  }
}

// Enumeration of commonly used AWS Bedrock foundation models
// This enum provides type-safe access to frequently used models.
// For models not listed here, use custom_model_id in AWSBedrockModelIdentifier.
//
// Model Availability:
// - All models listed here require subscription
// - Some models may have regional availability restrictions
// - Check AWS Bedrock console for current availability: https://console.aws.amazon.com/bedrock/
//
// Model Lifecycle:
// - Models remain available for at least 12 months from launch
// - 60+ days notice before deprecation
// - 60+ days notice before retirement
// - Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
enum AWSBedrockModelEnum {
  AWS_BEDROCK_MODEL_ENUM_UNSPECIFIED = 0;
  
  // ============================================================================
  // Anthropic Claude Models
  // ============================================================================
  // Provider: Anthropic
  // Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
  // Claude Models Guide: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
  // Access: Requires one-time use case submission through AWS Bedrock model catalog
  // Subscription: Required for all Claude models
  
  // Claude Haiku 4.5 (Latest fast model - Released October 2025)
  // Model ID: anthropic.claude-haiku-4-5-20251001-v1:0
  // Base Model: claude-haiku-4-5-20251001
  // Context Window: 200K tokens
  // Use Cases: Low latency, cost-efficient, customer service, chatbots, real-time assistants
  // Availability: Global endpoints, US, EU regions
  // Status: Active, recommended for fast inference
  AWS_BEDROCK_MODEL_ENUM_ANTHROPIC_CLAUDE_HAIKU_4_5 = 1;
  
  // Claude Sonnet 4.5 (Latest intelligent model - Released September 2025)
  // Model ID: anthropic.claude-sonnet-4-5-20250929-v1:0
  // Base Model: claude-sonnet-4-5-20250929
  // Context Window: Up to 1M tokens (preview)
  // Use Cases: Most intelligent model, best for complex agents, finance, research, cybersecurity
  // Availability: Global endpoints, US, EU, Japan regions
  // Status: Active, recommended for production
  AWS_BEDROCK_MODEL_ENUM_ANTHROPIC_CLAUDE_SONNET_4_5 = 2;
  
  // Claude Opus 4.1 (Maximum capability model - Released August 2025)
  // Model ID: anthropic.claude-opus-4-1-20250805-v1:0
  // Base Model: claude-opus-4-1-20250805
  // Context Window: 200K tokens
  // Use Cases: Drop-in replacement for Opus 4, superior performance for coding and agentic applications
  // Availability: US region (us-east-1) only
  // Status: Active
  AWS_BEDROCK_MODEL_ENUM_ANTHROPIC_CLAUDE_OPUS_4_1 = 3;
  
  // Claude Sonnet 3.7 (Deprecated - Retiring February 2026)
  // Model ID: anthropic.claude-3-7-sonnet-20250219-v1:0
  // Base Model: claude-3-7-sonnet-20250219
  // Context Window: 200K tokens
  // Migration: Use Claude Sonnet 4.5
  // Status: Deprecated
  AWS_BEDROCK_MODEL_ENUM_ANTHROPIC_CLAUDE_3_7_SONNET = 4;
  
  // Claude Sonnet 3.5 (Released October 2024)
  // Model ID: anthropic.claude-3-5-sonnet-20241022-v1:0
  // Base Model: claude-3-5-sonnet-20241022
  // Context Window: 200K tokens
  // Use Cases: General purpose, production workloads
  // Status: Active
  AWS_BEDROCK_MODEL_ENUM_ANTHROPIC_CLAUDE_3_5_SONNET = 5;
  
  // ============================================================================
  // Meta Llama Models
  // ============================================================================
  // Provider: Meta
  // Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-meta.html
  // Subscription: Required for all Llama models
  
  // Llama 4 Maverick 17B Instruct (Latest Llama 4 variant - Released April 2025)
  // Model ID: meta.llama4-maverick-17b-instruct-v1:0
  // Base Model: llama4-maverick-17b-instruct
  // Architecture: Mixture-of-Experts (MoE) - 400B total parameters, 128 experts, 17B active per token
  // Context Window: 1M tokens (1,000,000 tokens) - Industry-leading long context
  // Modalities: Text and image input | Text output (Native multimodal)
  // Use Cases: Advanced reasoning, coding, instruction following, multimodal understanding
  // Key Features:
  //   - Superior multimodal performance (image + text understanding)
  //   - Enhanced reasoning capabilities compared to Llama 3
  //   - Multilingual support (12 languages)
  //   - Excellent cost-performance ratio
  //   - Competitive with GPT-4 and Gemini 2.0 on core benchmarks
  // Differences from Llama 3:
  //   - Native multimodality (Llama 3 required separate vision models)
  //   - 8x larger context window (1M vs 128K tokens)
  //   - MoE architecture for efficiency (Llama 3 used dense architecture)
  //   - Improved performance on coding, reasoning, and multimodal tasks
  // When to Use: Production applications requiring advanced reasoning, multimodal understanding,
  //              and long-context processing with optimal cost-performance balance
  // Availability: US East (N. Virginia), US West (Oregon), US East (Ohio) via cross-region inference
  // Status: Active
  AWS_BEDROCK_MODEL_ENUM_META_LLAMA_4_MAVERICK_17B = 10;
  
  // Llama 4 Scout 17B Instruct (Latest Llama 4 variant - Released April 2025)
