  // Format: Array of messages with role (system, user, assistant) and content
  repeated AWSBedrockQwenMessage messages = 1;
  
  // Optional: System prompt defining model behavior
  string system = 2;
  
  // Required: Inference configuration
  AWSBedrockQwenInferenceConfig config = 3;
  
  // Optional: Tool definitions for agentic capabilities
  repeated AWSBedrockQwenTool tools = 4;
}

message AWSBedrockQwenMessage {
  // Required: Message role
  AWSBedrockQwenRole role = 1;
  
  // Required: Message content (text string or content blocks)
  oneof content {
    string text = 2;
    AWSBedrockQwenContentBlocks blocks = 3;
  }
}

enum AWSBedrockQwenRole {
