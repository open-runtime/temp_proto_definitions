  AWS_BEDROCK_COHERE_FINISH_REASON_ERROR = 3;
  
  // Error Toxic - Content filtering detected toxic/harmful content
  // Generation halted due to safety policy violation
  // Action: Modify prompt to comply with content policies
  AWS_BEDROCK_COHERE_FINISH_REASON_ERROR_TOXIC = 4;
  
  // Error Limit - Context limit reached
  // Input exceeded model's context window
  // Action: Reduce input length or use smaller context window
  AWS_BEDROCK_COHERE_FINISH_REASON_ERROR_LIMIT = 5;
  
  // User Cancel - Generation stopped by user
