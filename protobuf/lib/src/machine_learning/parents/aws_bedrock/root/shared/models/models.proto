}

message AWSBedrockQwenContentBlocks {
  repeated AWSBedrockQwenContentBlock blocks = 1;
}

message AWSBedrockQwenContentBlock {
  // Content block (use oneof for type safety)
  oneof content {
    // Text content
    string text = 1;
    
    // Tool use content (for agentic capabilities)
    AWSBedrockQwenToolUse tool_use = 2;
  }
}

// Note: AWSBedrockQwenContentBlockType enum removed - oneof provides type safety

message AWSBedrockQwenTool {
  // Tool name
  string name = 1;
  
  // Tool description
