  AWS_BEDROCK_NOVA_VIDEO_RESOLUTION_540P = 1;
  
  // 720p - High definition
  // Higher quality, larger file size
  // Recommended for: High-quality output, desktop viewing
  AWS_BEDROCK_NOVA_VIDEO_RESOLUTION_720P = 2;
}

// Nova Video Aspect Ratio
// Supported video frame aspect ratios
enum AWSBedrockNovaVideoAspectRatio {
  // Unspecified aspect ratio (uses default)
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_UNSPECIFIED = 0;
  
  // 1:1 - Square format
  // Perfect for: Instagram posts, square social media content
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_1_1 = 1;
  
  // 16:9 - Widescreen landscape format
  // Perfect for: YouTube, standard video content, desktop viewing
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_16_9 = 2;
  
  // 9:16 - Portrait vertical format
  // Perfect for: TikTok, Instagram Stories, mobile vertical content
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_9_16 = 3;
  
  // 4:3 - Classic television format
  // Perfect for: Traditional video content, retro styling
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_4_3 = 4;
  
  // 3:4 - Portrait classic format
  // Perfect for: Portrait video content, mobile viewing
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_3_4 = 5;
  
  // 21:9 - Ultra-widescreen format
  // Perfect for: Cinematic content, ultra-wide displays
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_21_9 = 6;
  
  // 9:21 - Ultra-tall portrait format
  // Perfect for: Full-screen mobile content, tall displays
  AWS_BEDROCK_NOVA_VIDEO_ASPECT_RATIO_9_21 = 7;
}

// Amazon Nova Speech Generation Request (Nova Sonic)
message AWSBedrockNovaSonicRequest {
  // Required: Text to convert to speech
  string input_text = 1;
  
  // Optional: Voice configuration
  AWSBedrockNovaSonicConfig config = 2;
}

message AWSBedrockNovaSonicConfig {
  // Voice ID (model-specific voice identifier)
  string voice_id = 1;
  
  // Speech rate (0.5-2.0) - Speed of speech
  float speech_rate = 2;
  
  // Pitch (-20.0 to 20.0) - Voice pitch adjustment
  float pitch = 3;
}

// Amazon Nova Multimodal Embeddings Request
message AWSBedrockNovaEmbedRequest {
  // Required: Inputs to embed (text, images, audio, video)
  // Format: Array of input objects with type and data
  repeated AWSBedrockNovaEmbedInput inputs = 1;
  
  // Optional: Embedding configuration
  AWSBedrockNovaEmbedConfig config = 2;
}

message AWSBedrockNovaEmbedInput {
  // Required: Input modality type
  // Determines how the input data should be processed
  AWSBedrockNovaInputType type = 1;
  
  // Required: Input data (format depends on type)
  // Type safety enforced by oneof - exactly one field must be set
  oneof input_data {
    // Text data (when type is TEXT)
    // Plain text string to embed
    string text_data = 2;
    
    // Binary media data (when type is IMAGE, AUDIO, or VIDEO)
    // Protobuf automatically handles base64 encoding/decoding in JSON
    // Supported formats:
    // - IMAGE: JPEG, PNG, GIF, WEBP (max 25MB)
    // - AUDIO: Common audio formats
    // - VIDEO: MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP (max 25MB direct, 2GB via S3)
    // Protobuf automatically handles base64 encoding/decoding in JSON serialization
    bytes base64_binary_data = 3;
  }
}

// Nova Input Modality Types
// Supported input types for Amazon Nova Multimodal Embeddings
enum AWSBedrockNovaInputType {
  // Unspecified input type
  AWS_BEDROCK_NOVA_INPUT_TYPE_UNSPECIFIED = 0;
  
  // Text input - Plain text string
  // Maximum length: Model-specific (typically 77 tokens for text embeddings)
  // Use for: Text documents, queries, descriptions
  AWS_BEDROCK_NOVA_INPUT_TYPE_TEXT = 1;
  
  // Image input - Base64-encoded image
  // Supported formats: JPEG, PNG, GIF, WEBP
  // Maximum size: 25 megabytes for direct upload
  // Use for: Image understanding and visual embeddings
  AWS_BEDROCK_NOVA_INPUT_TYPE_IMAGE = 2;
  
  // Audio input - Base64-encoded audio file
  // Supported formats: Model-specific audio formats
  // Maximum size: Model-specific limits
  // Use for: Audio content analysis and embeddings
  AWS_BEDROCK_NOVA_INPUT_TYPE_AUDIO = 3;
  
  // Video input - Base64-encoded video file
  // Supported formats: MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP
  // Maximum size: 25 megabytes (direct upload) or 2 gigabytes (via S3)
  // Maximum length: 1 hour duration
  // Use for: Video content analysis and embeddings
  AWS_BEDROCK_NOVA_INPUT_TYPE_VIDEO = 4;
}

message AWSBedrockNovaEmbedConfig {
  // Required: Embedding output dimension
  // Available dimensions trained using Matryoshka Representation Learning (MRL):
  // - 3072: Maximum accuracy (default, recommended for best quality)
  // - 1024: Balanced performance (good accuracy with reduced storage)
  // - 384: Optimized for speed (faster similarity search)
  // - 256: Minimal storage footprint (smallest embeddings)
  // Lower dimensions provide minimal accuracy degradation due to MRL training
  // Reference: https://aws.amazon.com/blogs/aws/amazon-nova-multimodal-embeddings-now-available-in-amazon-bedrock/
  AWSBedrockNovaEmbeddingDimension dimension = 1;
  
  // Optional: Normalize embeddings to unit length
  // When true, embeddings are normalized to have magnitude 1.0
  // Useful for cosine similarity calculations (dot product = cosine similarity)
  // Default: false
  bool normalize = 2;
}

// Nova Embedding Dimensions
// Matryoshka Representation Learning (MRL) enables using lower dimensions with minimal accuracy loss
enum AWSBedrockNovaEmbeddingDimension {
  // Unspecified dimension (will use default)
  AWS_BEDROCK_NOVA_EMBEDDING_DIMENSION_UNSPECIFIED = 0;
  
  // 256 dimensions - Minimal storage footprint
  // Smallest embeddings, optimized for storage-constrained applications
  // Minimal accuracy degradation due to MRL training
  AWS_BEDROCK_NOVA_EMBEDDING_DIMENSION_256 = 256;
  
  // 384 dimensions - Optimized for speed
  // Faster similarity search operations
  // Good balance between speed and accuracy
  AWS_BEDROCK_NOVA_EMBEDDING_DIMENSION_384 = 384;
  
  // 1024 dimensions - Balanced performance
  // Good accuracy with reduced storage compared to maximum dimension
  // Recommended for most production applications
  AWS_BEDROCK_NOVA_EMBEDDING_DIMENSION_1024 = 1024;
  
  // 3072 dimensions - Maximum accuracy (default)
  // Highest quality embeddings with maximum accuracy
  // Recommended when accuracy is paramount
  AWS_BEDROCK_NOVA_EMBEDDING_DIMENSION_3072 = 3072;
}

//------------------------------------------------------------------------------
// DeepSeek Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock DeepSeek inference format
// Provider: DeepSeek
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-deepseek.html
// Subscription: Required for all DeepSeek models
//
// DeepSeek Model Family:
// - DeepSeek-R1: Advanced reasoning model with RL fine-tuning and CoT capabilities
//   Model ID: us.deepseek.r1-v1:0 (cross-region inference profile)
//   - Mixture of Experts (MoE) architecture: 671B total, 37B active parameters
//   - Transparent chain-of-thought reasoning with step-by-step explanations
//   - Advanced mathematical, scientific, and coding capabilities
//   - Always-on reasoning (cannot be disabled)
// - DeepSeek-V3.1: Latest generation model
// - Distilled versions: 8B and 70B Llama-based for efficient deployment
//
// Critical Constraints:
// - Reasoning is ALWAYS ENABLED (cannot be toggled off)
// - Optimal max_tokens: 8,192 (quality degrades above this threshold)
// - Supports up to 32,768 tokens but not recommended
// - 5-minute timeout for Knowledge Base integration
// - Temperature must be 1 when using reasoning (which is always)
// - Cross-region inference from us-east-1, us-east-2, us-west-2
//
// Key Features:
// - Reinforcement Learning (RL) fine-tuning for adaptation
// - Chain-of-Thought (CoT) reasoning for complex problems
// - Transparent reasoning process exposed via reasoningContent
// - Supports Converse API for unified access
// - Compatible with Amazon Bedrock Guardrails and Knowledge Bases
//
// Prompt Format (for InvokeModel API):
// Special formatting required: <｜begin_of_sentence｜><｜User｜>{prompt}<｜Assistant｜><think>\n
// Converse API handles formatting automatically
//
// Request Format:
// - Use AWSBedrockDeepSeekRequest with messages array (conversational format)
// - Supports both Converse API and InvokeModel operations

// DeepSeek Request (Conversational Format)
message AWSBedrockDeepSeekRequest {
  // Required: Messages array for conversational API
  // Format: Array of messages with role (system, user, assistant) and content
  repeated AWSBedrockDeepSeekMessage messages = 1;
  
  // Optional: System prompt defining model behavior
  string system = 2;
  
  // Required: Inference configuration
  AWSBedrockDeepSeekInferenceConfig config = 3;
  
  // Note: Reasoning is always enabled for DeepSeek R1
  // No reasoning_config parameter needed (always active)
}

message AWSBedrockDeepSeekMessage {
  // Required: Message role
  AWSBedrockDeepSeekRole role = 1;
  
  // Required: Message content
  // Can be text string or content blocks (for reasoning content)
  oneof content {
    string text = 2;
    AWSBedrockDeepSeekContentBlocks blocks = 3;
  }
}

enum AWSBedrockDeepSeekRole {
  // Unspecified role
  AWS_BEDROCK_DEEPSEEK_ROLE_UNSPECIFIED = 0;
  
  // System role - System-level instructions
  AWS_BEDROCK_DEEPSEEK_ROLE_SYSTEM = 1;
  
  // User role - User messages and queries
  AWS_BEDROCK_DEEPSEEK_ROLE_USER = 2;
  
  // Assistant role - Model responses
  AWS_BEDROCK_DEEPSEEK_ROLE_ASSISTANT = 3;
}

message AWSBedrockDeepSeekContentBlocks {
  repeated AWSBedrockDeepSeekContentBlock blocks = 1;
}

message AWSBedrockDeepSeekContentBlock {
  // Content block (use oneof for type safety)
  oneof content {
    // Text content (for regular text responses)
    string text = 1;
    
    // Reasoning content (for chain-of-thought thinking process)
    // Contains the model's intermediate reasoning steps
    AWSBedrockDeepSeekReasoningContent reasoning = 2;
  }
}

// Note: AWSBedrockDeepSeekContentBlockType enum removed - oneof provides type safety

message AWSBedrockDeepSeekReasoningContent {
  // Reasoning text showing step-by-step thinking
  // Contains the model's internal chain-of-thought process
  // Enables users to understand how model arrived at answer
  string reasoning_text = 1;
}

// DeepSeek Inference Configuration
message AWSBedrockDeepSeekInferenceConfig {
  // Temperature (0.0-1.0) - Controls randomness
  // Note: For DeepSeek R1 with reasoning (always enabled), temperature should be 1
  // Lower values: More deterministic (but reasoning requires temp=1)
  // Higher values: More creative exploration
  // Default: 1 (required for reasoning)
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  // Cumulative probability mass to consider
  // Default: model-specific
  float top_p = 2;
  
  // Maximum tokens to generate (0-32,768)
  // CRITICAL: Optimal quality at 8,192 tokens or below
  // Quality degrades significantly above 8,192 threshold
  // Recommended: Keep at or below 8,192 for best results
  // Default: 8,192
  uint32 max_tokens = 3;
  
  // Stop sequences - Custom termination strings
  // Model stops when any sequence is encountered
  repeated string stop_sequences = 4;
}

