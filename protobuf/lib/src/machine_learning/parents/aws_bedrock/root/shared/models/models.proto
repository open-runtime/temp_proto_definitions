  // Differences from Llama 3:
  //   - 78x larger context window (10M vs 128K tokens)
  //   - Native multimodality (Llama 3 required separate vision models)
  //   - MoE architecture for efficiency
  //   - Optimized for long-context tasks (multi-document summarization, extensive codebase analysis)
  // When to Use: Applications requiring extremely long context processing, multi-document analysis,
  //              parsing extensive user activity logs, reasoning over vast codebases
  //              Best choice when context length is more important than raw performance
  // Availability: US East (N. Virginia), US West (Oregon), US East (Ohio) via cross-region inference
  // Note: Amazon Bedrock currently supports up to 3.5M tokens (will expand to 10M shortly)
  // Status: Active
  AWS_BEDROCK_MODEL_ENUM_META_LLAMA_4_SCOUT_17B = 11;
  
  // Llama 3.3 70B Instruct
  // Model ID: meta.llama3-3-70b-instruct-v1:0
  // Base Model: llama3-3-70b-instruct
  // Use Cases: Advanced language understanding, complex reasoning
