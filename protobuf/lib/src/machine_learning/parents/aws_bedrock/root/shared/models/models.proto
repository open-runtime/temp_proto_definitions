enum AWSBedrockStopReason {
  // Unspecified stop reason
  AWS_BEDROCK_STOP_REASON_UNSPECIFIED = 0;
  
  // End Turn - Natural completion
  // Model determined response was complete and concluded naturally
  // This is the ideal case for successful generation
  AWS_BEDROCK_STOP_REASON_END_TURN = 1;
  
  // Max Tokens - Maximum token limit reached
  // Response was truncated because max_tokens limit was hit
  // Action: Increase max_tokens parameter or restructure prompt
  // Response may be incomplete
  AWS_BEDROCK_STOP_REASON_MAX_TOKENS = 2;
  
  // Stop Sequence - Custom stop sequence encountered
  // Model encountered user-specified stop sequence
  // Generation terminated at expected boundary
  AWS_BEDROCK_STOP_REASON_STOP_SEQUENCE = 3;
  
  // Tool Use - Model requested tool/function invocation
  // Model determined that external tool execution is needed
  // Action: Execute indicated tools and continue conversation
  AWS_BEDROCK_STOP_REASON_TOOL_USE = 4;
  
  // Refusal - Model refused to generate response
  // Model declined to answer due to safety, ethics, or policy concerns
  // Distinct from content filtering (which happens after generation)
  AWS_BEDROCK_STOP_REASON_REFUSAL = 5;
  
  // Pause Turn - Multi-turn pause for additional input
  // Model is pausing and expecting additional user input
  // Used in conversational contexts requiring clarification
  AWS_BEDROCK_STOP_REASON_PAUSE_TURN = 6;
  
  // Content Filtered - Output blocked by content filters
  // Generated content violated Responsible AI policies
  // Note: Often returned as HTTP 200 with error field, not exception
  // Check response error field even on successful HTTP status
  AWS_BEDROCK_STOP_REASON_CONTENT_FILTERED = 7;
  
  // Guardrail Intervened - Guardrail blocked or modified content
  // Amazon Bedrock Guardrails intervened on input or output
  // Check guardrail trace for intervention details
  // Response includes guardrailAction field: INTERVENED or NONE
  AWS_BEDROCK_STOP_REASON_GUARDRAIL_INTERVENED = 8;
}

message AWSBedrockError {
  // Required: Error code indicating the error category
  // Maps to HTTP status codes and gRPC error codes
  AWSBedrockErrorCode code = 1;
  
  // Required: Human-readable error message
  // Provides detailed description of what went wrong
  // Use for: User-facing error messages, logging
  string message = 2;
  
  // Required: Exception type indicating the specific error class
  // Identifies the exact AWS Bedrock exception that occurred
  // Use for: Programmatic error handling, error classification
  AWSBedrockExceptionType type = 3;
  
  // Optional: Additional error details
  // Key-value pairs providing context-specific error information
  // Use for: Detailed diagnostics, error reporting
  map<string, string> details = 4;
}

// AWS Bedrock Exception Types
// Specific exception classes thrown by AWS Bedrock APIs
// These map to HTTP status codes and provide detailed error classification
enum AWSBedrockExceptionType {
  // Unspecified exception type
  AWS_BEDROCK_EXCEPTION_TYPE_UNSPECIFIED = 0;
  
  // ValidationException (HTTP 400)
  // Input fails to satisfy Bedrock constraints
  // Common causes: Invalid model ID, missing required fields, invalid parameter values
  // Action: Review request parameters and fix validation errors
  AWS_BEDROCK_EXCEPTION_TYPE_VALIDATION_EXCEPTION = 1;
  
  // InvalidParameterException (HTTP 400)
  // Request parameter is invalid or out of range
  // Common causes: Temperature > 1.0, invalid enum values, malformed JSON
  // Action: Validate parameter values against API documentation
  AWS_BEDROCK_EXCEPTION_TYPE_INVALID_PARAMETER_EXCEPTION = 2;
  
  // AccessDeniedException (HTTP 403)
  // Caller lacks sufficient permissions
  // Common causes: Missing bedrock:InvokeModel permission, insufficient IAM policy
  // Action: Update IAM policies to grant required permissions
  AWS_BEDROCK_EXCEPTION_TYPE_ACCESS_DENIED_EXCEPTION = 3;
  
  // ThrottlingException (HTTP 429)
  // Request denied due to exceeding account quotas
  // Common causes: Too many requests per second, quota limits exceeded
  // Action: Implement exponential backoff retry, request quota increase
  AWS_BEDROCK_EXCEPTION_TYPE_THROTTLING_EXCEPTION = 4;
  
  // ModelTimeoutException (HTTP 408)
  // Request exceeded model timeout length
  // Common causes: Long-running inference, large inputs, model processing delay
  // Action: Increase timeout, optimize request size, retry with smaller inputs
  AWS_BEDROCK_EXCEPTION_TYPE_MODEL_TIMEOUT_EXCEPTION = 5;
  
  // InternalServerException (HTTP 500)
  // Internal server error occurred
  // Common causes: Transient service failures, unexpected errors
  // Action: Retry with exponential backoff (may be transient)
  AWS_BEDROCK_EXCEPTION_TYPE_INTERNAL_SERVER_EXCEPTION = 6;
  
  // ModelErrorException (HTTP 424)
  // Request failed due to model processing error
  // Common causes: Model-specific errors, processing failures
  // Action: Inspect request, try different model, check model availability
  AWS_BEDROCK_EXCEPTION_TYPE_MODEL_ERROR_EXCEPTION = 7;
  
  // ModelNotReadyException (HTTP 429)
  // Model is not ready to serve inference requests
  // Common causes: Model initialization, provisioning in progress
  // Action: AWS SDK auto-retries up to 5 times, wait and retry
  AWS_BEDROCK_EXCEPTION_TYPE_MODEL_NOT_READY_EXCEPTION = 8;
  
  // ModelStreamErrorException (HTTP 424)
  // Error occurred while streaming response
  // Common causes: Stream interruption, model error during streaming
  // Action: Retry request, check network connectivity
  AWS_BEDROCK_EXCEPTION_TYPE_MODEL_STREAM_ERROR_EXCEPTION = 9;
  
  // ResourceNotFoundException (HTTP 404)
  // Specified resource ARN was not found
  // Common causes: Invalid model ID, wrong region, resource deleted
  // Action: Verify model ID, check region availability, verify resource exists
  AWS_BEDROCK_EXCEPTION_TYPE_RESOURCE_NOT_FOUND_EXCEPTION = 10;
  
  // ConflictException (HTTP 400)
  // Error occurred due to conflict while performing operation
  // Common causes: Resource in conflicting state, concurrent modifications
  // Action: Resolve conflict, retry operation
  AWS_BEDROCK_EXCEPTION_TYPE_CONFLICT_EXCEPTION = 11;
  
  // ServiceUnavailableException (HTTP 503)
  // Service is temporarily unavailable
  // Common causes: Regional capacity issues, service maintenance
  // Action: Retry with exponential backoff, consider cross-region inference
  AWS_BEDROCK_EXCEPTION_TYPE_SERVICE_UNAVAILABLE_EXCEPTION = 12;
  
  // ServiceQuotaExceededException (HTTP 400)
  // Number of requests exceeds service quota
  // Common causes: Account-level quota limits, rate limiting
  // Action: Request quota increase, implement rate limiting
  AWS_BEDROCK_EXCEPTION_TYPE_SERVICE_QUOTA_EXCEEDED_EXCEPTION = 13;
  
  // UnauthorizedException (HTTP 401)
  // Authentication credentials are invalid or missing
  // Common causes: Missing credentials, invalid access key, expired token
  // Action: Verify credentials, refresh tokens, check credential validity
  AWS_BEDROCK_EXCEPTION_TYPE_UNAUTHORIZED_EXCEPTION = 14;
  
  // ForbiddenException (HTTP 403)
  // Request is forbidden (similar to AccessDeniedException)
  // Common causes: Insufficient permissions, policy restrictions
  // Action: Review IAM policies, verify permissions
  AWS_BEDROCK_EXCEPTION_TYPE_FORBIDDEN_EXCEPTION = 15;
  
  // IncompleteSignature (HTTP 400)
  // Request signature does not conform to AWS standards
  // Common causes: Outdated SDK version, misconfigured credentials
  // Action: Update AWS SDK, verify credential configuration
  AWS_BEDROCK_EXCEPTION_TYPE_INCOMPLETE_SIGNATURE = 16;
  
  // InvalidClientTokenId (HTTP 403)
  // AWS access key ID does not exist in AWS records
  // Common causes: Invalid access key, deleted credentials
  // Action: Verify access key ID, create new credentials if needed
  AWS_BEDROCK_EXCEPTION_TYPE_INVALID_CLIENT_TOKEN_ID = 17;
  
  // InvalidAction (HTTP 400)
  // Action or operation requested is invalid
  // Common causes: Invalid operation name, unsupported API version
  // Action: Verify operation name spelling, check API support
  AWS_BEDROCK_EXCEPTION_TYPE_INVALID_ACTION = 18;
  
  // NotAuthorized (HTTP 400)
  // Caller does not have permission to perform requested action
  // Common causes: Insufficient IAM permissions, policy restrictions
  // Action: Add required IAM permissions for action
  AWS_BEDROCK_EXCEPTION_TYPE_NOT_AUTHORIZED = 19;
  
  // RequestExpired (HTTP 400)
  // Request is no longer valid due to expired timestamp
  // Common causes: System clock out of sync, request too old
  // Action: Synchronize system clock with reliable time source
  AWS_BEDROCK_EXCEPTION_TYPE_REQUEST_EXPIRED = 20;
  
  // OptInRequired (HTTP 403)
  // AWS access key ID needs subscription for the service
  // Common causes: Service not enabled for account, subscription required
  // Action: Enable service subscription, complete account setup
  AWS_BEDROCK_EXCEPTION_TYPE_OPT_IN_REQUIRED = 21;
  
  // ResourceInUseException (HTTP 400)
  // Resource is currently being used by other resources or operations
  // Common causes: Active dependencies, concurrent operations
  // Action: Wait for dependencies to complete, retry operation
  AWS_BEDROCK_EXCEPTION_TYPE_RESOURCE_IN_USE_EXCEPTION = 22;
  
  // TooManyTagsException (HTTP 400)
  // Request contains more tags than can be associated with resource
  // Common causes: Exceeding 50 tags per resource limit
  // Action: Reduce number of tags, remove unnecessary tags
  AWS_BEDROCK_EXCEPTION_TYPE_TOO_MANY_TAGS_EXCEPTION = 23;
  
  // FTUFormNotFilled (HTTP 404)
  // First-time use form not completed (Anthropic Claude models)
  // Common causes: Missing use case submission for Claude models
  // Action: Complete Anthropic use case details form in AWS console
  AWS_BEDROCK_EXCEPTION_TYPE_FTU_FORM_NOT_FILLED = 24;
  
  // MPAgreementBeingCreated (HTTP 403)
  // Marketplace subscription agreement is being created
  // Common causes: Subscription processing in progress
  // Action: Wait 15 minutes for processing completion, retry
  AWS_BEDROCK_EXCEPTION_TYPE_MP_AGREEMENT_BEING_CREATED = 25;
}

//------------------------------------------------------------------------------
// Error Codes
//------------------------------------------------------------------------------
// Comprehensive error code enumeration mapping HTTP status codes to semantic error types
// These codes align with AWS Bedrock API error responses and gRPC error codes
//
// Error Handling Best Practices:
// - Always check response.hasError() before accessing success fields
// - Use error.code for programmatic error handling
// - Use error.message for user-facing error messages
// - Use error.type to identify specific exception types (e.g., "ValidationException")
//
// HTTP Status Code Mapping:
// - Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/CommonErrors.html
// - Common Errors: https://docs.aws.amazon.com/bedrock/latest/APIReference/CommonErrors.html
enum AWSBedrockErrorCode {
  // Unspecified error (should not occur in normal operation)
  AWS_BEDROCK_ERROR_UNSPECIFIED = 0;
  
  // Validation Error (HTTP 400)
  // Occurs when request parameters are invalid or malformed
  // Common causes:
  // - Invalid model ID format
  // - Missing required fields
  // - Invalid parameter values (e.g., temperature > 1.0)
  // - Malformed JSON in request body
  // - Responsible AI input deflection (text or image content policy violation)
  // Exception types: ValidationException, InvalidParameterException
  //
  // Responsible AI Input Deflection Messages:
  // - Text violation: "This request has been blocked by our content filters. Please adjust your text prompt to submit a new request"
  // - Image violation: "This request has been blocked by our content filters. Please adjust your input image to submit a new request"
  AWS_BEDROCK_ERROR_VALIDATION_ERROR = 1;
  
  // Throttling Error (HTTP 429)
  // Occurs when request rate exceeds service limits
  // Common causes:
  // - Too many requests per second
  // - Account-level rate limits exceeded
  // - Model-specific rate limits exceeded
  // Retry strategy: Exponential backoff with jitter
  // Exception types: ThrottlingException, TooManyRequestsException, ModelNotReadyException
  AWS_BEDROCK_ERROR_THROTTLING_ERROR = 2;
  
  // Timeout Error (HTTP 408, 504)
  // Occurs when request exceeds time limits
  // Common causes:
  // - Request timeout (408): Client-side timeout
  // - Gateway timeout (504): Server-side timeout, model taking too long
  // - Model inference timeout (Nova: 60min, DeepSeek with KB: 5min)
  // Retry strategy: Retry with longer timeout or smaller max_tokens
  // Exception types: RequestTimeoutException, GatewayTimeoutException, ModelTimeoutException
  AWS_BEDROCK_ERROR_TIMEOUT_ERROR = 3;
  
  // Service Unavailable Error (HTTP 503)
  // Occurs when service is temporarily unavailable
  // Common causes:
  // - Service maintenance
  // - Regional service outage
  // - Model temporarily unavailable
  // Retry strategy: Retry with exponential backoff
  // Exception types: ServiceUnavailableException
  AWS_BEDROCK_ERROR_SERVICE_UNAVAILABLE = 4;
  
  // Internal Server Error (HTTP 500)
  // Occurs when service encounters an unexpected error
  // Common causes:
  // - Service-side bug
  // - Model inference failure
  // - Unexpected service state
  // Retry strategy: Retry with exponential backoff (may be transient)
  // Exception types: InternalServerException, InternalFailureException
  AWS_BEDROCK_ERROR_INTERNAL_ERROR = 5;
  
  // Stream Error (HTTP 424)
  // Occurs when streaming response encounters an error mid-stream
  // Common causes:
  // - Model error during generation
  // - Network interruption during stream
  // - Model timeout during streaming
  // Note: This error is returned within the stream, not as HTTP status
  // Exception types: ModelStreamErrorException, ModelErrorException
  AWS_BEDROCK_ERROR_STREAM_ERROR = 6;
  
  // Authentication Error (HTTP 401)
  // Occurs when authentication credentials are invalid or missing
  // Common causes:
  // - Missing AWS credentials
  // - Invalid access key ID or secret access key
  // - Expired session token
  // - Invalid Bedrock API key
  // Exception types: UnauthorizedException, InvalidClientTokenId
  AWS_BEDROCK_ERROR_AUTHENTICATION_ERROR = 7;
  
  // Authorization Error (HTTP 403)
  // Occurs when authenticated user lacks permission to perform the action
  // Common causes:
  // - IAM user/role lacks bedrock:InvokeModel permission
  // - Model subscription not active
  // - Model access not granted for account
  // - Guardrail blocking request
  // - First-time use form not completed (Anthropic Claude)
  // Exception types: AccessDeniedException, ForbiddenException, FTUFormNotFilled
  AWS_BEDROCK_ERROR_AUTHORIZATION_ERROR = 8;
  
  // Not Found Error (HTTP 404)
  // Occurs when requested resource does not exist
  // Common causes:
  // - Model ID not found
  // - Invalid region
  // - Model not available in specified region
  // - Resource deleted or never existed
  // Exception types: ResourceNotFoundException, ModelNotFoundException
  AWS_BEDROCK_ERROR_NOT_FOUND_ERROR = 9;
  
  // Content Filter Error (HTTP 200 with error field - not an exception)
  // Occurs when generated output violates content policies
  // IMPORTANT: This is NOT a thrown exception - inference succeeds (HTTP 200)
  // but response contains an error field indicating content was filtered
  //
  // Responsible AI Output Deflection Messages:
  // - Text generation: "The generated text has been blocked by our content filters"
  // - Image generation (all): "All of the generated images have been blocked by our content filters"
  // - Image generation (partial): "Some of the generated images have been blocked by our content filters"
  // - Video generation: Job status = "Failed", failureMessage = "The generated video has been blocked by our content filters"
  //
  // Note: Check response.hasError() or finish_reason field even on HTTP 200
  AWS_BEDROCK_ERROR_CONTENT_FILTER = 10;
  
  // Guardrail Intervention (HTTP 200 with intervention trace)
  // Occurs when guardrails block or modify content
  // Guardrails can intervene on input or output
  // Response includes guardrail trace showing intervention details
  // Check guardrailAction field: INTERVENED or NONE
  AWS_BEDROCK_ERROR_GUARDRAIL_INTERVENTION = 11;
}

//------------------------------------------------------------------------------
// Streaming Messages - RAW AWS BEDROCK SSE EVENTS
//------------------------------------------------------------------------------
// ARCHITECTURAL DESIGN EXPLANATION:
//
// AWS Bedrock streaming uses TWO distinct message types:
//
// 1. AWSBedrockStreamMessage - RAW SSE events from AWS Bedrock API
//    - Represents individual Server-Sent Events as they arrive from AWS
//    - Maps 1:1 to AWS Bedrock's event stream protocol
//    - Used internally by the HTTP client layer to parse SSE responses
//    - Contains granular events: start, delta, stop, metadata, error
//    - NOT directly useful for application code (too granular)
//
// 2. AWSBedrockInferenceResponse - ACCUMULATED complete responses
//    - Represents accumulated, complete responses for application use
//    - Consistent with non-streaming Predict() method return type
//    - Adapter layer converts stream of SSE events → stream of responses
//    - Each response represents the current accumulated state
//    - Directly usable by application code
//
// WHY THIS ARCHITECTURE?
// - Consistency: Both Predict() and PredictWithStream() return same response type
// - Simplicity: Applications don't need to understand SSE event lifecycle
// - Flexibility: Internal SSE events can change without breaking application code
// - Type Safety: Adapter layer handles complex event accumulation logic
//
// FLOW DIAGRAM:
//   AWS Bedrock API (SSE events)
//        ↓
//   BedrockHttpClient.invokeModelWithResponseStream()
//        ↓
//   Stream<AWSBedrockStreamMessage> (raw SSE events)
//        ↓
//   Adapter: stream_to_response.dart extension
//        ↓
//   Stream<AWSBedrockInferenceResponse> (accumulated responses)
//        ↓
//   Application Code (same type as Predict!)
//
// USAGE IN IMPLEMENTATION:
// - service.dart PredictWithStream() returns Stream<AWSBedrockInferenceResponse>
// - Internal: HTTP client emits Stream<AWSBedrockStreamMessage>
// - Adapter: .toInferenceResponses() converts between the two
// - Result: Application code sees consistent response types
//
// SCOPE:
// - Used ONLY for TEXT GENERATION models (Claude, Llama, Mistral, etc.)
// - NOT used for embedding models (embeddings return complete vectors, no streaming)
// - NOT used for async operations (video generation uses StartAsyncInvoke)
//
// AWS BEDROCK SSE STREAMING PROTOCOL:
//
// HTTP Endpoint:
// - URL: POST https://bedrock-runtime.{region}.amazonaws.com/model/{modelId}/invoke-with-response-stream
// - Request Content-Type: application/json
// - Response Content-Type: application/vnd.amazon.eventstream (AWS event stream binary format)
// - Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeModelWithResponseStream.html
//
// Response Headers:
// - X-Amzn-Bedrock-Content-Type: Actual content type (application/json)
// - X-Amzn-Bedrock-PerformanceConfig-Latency: standard | optimized
// - X-Amzn-Bedrock-Service-Tier: priority | default | flex
// - Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-invoke.html
//
// Event Stream Lifecycle (typical text generation):
//   1. messageStart - Model begins response (role: "assistant")
//   2. contentBlockStart - First content block begins (index: 0, type: text)
//   3. contentBlockDelta (x N) - Incremental text chunks arrive
//   4. contentBlockStop - Content block completes (index: 0)
//   5. messageDelta - Stop reason and usage updates (optional)
//   6. messageStop - Message generation complete (stopReason)
//   7. metadata - Final usage stats and metrics
//
// Supported Models for Streaming:
// - Anthropic Claude: All variants (Haiku, Sonnet, Opus)
// - Amazon Nova: Micro, Lite, Pro, Premier
// - Meta Llama: All variants
// - Mistral AI: All variants including Pixtral
// - Cohere: Command models
// - AI21 Labs: Jamba and Jurassic-2 models
// - DeepSeek: R1 with reasoning streaming
// - Qwen: All variants
// - OpenAI GPT-OSS: Both 120B and 20B
//
// NOT Supported for Streaming:
// - Embedding models (return complete vectors, no incremental generation)
// - Image generation models (return complete images via StartAsyncInvoke)
// - Video generation models (use StartAsyncInvoke for async processing)
// - Reranking models (return complete rankings)
//
// Error Handling in Streams:
// - Errors can occur at any point in the stream
// - Error event contains: code (HTTP status), message, type (exception name)
// - Once error event appears, stream terminates
// - Clients must handle partial responses when errors occur mid-stream
// - Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
//
// Event Stream Format: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ResponseStream.html
// ConverseStream Events: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ConverseStream.html
// Streaming Best Practices: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference-call.html

message AWSBedrockStreamMessage {
  // Event union - exactly one event type per message (enforced by oneof)
  // Clients process events sequentially, accumulating state as they arrive
  oneof event {
    // Message Start Event - Signals beginning of model response
    // Always first event in stream, contains assistant role
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageStartEvent.html
    AWSBedrockStreamStart start = 1;
    
    // Content Block Start Event - Signals beginning of new content block
    // Precedes contentBlockDelta events for the block
    // Contains content block index and type information
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockStartEvent.html
    AWSBedrockStreamContentBlockStart content_block_start = 2;
    
    // Content Block Delta Event - Incremental content within current block
    // Most frequent event type during streaming
    // Contains partial text, tool inputs, or other incremental content
    // Clients must accumulate deltas to reconstruct complete content
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockDeltaEvent.html
    AWSBedrockStreamContentBlockDelta content_block_delta = 3;
    
    // Content Block Stop Event - Signals completion of current content block
    // Marks end of delta events for this block
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockStopEvent.html
    AWSBedrockStreamContentBlockStop content_block_stop = 4;
    
    // Message Delta Event - Updates to message-level metadata
    // Contains stop reason and usage information updates
    // May appear before messageStop to provide early usage stats
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageDeltaEvent.html
    AWSBedrockStreamMessageDelta message_delta = 5;
    
    // Message Stop Event - Signals completion of entire response
    // Final event before metadata
    // Contains definitive stop reason
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageStopEvent.html
    AWSBedrockStreamMessageStop message_stop = 6;
    
    // Metadata Event - Final usage statistics and metrics
    // Always last event in successful streams
    // Contains token usage, latency, cache usage, guardrail traces
    // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ConverseStreamMetadataEvent.html
    AWSBedrockStreamMetadata metadata = 7;
    
    // Error Event - Indicates stream error occurred
    // Can appear at any point if error occurs
    // Once error appears, stream terminates
    // Contains HTTP status code, error message, exception type
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
    AWSBedrockStreamError error = 8;
  }
}

// MessageStart Event - First event in stream
// Signals that the model has begun generating a response
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageStartEvent.html
//
// Event Lifecycle Position: FIRST (index 1 of ~7-100+ events)
// Frequency: Once per response
// Purpose: Initialize client state, display "model is thinking" UI
// Contains: Assistant role only
// Action: Prepare buffers for accumulating content
message AWSBedrockStreamStart {
  // Role of the message being generated
  // Always AWS_BEDROCK_CLAUDE_ROLE_ASSISTANT for model responses
  // User messages don't appear in response streams (only in requests)
  AWSBedrockClaudeRole role = 1;
}

// ContentBlockStart Event - Signals beginning of content block
// Precedes all delta events for a given content block
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockStartEvent.html
//
// Event Lifecycle Position: After messageStart, before deltas (index ~2)
// Frequency: Once per content block (typically 1 for simple text, 2+ for tool use)
// Purpose: Identify content block type and prepare accumulation strategy
// Contains: Block index (0-based), optional block type metadata
// Action: Initialize block-specific accumulation buffer
//
// Content Block Types:
// - Text: Plain text response content (most common)
// - Tool Use: Model requesting external tool/function invocation
// - Thinking: Extended thinking/reasoning content (Claude 4+)
message AWSBedrockStreamContentBlockStart {
  // Zero-based index of the content block starting
  // First block: 0, second block: 1, etc.
  // Used to route delta events to correct accumulation buffer
  uint32 content_block_index = 1;
  
  // Optional: Block type information (for tool use blocks)
  // Text blocks typically have no additional metadata at start
  // Tool use blocks include tool name and initial metadata
  // Note: Type safety enforced by oneof in AWSBedrockClaudeContentBlock
}

// ContentBlockDelta Event - Incremental content within block
// Contains partial text, tool arguments, or thinking content
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockDeltaEvent.html
//
// Event Lifecycle Position: Between contentBlockStart and contentBlockStop
// Frequency: MOST FREQUENT - 10 to 1000+ per response depending on length
// Purpose: Deliver incremental content as model generates it
// Contains: Partial text strings, JSON fragments, or reasoning text
// Action: Append delta to accumulation buffer, update UI in real-time
//
// Delta Accumulation Strategy:
// - Text deltas: Simple string concatenation (delta1 + delta2 + delta3...)
// - Tool use deltas: JSON fragment merging (partial JSON strings)
// - Thinking deltas: Reasoning text concatenation (chain-of-thought)
//
// Performance Notes:
// - Deltas may be single characters or multi-word chunks
// - Delta size varies based on model generation speed and network buffering
// - Clients must handle empty deltas (transmission placeholders)
// - No guaranteed minimum/maximum delta size
message AWSBedrockStreamContentBlockDelta {
  // Content block index this delta applies to
  // Routes delta to correct accumulation buffer
  // Multiple blocks may be streaming simultaneously
  uint32 content_block_index = 1;
  
  // Delta type indicating what kind of content this is
  // Determines how client should process and accumulate the delta
  AWSBedrockStreamDeltaType delta_type = 2;
  
  // Text delta content (when delta_type is TEXT_DELTA)
  // Partial text string to append to accumulated text
  // May be empty (heartbeat/placeholder) or contain 1+ characters
  // Must be concatenated with previous deltas in order
  string text = 3;
  
  // Thinking/reasoning delta (when delta_type is THINKING_DELTA)
  // For extended thinking mode (Claude 4+) or DeepSeek R1 reasoning
  // Contains partial chain-of-thought reasoning text
  // Accumulate separately from main response text
  string thinking = 4;
  
  // Partial JSON delta (when delta_type is PARTIAL_JSON_DELTA)
  // For structured output or tool use input parameters
  // JSON fragments that must be accumulated and parsed together
  // WARNING: JSON may be split mid-object, handle parsing carefully
  string partial_json = 5;
}

// Delta Type Enum - Identifies content type within delta events
// Determines how clients should process and accumulate delta content
enum AWSBedrockStreamDeltaType {
  // Unspecified delta type (should not occur)
  AWS_BEDROCK_STREAM_DELTA_TYPE_UNSPECIFIED = 0;
  
  // Text Delta - Incremental text content for the response
  // Most common delta type for standard text generation
  // Action: Append to text accumulation buffer
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockDelta.html
  AWS_BEDROCK_STREAM_DELTA_TYPE_TEXT_DELTA = 1;
  
  // Thinking Delta - Chain-of-thought reasoning content
  // Used by extended thinking (Claude 4+) and reasoning models (DeepSeek R1)
  // Contains transparent reasoning process before final answer
  // Action: Accumulate separately, display in "thinking" UI section
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-thinking.html
  AWS_BEDROCK_STREAM_DELTA_TYPE_THINKING_DELTA = 2;
  
  // Partial JSON Delta - JSON fragments for structured outputs
  // Used for tool use input parameters or structured output mode
  // JSON may be split across multiple deltas (mid-object, mid-array)
  // Action: Accumulate and parse only when complete
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
  AWS_BEDROCK_STREAM_DELTA_TYPE_PARTIAL_JSON_DELTA = 3;
}

// ContentBlockStop Event - Marks completion of content block
// Signals all deltas for this block have been sent
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ContentBlockStopEvent.html
//
// Event Lifecycle Position: After last delta for block, before next block or messageStop
// Frequency: Once per content block
// Purpose: Finalize block accumulation, trigger block-level processing
// Contains: Block index only
// Action: Finalize accumulated content, trigger callbacks, move to next block
message AWSBedrockStreamContentBlockStop {
  // Index of the content block that has completed
  // Matches the content_block_index from preceding start/delta events
  uint32 content_block_index = 1;
}

// MessageDelta Event - Updates to message-level metadata during generation
// Provides early access to stop reason and usage before message completes
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageDeltaEvent.html
//
// Event Lifecycle Position: After contentBlockStop, before messageStop (optional)
// Frequency: 0 or 1 per response (not always present)
// Purpose: Provide early stop reason and usage information
// Contains: Stop reason, stop sequence, partial usage stats
// Action: Update UI with stop reason, prepare for message completion
message AWSBedrockStreamMessageDelta {
  // Reason why generation is stopping
  // Provides early indicator before messageStop event
  // Allows clients to prepare UI for completion (e.g., show "..." if max_tokens)
  AWSBedrockStopReason stop_reason = 1;
  
  // Specific stop sequence that triggered stopping (if any)
  // Only present if stop_reason is STOP_SEQUENCE
  string stop_sequence = 2;
  
  // Partial usage statistics available at this point
  // May be incomplete - final usage comes in metadata event
  AWSBedrockUsage usage = 3;
}

// MessageStop Event - Signals completion of response generation
// Indicates model has finished generating (successfully or due to limit)
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_MessageStopEvent.html
//
// Event Lifecycle Position: After all content blocks, before metadata (index ~N-1)
// Frequency: Once per response
// Purpose: Signal response completion, provide definitive stop reason
// Contains: Final stop reason
// Action: Finalize response accumulation, prepare for metadata
//
// Stop Reasons and Actions:
// - END_TURN: Success, response complete
// - MAX_TOKENS: Truncated, consider increasing max_tokens
// - STOP_SEQUENCE: Hit custom stop sequence, success
// - TOOL_USE: Model needs tool execution, execute tools
// - CONTENT_FILTERED: Content blocked, inform user
// - GUARDRAIL_INTERVENED: Guardrail blocked, check guardrail trace
message AWSBedrockStreamMessageStop {
  // Final reason why the model stopped generating
  // Definitive stop reason (messageDelta may have provided preview)
  // Critical for determining next action in application logic
  AWSBedrockStopReason stop_reason = 1;
}

// Metadata Event - Final statistics and performance metrics
// Always last event in successful stream sequences
// Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ConverseStreamMetadataEvent.html
//
// Event Lifecycle Position: LAST (index N)
// Frequency: Once per response (if successful)
// Purpose: Provide complete usage stats, metrics, cache info, guardrail traces
// Contains: Token usage, latency, cache hits/misses, guardrail details
// Action: Update billing/usage tracking, log metrics, close stream
//
// Usage for Cost Tracking:
// - inputTokens: Billed at input token rate
// - outputTokens: Billed at output token rate (usually higher)
// - cacheCreationInputTokens: Billed at cache write rate
// - cacheReadInputTokens: Billed at discounted cache read rate (90% savings)
message AWSBedrockStreamMetadata {
  // Token usage statistics
  // CRITICAL for billing - all Bedrock pricing is token-based
  // inputTokens + outputTokens = total billable tokens
  // Reference: https://aws.amazon.com/bedrock/pricing/
  AWSBedrockUsage usage = 1;
  
  // Cache usage statistics (if prompt caching enabled)
  // Shows cache hits (read) and cache writes (creation)
  // Cache reads provide ~90% cost savings vs regular input tokens
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  AWSBedrockCacheUsage cache_usage = 2;
  
  // Performance metrics
  // latencyMs: End-to-end request latency in milliseconds
  // Useful for monitoring and optimizing performance
  AWSBedrockMetrics metrics = 3;
}

// StreamError Event - Error that occurred during streaming
// Terminates the stream when appears
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/troubleshooting-api-error-codes.html
//
// Event Lifecycle Position: Can appear AT ANY TIME if error occurs
// Frequency: 0 or 1 per stream (only if error occurs)
// Purpose: Communicate streaming errors, terminate stream gracefully
// Contains: HTTP status code, error message, exception type
// Action: Log error, clean up partial response, inform user
//
// Common Streaming Errors:
// - 424 ModelStreamErrorException: Model error during generation
// - 408/504 TimeoutException: Generation exceeded timeout
// - 429 ThrottlingException: Rate limit exceeded mid-stream
// - 500 InternalServerException: Service error during generation
//
// Error Handling Strategy:
// 1. Preserve any accumulated content from before error
// 2. Log error details for debugging/monitoring
// 3. Inform user that response is incomplete
// 4. Consider retry with exponential backoff for transient errors
// 5. Don't retry for 4xx errors (validation, authorization)
message AWSBedrockStreamError {
  // HTTP status code indicating error type
  // Maps to AWSBedrockErrorCode enum for consistent handling
  // Common values: 400 (validation), 429 (throttling), 500 (internal), 424 (stream error)
  uint32 code = 1;
  
  // Human-readable error message
  // Describes what went wrong
  // May include suggestions for resolution
  // Example: "Model timeout exceeded: reduce max_tokens or simplify prompt"
  string message = 2;
  
  // AWS exception type name
  // Identifies specific exception class for programmatic handling
  // Examples: "ModelStreamErrorException", "ThrottlingException", "ValidationException"
  // Use for: Error categorization, retry logic, monitoring/alerting
  // Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/CommonErrors.html
  string type = 3;
}

//------------------------------------------------------------------------------
// Embedding Request/Response (Dedicated Endpoint) - SEMANTIC SEPARATION FROM PREDICT
//------------------------------------------------------------------------------
// ARCHITECTURAL DESIGN RATIONALE:
//
// WHY SEPARATE EMBED FROM PREDICT?
//
// 1. SEMANTIC CLARITY:
//    - Predict: Text generation, conversational AI, content creation
//    - Embed: Vector generation for semantic search, RAG, clustering
//    - Different use cases, different mental models, different API semantics
//
// 2. TYPE SAFETY:
//    - Predict returns text/content blocks (AWSBedrockInferenceResponse)
//    - Embed returns numeric vectors (AWSBedrockEmbedResponse)
//    - Trying to use wrong response type would be compile-time error
//
// 3. API CLARITY:
//    - Client code: service.predict(request) vs service.embed(request)
//    - Intention is immediately clear from method name
//    - No need to inspect request content to understand operation type
//
// 4. FUTURE EXTENSIBILITY:
//    - Embed can evolve independently (batch embeddings, compression, etc.)
//    - Predict can evolve independently (new content types, streaming modes)
//    - No risk of breaking changes affecting the other
//
// 5. CONSISTENCY WITH INDUSTRY:
//    - OpenAI API: separate endpoints for chat/completions vs embeddings
//    - Google Vertex: separate methods for generateContent vs embedContent
//    - Anthropic: Messages API vs future embedding API (when released)
//
// UNDER THE HOOD:
// - Both Predict and Embed call AWS Bedrock InvokeModel endpoint
// - HTTP endpoint is the same: POST /model/{modelId}/invoke
// - Difference is semantic (what you're asking for) not technical (how it's called)
// - Protobuf separation enforces best practices at API design level
//
// EMBEDDING USE CASES:
// - Semantic search: Embed documents and queries, find similar via cosine similarity
// - RAG (Retrieval Augmented Generation): Embed knowledge base, retrieve relevant docs
// - Clustering: Embed items, cluster by vector proximity
// - Classification: Embed text, classify based on embedding space regions
// - Recommendation: Embed items and users, recommend based on proximity
// - Anomaly detection: Embed normal data, detect outliers via distance
//
// SUPPORTED EMBEDDING MODELS:
//
// Amazon Titan Embeddings:
// - titan-embed-text-v1: 1536 dimensions, text-only
// - titan-embed-text-v2:0: 256/512/1024 dimensions (configurable), text-only
// - titan-embed-image-v1: 1024 dimensions, text + image multimodal
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
//
// Amazon Nova Multimodal Embeddings:
// - nova-2-multimodal-embeddings-v1:0: 256/384/1024/3072 dimensions (Matryoshka)
// - Supports text, image, video, audio, document inputs
// - Unified vector space for all modalities
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/nova-multimodal-embed.html
//
// Cohere Embed:
// - embed-english-v3: English text, 1024 dimensions
// - embed-multilingual-v3: 100+ languages, 1024 dimensions
// - embed-v4:0: Enhanced accuracy, 256-1536 dimensions, text + image
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed.html
//
// TwelveLabs Marengo:
// - marengo-embed-2-7: Video-native embeddings, 1024 dimensions, 2-hour videos
// - marengo-embed-3-0: Enhanced, 512 dimensions, 4-hour videos, 36 languages
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-marengo-3.html
//
// EMBEDDING DIMENSIONS AND TRADEOFFS:
// - Higher dimensions (1024-3072): Better accuracy, more storage, slower search
// - Lower dimensions (256-512): Lower accuracy, less storage, faster search
// - Matryoshka training (Nova): Lower dimensions retain most accuracy
//
// NORMALIZATION:
// - Normalized embeddings have magnitude 1.0
// - Enables cosine similarity via simple dot product
// - Without normalization: use arccos(dot(a,b) / (||a|| * ||b||))
// - With normalization: similarity = dot(a, b) directly
//
// NO STREAMING FOR EMBEDDINGS:
// - Embedding generation is atomic (complete vector or nothing)
// - Cannot partially generate vector (unlike text which is sequential)
// - Always use synchronous InvokeModel, never InvokeModelWithResponseStream
// - For large videos (TwelveLabs), use StartAsyncInvoke (async job, not stream)

message AWSBedrockEmbedRequest {
  // Required: AWS region (e.g., "us-east-1", "us-west-2")
  // Used to construct endpoint URL: bedrock-runtime.{region}.amazonaws.com
  // Must match region where model is available
  // Reference: https://docs.aws.amazon.com/general/latest/gr/bedrock.html
  string region = 1;
  
  // Required: Model identifier for embedding model
  // ONLY embedding models allowed - text generation models will error
  // 
  // Supported Embedding Models:
  // - Amazon Titan: amazon.titan-embed-text-v1, amazon.titan-embed-text-v2:0, amazon.titan-embed-image-v1
  // - Amazon Nova: amazon.nova-2-multimodal-embeddings-v1:0
  // - Cohere: cohere.embed-english-v3, cohere.embed-multilingual-v3, cohere.embed-v4:0
  // - TwelveLabs: twelvelabs.marengo-embed-2-7-v1:0, twelvelabs.marengo-embed-3-0-v1:0
  //
  // DO NOT use text generation models here:
  // - Claude, Llama, Mistral, etc. are for Predict(), not Embed()
  // - Using wrong model type will cause ValidationException
  AWSBedrockModelIdentifier model_identifier = 2;
  
  // Model-specific embedding request formats
  // EXACTLY ONE must be set (enforced by oneof)
  // Choice determines which embedding model is being invoked
  oneof embed_format {
    // Amazon Titan Text Embeddings (V1, V2)
    // For: Pure text embedding
    // Output: 1536-dim (V1) or 256/512/1024-dim (V2)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
    AWSBedrockTitanEmbedRequest titan_embed = 10;
    
    // Amazon Titan Multimodal Embeddings G1
    // For: Text + image combined embedding
    // Output: 1024-dim unified vector space
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-mm.html
    AWSBedrockTitanMultimodalEmbedRequest titan_multimodal_embed = 11;
    
    // Amazon Nova Multimodal Embeddings
    // For: Text, image, video, audio, document unified embedding
    // Output: 256/384/1024/3072-dim (Matryoshka trained)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/nova-multimodal-embed.html
    AWSBedrockNovaEmbedRequest nova_embed = 12;
    
    // Cohere Embed (V3, V4)
    // For: Text and image embedding (V4), text-only (V3)
    // Output: 1024-dim (V3) or 256-1536-dim (V4)
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed.html
    AWSBedrockCohereEmbedRequest cohere_embed = 13;
    
    // TwelveLabs Marengo Embed (2.7, 3.0)
    // For: Video-native multimodal embeddings (video, audio, image, text)
    // Output: 1024-dim (2.7) or 512-dim (3.0)
    // Note: Large videos use StartAsyncInvoke (async), not this endpoint
    // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-marengo-3.html
    AWSBedrockTwelveLabsEmbedRequest twelvelabs_embed = 14;
  }
  
  // Optional: Global configuration (guardrails not applicable to embeddings)
  // Note: Embeddings don't support guardrails or prompt caching
  // This field reserved for future use
  AWSBedrockGlobalConfig global_config = 3;
}

message AWSBedrockEmbedResponse {
  // Response union - either success with embeddings or error
  // CRITICAL: Always check which is set before accessing fields
  oneof result {
    // Success: Contains embedding vector(s)
    AWSBedrockEmbedSuccess success = 1;
    
    // Error: Embedding generation failed
    // Common errors: ValidationException (wrong input), ThrottlingException (rate limit)
    AWSBedrockError error = 2;
  }
}

message AWSBedrockEmbedSuccess {
  // Model-specific embedding responses
  // EXACTLY ONE will be set (enforced by oneof)
  // Corresponds to the embed_format in request
  oneof provider {
    // Amazon Titan Embeddings response
    // Contains: Single embedding vector + token count
    AWSBedrockTitanEmbedResponse titan_embed = 10;
    
    // Amazon Nova Embeddings response
    // Contains: Single embedding vector + dimension info
    AWSBedrockNovaEmbedResponse nova_embed = 11;
    
    // Cohere Embed response
    // Contains: Embeddings by type (float, int8, uint8, binary, ubinary)
    AWSBedrockCohereEmbedResponse cohere_embed = 12;
    
    // TwelveLabs Marengo Embed response
    // Contains: Multiple embeddings (one per video segment) + temporal metadata
    AWSBedrockTwelveLabsEmbedResponse twelvelabs_embed = 13;
  }
  
  // Optional: Usage statistics (if provided by embedding model)
  // Some embedding models return token counts for billing
  // Others don't provide usage stats (billed per API call)
  AWSBedrockUsage usage = 20;
  
  // Optional: Performance metrics
  // latencyMs: How long embedding generation took
  AWSBedrockMetrics metrics = 21;
}

// Titan Text Embeddings Response
// Returns a single dense vector representing text semantic meaning
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
message AWSBedrockTitanEmbedResponse {
  // Dense embedding vector
  // Length: 1536 floats (V1) or 256/512/1024 floats (V2, configured via output_dimension)
  // Values: Typically in range [-1.0, 1.0] if normalized
  // Usage: Cosine similarity, dot product (if normalized), clustering
  repeated float embedding = 1;
  
  // Input token count (for billing)
  // Number of tokens in input text that were embedded
  // Billing: Per input token (check AWS Bedrock pricing)
  uint32 input_tokens = 2;
}

// Nova Multimodal Embeddings Response
// Returns a single unified vector across all input modalities
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/nova-multimodal-embed.html
message AWSBedrockNovaEmbedResponse {
  // Dense multimodal embedding vector
  // Length: 256/384/1024/3072 floats (configured via dimension in request)
  // Matryoshka trained: Lower dimensions retain most accuracy
  // Example: 384-dim retains ~97% of 3072-dim accuracy
  // Usage: Cross-modal search (query with text, find videos), unified semantic space
  repeated float embedding = 1;
  
  // Actual embedding dimension returned
  // Should match requested dimension in AWSBedrockNovaEmbedConfig
  // Useful for validation and vector database storage planning
  uint32 dimension = 2;
}

//------------------------------------------------------------------------------
// Token Counting
//------------------------------------------------------------------------------

message AWSBedrockTokenCount {
  uint32 input_tokens = 1;
}

