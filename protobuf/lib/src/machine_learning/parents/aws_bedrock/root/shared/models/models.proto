//------------------------------------------------------------------------------
// Response Messages
//------------------------------------------------------------------------------

// Top-level inference response with error handling
// Top-level response message for AWS Bedrock inference
// Used for both Predict (unary) and PredictWithStream (streaming) methods
//
// STREAMING RESPONSE PATTERN - CLIENT CHOICE:
// Each streamed response provides BOTH accumulated and delta content,
// allowing clients to choose their preferred consumption pattern:
//
// Option 1: Use ACCUMULATED content (simpler, stateless client)
//   - Access: response.success.claude.content.first.text
//   - Contains: Complete text accumulated so far
//   - Client code: Just replace UI with latest accumulated text
//   - Best for: Simple UIs, stateless components, easier debugging
//
// Option 2: Use DELTA content (more efficient for large responses)
//   - Access: response.delta.text
//   - Contains: Only the NEW text since last response
//   - Client code: Append delta to your own accumulation buffer
//   - Best for: Large responses, bandwidth optimization, custom processing
//
// Option 3: Use BOTH (maximum flexibility)
//   - Validate accumulated matches your delta accumulation (correctness check)
//   - Use delta for efficient processing, accumulated as fallback
//   - Best for: Production systems requiring robustness
//
// For Predict (non-streaming):
//   - Returns a single complete response with all content
//   - delta field will be empty (no previous response to delta from)
//   - Usage statistics are included in the success.usage field
//
// For PredictWithStream (streaming):
//   - Returns stream of responses, each with both accumulated and delta
//   - Early responses: delta and accumulated build up
//   - Final response: Complete accumulated content + final delta + usage stats
//
// Example usage patterns:
//
//   // Pattern 1: Accumulated (Simpler - Stateless Client)
//   await for (final response in client.predictWithStream(request)) {
//     if (response.hasSuccess()) {
//       final fullText = response.success.claude.content.first.text;
//       replaceUI(fullText);  // Just replace entire text each time
//     }
//   }
//
//   // Pattern 2: Delta (More Efficient - Stateful Client)
//   String myAccumulation = "";
//   await for (final response in client.predictWithStream(request)) {
//     if (response.hasDelta() && response.delta.hasText()) {
//       myAccumulation += response.delta.text;  // Manual accumulation
//       appendToUI(response.delta.text);  // Append only new text
//     }
//   }
//
//   // Pattern 3: Both (Validation - Production)
//   String myAccumulation = "";
//   await for (final response in client.predictWithStream(request)) {
//     if (response.hasDelta() && response.delta.hasText()) {
//       myAccumulation += response.delta.text;
//       
//       // Validate our accumulation matches server's
//       final serverAccumulated = response.success.claude.content.first.text;
//       assert(myAccumulation == serverAccumulated, "Accumulation mismatch!");
//       
//       appendToUI(response.delta.text);
//     }
//   }
message AWSBedrockInferenceResponse {
  oneof result {
    // Success response with complete accumulated content
    AWSBedrockInferenceSuccess success = 1;
    
    // Error response (terminates stream if streaming)
    AWSBedrockError error = 2;
  }
  
  // Optional: Delta content (ONLY populated in streaming responses)
  // Contains ONLY the incremental change since previous response
  // Empty for non-streaming Predict() responses
  // Empty for first streaming response (nothing to delta from)
  // Populated for subsequent streaming responses
  //
  // Client choice:
  // - Use accumulated (in success field) for stateless client
  // - Use delta (this field) for efficient stateful client
  // - Use both for validation and robustness
  AWSBedrockResponseDelta delta = 3;
}

// Response Delta - Incremental changes since previous response
// ONLY populated in streaming responses (PredictWithStream)
// Contains ONLY what's new, not what was already sent
//
// Purpose: Bandwidth efficiency for large responses
// Use case: Client maintains own accumulation buffer
// Alternative: Use accumulated content in success field (simpler)
message AWSBedrockResponseDelta {
  // Text delta - new text since last response
  // Append this to your accumulation buffer
  // Empty if no new text (e.g., metadata-only update)
  string text = 1;
  
  // Thinking delta - new reasoning text (DeepSeek R1, Claude extended thinking)
  // Accumulate separately from main text
  string thinking = 2;
  
  // Tool call delta - new tool invocation data
  // For complex tool calls spanning multiple deltas
  string tool_call_json = 3;
  
  // Content block index this delta applies to
  // Useful when multiple blocks are streaming
  // Default: 0 (first/only block)
  uint32 content_block_index = 4;
}

message AWSBedrockInferenceSuccess {
  // Model-specific provider responses
  // Each provider has distinct response structures reflecting their native API patterns
  // Access pattern: response.success.provider.claude, response.success.provider.llama, etc.
  oneof provider {
    // Anthropic Claude response (Messages API format)
    AWSBedrockClaudeResponse claude = 10;
    
    // Meta Llama response (Instruction format)
    AWSBedrockLlamaResponse llama = 11;
    
    // Amazon Titan response (Text, Embeddings, Image Generator)
    AWSBedrockTitanResponse titan = 12;
    
    // Amazon Nova response (Understanding and Generation)
    AWSBedrockNovaResponse nova = 13;
    
    // Mistral AI response (supports both prompt-based and messages API formats)
    // See AWSBedrockMistralResponse documentation for format details
    AWSBedrockMistralResponse mistral = 14;
    
    // Cohere Command response (Text generation)
    AWSBedrockCohereResponse cohere = 15;
    
    // Cohere Embed response (Text/image embeddings)
    AWSBedrockCohereEmbedResponse cohere_embed = 16;
    
    // Cohere Rerank response (Document reranking)
    AWSBedrockCohereRerankResponse cohere_rerank = 17;
    
    // AI21 Labs Jamba response (Conversational format)
    AWSBedrockAI21Response ai21 = 18;
    
    // AI21 Labs Jurassic-2 response (Completion format)
    AWSBedrockAI21JurassicResponse ai21_jurassic = 19;
    
