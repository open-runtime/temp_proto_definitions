syntax = "proto3";

import "lib/src/google/protobuf/struct.proto";
import "lib/src/google/protobuf/timestamp.proto";

package runtime.aot.machine_learning.parents.aws_bedrock;

// =============================================================================
// AWS Bedrock Inference Protocol Buffer Definition
// =============================================================================
// This file defines the protocol buffer messages and enums for AWS Bedrock
// inference service. It provides a model-agnostic interface supporting multiple
// model families including Anthropic Claude, Amazon Titan, Meta Llama, Mistral AI,
// Cohere, AI21 Labs, Stability AI, and others.
//
// Core Design Principles:
// 1. Model-Agnostic: Supports multiple model families with different API formats
// 2. Type Safety: Extensive use of oneofs and enums for compile-time checks
// 3. Extensibility: Struct fallback for unknown/custom models
// 4. Streaming: Built-in support for both streaming and non-streaming responses
// 5. Error Handling: Type-safe error responses using oneof pattern
//
// AWS Bedrock API Documentation:
// - API Reference: https://docs.aws.amazon.com/bedrock/latest/APIReference/
// - Runtime API Operations: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations_Amazon_Bedrock_Runtime.html
// - InvokeModel: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeModel.html
// - InvokeModelWithResponseStream: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeModelWithResponseStream.html
// - User Guide: https://docs.aws.amazon.com/bedrock/latest/userguide/
// - Inference API Guide: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-api.html
//
// HTTP Endpoints:
// - Base URL: https://bedrock-runtime.{region}.amazonaws.com
// - InvokeModel: POST /model/{modelId}/invoke
// - InvokeModelWithResponseStream: POST /model/{modelId}/invoke-with-response-stream
// - Authentication: AWS Signature Version 4 (SigV4)
// - Content-Type: application/json (request), application/json or application/vnd.amazon.eventstream (response)
//
// Model-Specific API Documentation:
// - Claude Messages API: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages.html
// - Llama Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-meta.html
// - Mistral Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral.html
// - Titan Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan.html
// - Cohere Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-cohere.html
// - AI21 Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jamba.html
// - Stability AI: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-stability-diffusion.html
// - Nova Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-nova.html
// - DeepSeek Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-deepseek.html
// - Qwen Models: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-qwen.html
//
// Model Constraints and Limits:
// - Token Limits: Vary by model (see individual model enum comments for context window sizes)
// - Rate Limits: Account-level and model-specific limits apply (check AWS console)
// - Regional Availability: Models may not be available in all regions (check model enum comments)
// - Subscription Requirements: ALL models require subscription (see model enum comments)
// - Request Size Limits: 4.5 MB for Converse API, 500 MB for Bedrock Data Automation
// - Response Size Limits: Model-dependent (check AWS documentation)
// - Timeout Limits: 60 minutes for Nova models, 5 minutes for DeepSeek with Knowledge Bases
// - Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
//
// Error Handling Best Practices:
// - Always check response.hasError() before accessing success fields
// - Use error.code for programmatic error handling (retry logic, circuit breakers)
// - Use error.message for user-facing error messages
// - Use error.type to identify specific exception types for detailed handling
// - Implement exponential backoff with jitter for throttling errors (HTTP 429)
// - Handle partial responses when streaming errors occur mid-stream
// - Check for content filtering even on HTTP 200 responses
// - Reference: See AWSBedrockErrorCode enum for comprehensive error handling guide
//
// Streaming Best Practices:
// - Use accumulate=false for production (reduces bandwidth, improves performance)
// - Accumulate deltas client-side: myText += response.delta.text
// - Handle errors mid-stream gracefully (partial responses may be valid)
// - Monitor stream health (timeouts, interruptions)
// - Use unified stream helpers for simplified stream processing
// - Reference: See AWSBedrockStreamMessage documentation for event lifecycle
//
// =============================================================================
//------------------------------------------------------------------------------
// Initialization Messages
//------------------------------------------------------------------------------

message AWSBedrockInferenceInitialization {
  // NOTE: These credential fields are currently NOT USED by the service implementation.
  // All credential management is handled externally (via environment variables, AWS SDK
  // default credential chain, or other external configuration mechanisms).
  // These fields are reserved for future use when credential passing is implemented.
  //
  // SECURITY WARNING: These fields may contain sensitive credentials.
  // Ensure proper access controls and encryption when transmitting or storing.
  //
  // Optional: Credentials configuration for authentication
  // If not provided, credentials will be loaded from environment variables
  //
  // Two options:
  // 1. Use credentials_config for multiple credentials (supports credential selection by name)
  // 2. Use single credential via oneof for simpler runtime use
  //
  // If both are provided, the single credential (oneof) takes precedence for immediate use,
  // while credentials_config provides a credential pool for selection.
  AWSBedrockCredentialsConfig credentials_config = 1;
  
  // Optional: Single credential instance for authentication
  // Alternative to credentials_config when only one credential is needed
  // Can be either an access key credential or an API key
  // SECURITY WARNING: Contains sensitive authentication data
  oneof credential {
    AWSBedrockAccessKeyCredential access_key_credential = 2;
    AWSBedrockApiKey api_key = 3;
  }
}

message InitializedAWSBedrockInference {
}

//------------------------------------------------------------------------------
// Credentials Configuration
//------------------------------------------------------------------------------
// Supports both AWS Access Key credentials and Bedrock Long-term API Keys
// At least one credential type must be provided
//
// IMPORTANT AUTHENTICATION CLARIFICATION:
//
// 1. AWS Access Key Credentials (AWSBedrockAccessKeyCredential):
//    - Used for AWS Signature Version 4 (SigV4) authentication
//    - This is the STANDARD method for calling AWS Bedrock Runtime API directly
//    - Requires: access_key (Access Key ID) + secret_key (Secret Access Key)
//    - Works with: InvokeModel, InvokeModelWithResponseStream, StartAsyncInvoke, etc.
//    - Direct API calls to: https://bedrock-runtime.{region}.amazonaws.com
//
// 2. Bedrock API Keys (AWSBedrockApiKey with bearer_token):
//    - Used for Bearer token authentication (NOT for direct Bedrock Runtime API)
//    - Bedrock API keys are service-specific credentials managed via AWS IAM
//    - The bearer_token field contains the actual API key value (ABSK... format)
//    - These are primarily used for:
//      a) Third-party integrations that don't support SigV4
//      b) OpenAI SDK compatibility (using OpenAI Chat Completions API format)
//      c) Proxy services that translate Bearer tokens to SigV4 calls
//    - When using OpenAI SDK with Bedrock: Set api_key=bearer_token, base_url=bedrock endpoint
//
// AUTHENTICATION FLOW RECOMMENDATION:
// - For standard Bedrock SDK usage: Use AWSBedrockAccessKeyCredential with SigV4
// - For OpenAI SDK compatibility: Use AWSBedrockApiKey with bearer_token
// - For proxy/gateway services: Design determines which credential type to use
//
// Management URLs:
// - Access Keys: https://console.aws.amazon.com/iam/home#/security_credentials
//   Click "Create access key" to generate new credentials
// - Bedrock API Keys: https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/api-keys/long-term/create
//   (Replace us-east-1 with your region)

message AWSBedrockCredentialsConfig {
  // Access key credentials (for SigV4 authentication)
  // API sends "access_key_credentials" (snake_case) or "accessKeyCredentials" (camelCase)
  repeated AWSBedrockAccessKeyCredential access_key_credentials = 1 [json_name = "access_key_credentials"];
  
  // API keys (for Bearer token authentication)
  // API sends "api_keys" (snake_case) or "apiKeys" (camelCase)
  repeated AWSBedrockApiKey api_keys = 2 [json_name = "api_keys"];
  
  // Whether credentials are stored in GCP Secrets Manager
  // When true, credentials in access_key_credentials and api_keys may be
  // placeholder/reference values pointing to secrets stored in GCP Secrets Manager
  // When false, credentials are stored directly in the database
  bool is_stored = 3 [json_name = "is_stored"];
  
  // Last update timestamp for this credentials configuration
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp updated_at = 4 [json_name = "updated_at"];
}

message AWSBedrockAccessKeyCredential {
  // Optional name to identify this credential
  string name = 1;
  
  // Required: AWS Access Key ID
  // Get from: https://console.aws.amazon.com/iam/home#/security_credentials
  // API sends "access_key" (snake_case) or "accessKey" (camelCase)
  string access_key = 2 [json_name = "access_key"];
  
  // Required: AWS Secret Access Key
  // Get from: https://console.aws.amazon.com/iam/home#/security_credentials
  // API sends "secret_key" (snake_case) or "secretKey" (camelCase)
  string secret_key = 3 [json_name = "secret_key"];
  
  // Optional: AWS Session Token (for temporary credentials from STS)
  // Only used for temporary credentials obtained via AssumeRole or similar
  string session_token = 4 [json_name = "session_token"];
  
  // Optional: AWS Region (e.g., "us-east-1")
  // Defaults to "us-east-1" if not specified
  string region = 5;
  
  // Optional: Metadata about this credential (for tracking and management)
  // Populated when retrieving metadata from AWS IAM
  AWSBedrockAccessKeyMetadata metadata = 6;
}

message AWSBedrockAccessKeyMetadata {
  // When this credential was created
  // Retrieved from AWS IAM access key metadata
  google.protobuf.Timestamp created_at = 1 [json_name = "created_at"];
  
  // When this credential was last used
  // Retrieved from AWS IAM access key last used information
  // May be null if credential has never been used
  google.protobuf.Timestamp last_used_at = 2 [json_name = "last_used_at"];
  
  // Status of the credential
  // Indicates whether the credential is currently usable
  AWSBedrockAccessKeyStatus status = 3;
  
  // Additional metadata key-value pairs
  // Can include: region_last_used, service_last_used, etc.
  map<string, string> additional_metadata = 4;
}

// AWS Access Key Status
// Indicates the current state of an AWS access key credential
enum AWSBedrockAccessKeyStatus {
  // Unspecified status
  AWS_BEDROCK_ACCESS_KEY_STATUS_UNSPECIFIED = 0;
  
  // Active - Credential is valid and can be used for API calls
  // Credential is enabled and ready for use
  AWS_BEDROCK_ACCESS_KEY_STATUS_ACTIVE = 1;
  
  // Inactive - Credential exists but is disabled
  // Credential cannot be used until re-enabled
  // Use for: Temporarily disabling credentials without deletion
  AWS_BEDROCK_ACCESS_KEY_STATUS_INACTIVE = 2;
}

message AWSBedrockApiKey {
  // Required: API key name
  // 
  // Name Format:
  // - Full format: "BedrockAPIKey-tzf4-at-605134436431"
  //   - Base name: "BedrockAPIKey-tzf4" (the actual key identifier)
  //   - Suffix: "-at-605134436431" (AWS account ID, used for IAM lookup)
  // 
  // When querying IAM for metadata, use the base name (without "-at-{account-id}") 
  // as the IAM username. The suffix is only needed for the full ServiceUserName format.
  // 
  // Example:
  //   Full name: "BedrockAPIKey-tzf4-at-605134436431"
  //   Base name (for IAM lookup): "BedrockAPIKey-tzf4"
  //   Account ID: "605134436431"
  //
  // Create/manage at: https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/api-keys/long-term/create
  // (Replace us-east-1 with your region)
  string name = 1;
  
  // Required: Bearer token (API key value, e.g., "ABSK...")
  // This is the actual bearer token used for Authorization: Bearer <token> header
  // Format: 132-character string starting with "ABSK" prefix
  // Contains Base64-encoded metadata including IAM user name and AWS account ID
  // Get from: https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/api-keys/long-term/create
  // Maps to AwsCredentials.bearerToken in Dart
  // NOTE: Both APIs (user-team-service and inference service) use "key" field name
  // Proto field is bearerToken (Dart property) but JSON uses "key" for compatibility
  string bearer_token = 2 [json_name = "key"];
  
  // Optional: Comprehensive metadata about this API key
  // Populated when retrieving metadata from AWS IAM using:
  // aws iam list-service-specific-credentials --service-name bedrock.amazonaws.com
  AWSBedrockApiKeyMetadata metadata = 3;
}

message AWSBedrockApiKeyMetadata {
  // Unique identifier for the credential (20-128 characters)
  // Used for credential lifecycle management operations
  string credential_id = 1;
  
  // Base name of the API key (without the "-at-{account-id}" suffix)
  // Example: "BedrockAPIKey-tzf4" (extracted from full name "BedrockAPIKey-tzf4-at-605134436431")
  string base_name = 2;
  
  // AWS Account ID extracted from the name suffix
  // Example: "605134436431" (from "BedrockAPIKey-tzf4-at-605134436431")
  string account_id = 3;
  
  // IAM user name associated with this credential (1-64 characters)
  // This is the IAM user who owns/created the credential
  string iam_user_name = 4;
  
  // Service-specific username (generated by AWS)
  // Format: "{iam_user_name}-at-{account_id}" or "{iam_user_name}-at-{account_id}+1" for secondary keys
  // Example: "BedrockAPIKey-tzf4-at-605134436431"
  string service_user_name = 5;
  
  // Service credential alias (public portion of the credential)
  // Contains version and creation information (0-200 characters)
  // Specific to Bedrock API keys
  string service_credential_alias = 6;
  
  // Service name (always "bedrock.amazonaws.com" for Bedrock API keys)
  string service_name = 7;
  
  // Current status of the credential
  AWSBedrockApiKeyStatus status = 8;
  
  // When the credential was created
  // Immutable after creation
  google.protobuf.Timestamp created_at = 9;
  
  // When the credential will expire
  // Only present if credential was created with an expiration date
  // Can be set to 1-36,600 days from creation
  // If absent, credential never expires
  google.protobuf.Timestamp expires_at = 10;
  
  // Whether this is a primary or secondary credential
  // Each IAM user can have up to 2 long-term service-specific credentials per service
  // (e.g., 2 Bedrock API keys, 2 CodeCommit credentials, 2 Keyspaces credentials)
  // Short-term Bedrock API keys are unlimited but expire automatically
  // Primary: false or unset (first credential), Secondary: true (second credential)
  // Note: Access keys also have a limit of 2 per IAM user, but are separate from service-specific credentials
  bool is_secondary = 11;
  
  // Additional metadata for tracking and management
  map<string, string> additional_metadata = 12;
}

enum AWSBedrockApiKeyStatus {
  // Unspecified status
  AWS_BEDROCK_API_KEY_STATUS_UNSPECIFIED = 0;
  
  // Active - Credential is valid and can be used for API calls
  // Credential is enabled and ready for use
  AWS_BEDROCK_API_KEY_STATUS_ACTIVE = 1;
  
  // Inactive - Credential exists but is disabled
  // Credential cannot be used until re-enabled
  // Use for: Temporarily disabling credentials without deletion
  AWS_BEDROCK_API_KEY_STATUS_INACTIVE = 2;
  
  // Expired - Credential has passed its expiration date
  // Credential can no longer be used
  // Use for: Credentials with expiration dates that have elapsed
  AWS_BEDROCK_API_KEY_STATUS_EXPIRED = 3;
}

