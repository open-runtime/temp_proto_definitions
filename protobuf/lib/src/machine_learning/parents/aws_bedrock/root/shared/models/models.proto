// Maps to AWS Bedrock Amazon Nova inference format
// Provider: Amazon
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-nova.html
// Subscription: Required for all Nova models
//
// Amazon Nova Model Family:
// - Nova Understanding Models: Text and image comprehension (Micro, Lite, Pro, Premier)
//   - Text input/output: All models
//   - Image input: Pro and Premier models
//   - Video input: Pro and Premier models
// - Nova Generation Models: Image and video creation
//   - Nova Canvas: Image generation from text
//   - Nova Reel: Video generation from text/images
//   - Nova Sonic: Speech generation
// - Nova Multimodal Embeddings: Text, image, audio, video embeddings
//
// Important Constraints:
// - Inference timeout: 60 minutes (significantly longer than default SDK timeout)
// - Must increase SDK read_timeout to at least 3600 seconds
// - Supports both InvokeModel and Converse API
//
// Request Format:
// - Understanding models: Use AWSBedrockNovaRequest with messages and inferenceConfig
// - Generation models: Use AWSBedrockNovaRequest with task-specific parameters
// - Embeddings: Use AWSBedrockNovaEmbedRequest with inputs

// Amazon Nova Understanding Request
// Used for Nova Micro, Lite, Pro, Premier models
message AWSBedrockNovaRequest {
  // Required: Messages array for conversational API
  // Format: Array of messages with role (user, assistant) and content
  repeated AWSBedrockNovaMessage messages = 1;
  
  // Optional: System prompt defining model behavior
  string system = 2;
  
  // Required: Inference configuration
  AWSBedrockNovaInferenceConfig inference_config = 3;
}

message AWSBedrockNovaMessage {
  // Required: Message role
  AWSBedrockNovaRole role = 1;
  
  // Required: Message content
  // Can be text string or content blocks (text + images for Pro/Premier)
  oneof content {
    string text = 2;
    AWSBedrockNovaContentBlocks blocks = 3;
  }
}

enum AWSBedrockNovaRole {
  // Unspecified role
  AWS_BEDROCK_NOVA_ROLE_UNSPECIFIED = 0;
  
  // User role - User messages and queries
  AWS_BEDROCK_NOVA_ROLE_USER = 1;
  
  // Assistant role - Model responses
  AWS_BEDROCK_NOVA_ROLE_ASSISTANT = 2;
}

message AWSBedrockNovaContentBlocks {
  repeated AWSBedrockNovaContentBlock blocks = 1;
}

message AWSBedrockNovaContentBlock {
  // Content block (use oneof for type safety)
  oneof content {
    // Text content
    string text = 1;
    
    // Image content (binary bytes, base64-encoded in JSON, for Pro/Premier models)
    // Protobuf automatically handles base64 encoding/decoding in JSON serialization
    bytes base64_image = 2;
  }
}

// Note: AWSBedrockNovaContentBlockType enum removed - oneof in AWSBedrockNovaContentBlock provides type safety

// Amazon Nova Inference Configuration
message AWSBedrockNovaInferenceConfig {
  // Maximum tokens to generate
  // Default varies by model
  uint32 max_tokens = 1;
  
  // Stop sequences - Custom termination strings
  repeated string stop_sequences = 2;
  
  // Temperature (0.0-1.0) - Controls randomness
  // Lower values: More deterministic
  // Higher values: More creative
  float temperature = 3;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  float top_p = 4;
}

// Amazon Nova Image Generation Request (Nova Canvas)
message AWSBedrockNovaCanvasRequest {
  // Required: Text prompt describing desired image
  string prompt = 1;
  
  // Optional: Image generation configuration
  AWSBedrockNovaCanvasConfig config = 2;
}

message AWSBedrockNovaCanvasConfig {
  // Image width in pixels
  uint32 width = 1;
  
  // Image height in pixels
  uint32 height = 2;
  
  // Number of images to generate (1-4)
  uint32 number_of_images = 3;
  
  // Image quality level
  AWSBedrockNovaImageQuality quality = 4;
  
  // Random seed for reproducibility
  uint32 seed = 5;
}

// Nova Image Quality Levels
enum AWSBedrockNovaImageQuality {
  // Unspecified quality (uses default)
  AWS_BEDROCK_NOVA_IMAGE_QUALITY_UNSPECIFIED = 0;
  
  // Standard - Faster generation, good quality
  AWS_BEDROCK_NOVA_IMAGE_QUALITY_STANDARD = 1;
  
  // Premium - Higher quality, slower generation
  AWS_BEDROCK_NOVA_IMAGE_QUALITY_PREMIUM = 2;
}

// Amazon Nova Video Generation Request (Nova Reel)
// Note: Uses StartAsyncInvoke API (asynchronous)
message AWSBedrockNovaReelRequest {
  // Required: Text prompt describing desired video
  string prompt = 1;
  
  // Optional: Input image for image-to-video (binary bytes)
  // Protobuf automatically handles base64 encoding/decoding in JSON
  // Supported formats: JPEG, PNG
  // Min resolution: 512x512, Max: 4096x4096
  // Protobuf automatically handles base64 encoding/decoding in JSON serialization
  bytes base64_input_image = 2;
  
  // Optional: Video generation configuration
  AWSBedrockNovaReelConfig config = 3;
}

message AWSBedrockNovaReelConfig {
  // Required: Video duration
  // Determines length of generated video clip
  AWSBedrockNovaVideoDuration duration = 1;
  
  // Required: Video resolution
  // Controls output video quality and file size
  AWSBedrockNovaVideoResolution resolution = 2;
  
  // Required: Aspect ratio
  // Determines video frame dimensions
  AWSBedrockNovaVideoAspectRatio aspect_ratio = 3;
  
  // Optional: Loop video for continuous playback
  // When true, video loops seamlessly
  // Default: false
  bool loop = 4;
}

// Nova Video Duration
// Supported video clip lengths
enum AWSBedrockNovaVideoDuration {
  // Unspecified duration (uses default)
  AWS_BEDROCK_NOVA_VIDEO_DURATION_UNSPECIFIED = 0;
  
  // 5 seconds - Faster generation (2-5 minutes processing time)
  // Smaller file size (5-25 MB typically)
  // Recommended for: Quick previews, social media content
  AWS_BEDROCK_NOVA_VIDEO_DURATION_5S = 1;
  
  // 9 seconds - Longer clips (4-8 minutes processing time)
  // Larger file size (10-50 MB typically)
  // Recommended for: Extended content, detailed scenes
  AWS_BEDROCK_NOVA_VIDEO_DURATION_9S = 2;
}

// Nova Video Resolution
// Supported video output resolutions
enum AWSBedrockNovaVideoResolution {
  // Unspecified resolution (uses default)
  AWS_BEDROCK_NOVA_VIDEO_RESOLUTION_UNSPECIFIED = 0;
  
  // 540p - Standard definition
