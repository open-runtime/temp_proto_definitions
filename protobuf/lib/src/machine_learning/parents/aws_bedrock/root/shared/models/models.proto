// Mistral AI response structure
// 
// AWS Bedrock returns different response formats depending on the model and API used:
// 
// 1. Older format (Mistral 7B, Mixtral 8x7B - using prompt-based API):
//    {"outputs": [{"text": "...", "stop_reason": "..."}], "usage": {...}}
//    - Uses "outputs" array with "text" and "stop_reason" fields
//    - id, object, and model fields are typically empty
// 
// 2. Newer format (Mistral Large 2402+ - using messages API):
//    {"choices": [{"message": {"content": "..."}, "finish_reason": "..."}], "usage": {...}, "id": "...", "model": "..."}
//    - Uses "choices" array with "message" objects and "finish_reason" field
//    - Includes id, object, and model fields
// 
// The parser automatically detects and handles both formats, mapping them to this unified structure.
message AWSBedrockMistralResponse {
  // Generated choices (multiple responses if n > 1)
  // Populated from either "choices" (newer format) or "outputs" (older format) in the JSON response
  repeated AWSBedrockMistralChoice choices = 1;
  
  // Token usage statistics
  AWSBedrockMistralUsage usage = 2;
  
  // Response ID (unique identifier)
  // Present in Mistral Large (messages API) format, empty for older models
  string id = 3;
  
  // Object type (typically "chat.completion")
  // Present in Mistral Large (messages API) format, empty for older models
  string object = 4;
  
  // Model identifier used for generation
  // Present in Mistral Large (messages API) format, empty for older models
  string model = 5;
}

message AWSBedrockMistralChoice {
  // Choice index (0-based)
  uint32 index = 1;
  
  // Generated message content
  // For older format: message.text is populated from "outputs[].text"
  // For newer format: message.text is populated from "choices[].message.content" (string or content blocks)
  AWSBedrockMistralMessage message = 2;
  
  // Finish reason indicating why generation stopped
  // Provides critical information about response completion status
  // Mapped from "stop_reason" (older format) or "finish_reason" (newer format) in JSON response
  AWSBedrockMistralFinishReason finish_reason = 3;
  
  // Tool calls (if model requested tool invocation)
  repeated AWSBedrockMistralToolCall tool_calls = 4;
}

// Mistral Finish Reasons
// Indicates why Mistral model stopped generating
enum AWSBedrockMistralFinishReason {
  // Unspecified finish reason
  AWS_BEDROCK_MISTRAL_FINISH_REASON_UNSPECIFIED = 0;
  
  // Stop - Model finished generating text normally
  // Standard completion condition where model naturally concluded response
  // Use this when response is complete and satisfactory
  AWS_BEDROCK_MISTRAL_FINISH_REASON_STOP = 1;
  
  // Length - Generation reached maximum token limit
  // Response may be truncated or incomplete
  // Action: Increase max_tokens or restructure prompt
  AWS_BEDROCK_MISTRAL_FINISH_REASON_LENGTH = 2;
  
  // Tool Calls - Model requested tool/function execution
  // Model has determined tool invocation is needed
  // Action: Execute indicated tools and return results
  AWS_BEDROCK_MISTRAL_FINISH_REASON_TOOL_CALLS = 3;
  
  // Model Length - Output truncated due to model constraints
  // Similar to LENGTH but specific to model limitations
  AWS_BEDROCK_MISTRAL_FINISH_REASON_MODEL_LENGTH = 4;
  
  // Error - Error occurred during generation
  // Generation failed due to internal error
  // Action: Retry request or check error details
  AWS_BEDROCK_MISTRAL_FINISH_REASON_ERROR = 5;
}

message AWSBedrockMistralUsage {
  // Prompt tokens (input)
  uint32 prompt_tokens = 1;
  
  // Completion tokens (output)
  uint32 completion_tokens = 2;
  
  // Total tokens (prompt + completion)
  uint32 total_tokens = 3;
}

