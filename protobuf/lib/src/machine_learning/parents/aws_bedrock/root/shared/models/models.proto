  google.protobuf.Struct input_schema = 3;
}

message AWSBedrockClaudeToolChoice {
  // Tool choice configuration
  // Controls when and how tools are used by the model
  oneof choice {
    // Auto - Model decides whether to use tools
    // Model will use tools if it determines they're needed
    AWSBedrockClaudeToolChoiceAuto auto = 1;
    
    // None - Model will not use any tools
    // Forces model to respond without tool invocation
    AWSBedrockClaudeToolChoiceNone none = 2;
    
    // Tool - Force use of specific tool
    // Model must use the specified tool
    AWSBedrockClaudeToolChoiceTool tool = 3;
  }
}

// Claude Tool Choice Auto
// Marker message indicating auto tool choice mode
message AWSBedrockClaudeToolChoiceAuto {
  // Empty message - presence indicates auto mode
}

// Claude Tool Choice None
// Marker message indicating no tool use
message AWSBedrockClaudeToolChoiceNone {
  // Empty message - presence indicates no tool use
}

message AWSBedrockClaudeToolChoiceTool {
  string name = 1;
}

message AWSBedrockClaudeToolUse {
  string id = 1;
  string name = 2;
  google.protobuf.Struct input = 3;
}

message AWSBedrockClaudeToolResult {
  string tool_use_id = 1;
  string content = 2;
  bool is_error = 3;
}

message AWSBedrockClaudeExtendedThinkingConfig {
  bool enabled = 1;
  uint32 budget_tokens = 2;  // Minimum 1024
}

message AWSBedrockClaudeStructuredOutputConfig {
