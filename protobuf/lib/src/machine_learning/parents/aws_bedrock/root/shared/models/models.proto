  // Top-P (0.0-1.0) - Nucleus sampling threshold
  float top_p = 2;
  
  // Maximum tokens to generate
  // Supports up to 256K tokens natively, 1M with extrapolation
  uint32 max_tokens = 3;
  
  // Stop sequences - Custom termination strings
  repeated string stop_sequences = 4;
  
  // Top-K - Number of top tokens to consider
  // Optional parameter for additional sampling control
  uint32 top_k = 5;
}

//------------------------------------------------------------------------------
// OpenAI GPT-OSS Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock OpenAI GPT-OSS inference format
// Provider: OpenAI
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-openai.html
// Subscription: Required for all OpenAI GPT-OSS models
//
// OpenAI GPT-OSS Model Family:
// - gpt-oss-120b: Optimized for production general-purpose and high-reasoning use cases
//   - MoE architecture: 117B total parameters, 5.1B active per token
//   - Context window: 128K tokens
//   - Performance comparable to OpenAI o4-mini on reasoning benchmarks
// - gpt-oss-20b: Optimized for lower latency and specialized use cases
//   - MoE architecture: 21B total parameters, 3.6B active per token
//   - Context window: 128K tokens
//   - Performance similar to o3-mini, can run on edge devices (16 GB memory)
//
// Key Features:
// - Text input and text output modalities
// - 128,000 token context window
// - Supports both InvokeModel and CreateModelInvocationJob (batch inference)
// - Guardrails application through request headers
// - OpenAI Chat Completions API format compatibility
// - Trained with reinforcement learning for reasoning and tool use
// - Supports adjustable reasoning effort (low, medium, high)
//
// Request Format:
// - Use AWSBedrockOpenAIOSSRequest with messages array (OpenAI Chat Completions format)
// - Compatible with OpenAI SDK implementations

// OpenAI GPT-OSS Request (Chat Completions Format)
message AWSBedrockOpenAIOSSRequest {
  // Required: Messages array (OpenAI Chat Completions format)
  // Format: Array of messages with role (user, assistant, system) and content
  repeated AWSBedrockOpenAIOSSMessage messages = 1;
  
  // Required: Model identifier (must match request header modelId)
  // Can be omitted for automatic population
  string model = 2;
  
  // Required: Inference configuration
  AWSBedrockOpenAIOSSInferenceConfig config = 3;
  
  // Optional: Additional OpenAI-specific parameters
  // Passed through to model as-is
  google.protobuf.Struct additionalModelRequestFields = 4;
}

message AWSBedrockOpenAIOSSMessage {
  // Required: Message role
  AWSBedrockOpenAIOSSRole role = 1;
  
  // Required: Message content (text string)
  string content = 2;
}

enum AWSBedrockOpenAIOSSRole {
  // Unspecified role
  AWS_BEDROCK_OPENAI_OSS_ROLE_UNSPECIFIED = 0;
  
  // System role - System-level instructions
  AWS_BEDROCK_OPENAI_OSS_ROLE_SYSTEM = 1;
  
  // User role - User messages and queries
  AWS_BEDROCK_OPENAI_OSS_ROLE_USER = 2;
  
  // Assistant role - Model responses
  AWS_BEDROCK_OPENAI_OSS_ROLE_ASSISTANT = 3;
}

// OpenAI GPT-OSS Inference Configuration
// Maps OpenAI API fields to Converse API fields
message AWSBedrockOpenAIOSSInferenceConfig {
  // Temperature (0.0-2.0) - Controls randomness
  // Maps to temperature in Converse API
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  // Maps to topP in Converse API
  float top_p = 2;
  
  // Maximum completion tokens
  // Maps to maxTokens in Converse API
  uint32 max_completion_tokens = 3;
  
  // Stop sequences
  // Maps to stopSequences in Converse API
  repeated string stop = 4;
  
  // Frequency penalty (-2.0 to 2.0) - Reduces repetition of frequent tokens
  // Positive values discourage repeated tokens, negative values encourage reuse
  // Default: 0
  float frequency_penalty = 5;
  
  // Presence penalty (-2.0 to 2.0) - Penalizes tokens that appeared previously
  // Positive values discourage previously used tokens, negative values encourage reuse
  // Default: 0
  float presence_penalty = 6;
  
  // Top-K - Number of top tokens to consider
  // Optional parameter passed via additionalModelRequestFields
  uint32 top_k = 7;
}

//------------------------------------------------------------------------------
// TwelveLabs Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock TwelveLabs inference format
// Provider: TwelveLabs
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-twelvelabs.html
// Subscription: Required for all TwelveLabs models
//
// TwelveLabs Model Family:
// - Pegasus 1.2: Advanced video-to-text generation (encoder-decoder architecture)
//   Model ID: twelvelabs.pegasus-1-2-v1:0
//   - Content recognition, scene detection, temporal reasoning
//   - Generates textual descriptions, insights, and timestamp-accurate answers
//   - Supports up to 1-hour videos (2GB max)
//   - Intelligent caching for repeated queries on same video
//   - Supports InvokeModel and InvokeModelWithResponseStream
//
// - Marengo Embed 2.7: Multimodal video-native embeddings
//   Model ID: twelvelabs.marengo-embed-2-7-v1:0
//   - 1024-dimensional dense vectors
//   - 2-hour video support (2GB max), 77 token text, 12 languages
//   - Embedding types: visual-text, visual-image, audio
//   - Dynamic shot boundary detection or fixed segmentation
//   - Supports StartAsyncInvoke (async) and InvokeModel (sync for text/image)
//
// - Marengo Embed 3.0: Enhanced multimodal embeddings
//   Model ID: twelvelabs.marengo-embed-3-0-v1:0
//   - 512-dimensional vectors (optimized storage, 50% reduction)
//   - 4-hour video support (6GB max), 500 token text, 36 languages
//   - Additional embedding type: transcription
//   - Text-image interleaved input for precision search
//   - Advanced segmentation control (dynamic with minDurationSec, fixed with durationSec)
//   - Supports StartAsyncInvoke (async) and InvokeModel (sync)
//
// Important Notes:
// - Use StartAsyncInvoke for large files (videos, audio > 10s)
// - Use InvokeModel for small, low-latency tasks (text queries, images)
// - Combine Marengo embeddings with Pegasus metadata for comprehensive video intelligence
// - Cross-region inference profiles available in us-east-1, eu-west-1, ap-northeast-2
//
// Request Format:
// - Use AWSBedrockTwelveLabsRequest with oneof for pegasus or embed operations

// TwelveLabs Unified Request
message AWSBedrockTwelveLabsRequest {
  // Operation type (Pegasus or Marengo Embed)
  oneof operation {
    // Pegasus video-to-text generation
    AWSBedrockTwelveLabsPegasusRequest pegasus = 1;
    
    // Marengo embedding generation
    AWSBedrockTwelveLabsEmbedRequest embed = 2;
  }
}

// TwelveLabs Pegasus Request (Video-to-Text Generation)
message AWSBedrockTwelveLabsPegasusRequest {
  // Required: Video input prompt/query (max 2000 tokens)
  // Describes what analysis or information to extract from video
  string input_prompt = 1;
  
  // Required: Video media source (S3 location or binary bytes)
  oneof media_source {
    // Binary video data (for small videos < 25MB)
    // Protobuf automatically handles base64 encoding/decoding in JSON
    // Supported formats: MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP
    // Max: 1 hour duration, 2GB file size
    bytes video_base64 = 2;
    
    // S3 location for large videos (recommended for > 25MB)
    // Required for videos exceeding 25MB payload limit
    AWSBedrockS3Location video_s3 = 3;
  }
  
  // Optional: Inference configuration
  AWSBedrockTwelveLabsPegasusConfig config = 4;
}

message AWSBedrockTwelveLabsPegasusConfig {
  // Temperature (0.0-1.0) - Controls randomness
  // Lower values: More deterministic analysis
  // Higher values: More creative descriptions
  // Default: 0.2
  float temperature = 1;
  
  // Max output tokens (1-4096)
  // Controls response length
  // Default: 4096
  uint32 max_output_tokens = 2;
}

// TwelveLabs Marengo Embed Request (Multimodal Embeddings)
// Supports both Marengo 2.7 and 3.0
message AWSBedrockTwelveLabsEmbedRequest {
  // Required: Input type specifying modality
  AWSBedrockTwelveLabsInputType input_type = 1;
  
  // Input data (format depends on input_type)
  oneof input_data {
    // Text input (2.7: max 77 tokens, 3.0: max 500 tokens)
    string input_text = 2;
    
    // Text-image interleaved input (3.0 only)
    // Combines textual descriptions with visual references
    AWSBedrockTwelveLabsTextImageInput text_image = 3;
  }
  
  // Media source (for video, audio, image inputs)
  oneof media_source {
    // Binary media data (images, small videos/audio < 25MB)
    // Protobuf automatically handles base64 encoding/decoding in JSON
    // Images: max 5MB, Videos: max 2-hour (2.7) or 4-hour (3.0), Audio: similar
    bytes media_base64 = 4;
    
    // S3 location (large videos/audio, recommended for > 25MB)
    // Required for videos/audio exceeding 25MB payload limit
    // Max: 2GB (2.7) or 6GB (3.0) via S3
    AWSBedrockS3Location media_s3 = 5;
  }
  
  // Optional: Embedding options (which types to generate)
  // 2.7: visual-text, visual-image, audio
  // 3.0: visual-text, visual-image, audio, transcription
  repeated AWSBedrockTwelveLabsEmbeddingOption embedding_option = 6;
  
  // Optional: Embedding scope (clip-level or asset-level)
  repeated AWSBedrockTwelveLabsEmbeddingScope embedding_scope = 7;
  
  // Optional: Segmentation configuration (3.0 only)
  AWSBedrockTwelveLabsSegmentation segmentation = 8;
  
  // Optional: Temporal scoping for partial video processing
  AWSBedrockTwelveLabsTemporalScope temporal_scope = 9;
}

// Text-Image Interleaved Input (Marengo 3.0)
message AWSBedrockTwelveLabsTextImageInput {
  // Text description
  string text = 1;
  
  // Reference image (binary bytes, base64-encoded in JSON)
  // Protobuf automatically handles base64 encoding/decoding in JSON serialization
  bytes base64_image = 2;
}

// Segmentation Configuration (Marengo 3.0)
message AWSBedrockTwelveLabsSegmentation {
  // Segmentation method
  AWSBedrockTwelveLabsSegmentationMethod method = 1;
  
  // For dynamic: minimum segment duration (1-5 seconds, default 4)
  uint32 min_duration_sec = 2;
  
  // For fixed: segment duration (1-10 seconds, default 6 for video, ~10 for audio)
  uint32 duration_sec = 3;
}

enum AWSBedrockTwelveLabsSegmentationMethod {
  // Unspecified (uses default: dynamic)
  AWS_BEDROCK_TWELVELABS_SEGMENTATION_METHOD_UNSPECIFIED = 0;
  
  // Dynamic - Intelligent shot boundary detection
  // Automatically identifies natural scene transitions
  // Best for: Narrative content, scene-based analysis
  AWS_BEDROCK_TWELVELABS_SEGMENTATION_METHOD_DYNAMIC = 1;
  
  // Fixed - Uniform time-based segments
  // Divides content into equal duration chunks
  // Best for: Consistent temporal granularity, sports analysis
  AWS_BEDROCK_TWELVELABS_SEGMENTATION_METHOD_FIXED = 2;
}

// Temporal Scope for Partial Video Processing
message AWSBedrockTwelveLabsTemporalScope {
  // Start time in seconds (default: 0)
  float start_sec = 1;
  
  // Length in seconds to process (2-10 seconds)
  // Enables processing specific video segments
  float length_sec = 2;
}

// TwelveLabs Input Modality Types
// Supported input types for TwelveLabs models
enum AWSBedrockTwelveLabsInputType {
  // Unspecified input type
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_UNSPECIFIED = 0;
  
  // Text input - Plain text string
  // 2.7: Maximum 77 tokens (100-150 words)
  // 3.0: Maximum 500 tokens (significant expansion)
  // Use for: Text queries, descriptions, search queries
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_TEXT = 1;
  
  // Text-Image interleaved input (3.0 only)
  // Combines text descriptions with reference images
  // Use for: Precision multimodal search
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_TEXT_IMAGE = 2;
  
  // Image input - Base64-encoded image
  // Maximum size: 5 megabytes
  // Supported formats: Standard image formats
  // Use for: Image understanding and visual embeddings
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_IMAGE = 3;
  
  // Audio input - Base64-encoded audio file
  // 2.7: Previous limit 10MB
  // 3.0: Up to 4-hour duration, 6GB max file size
  // Supported formats: WAV, MP3, FLAC
  // Use for: Audio content analysis and embeddings
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_AUDIO = 4;
  
  // Video input - Base64-encoded video or S3 location
  // 2.7: Maximum 2-hour duration, 2GB file size
  // 3.0: Maximum 4-hour duration, 6GB file size
  // Resolution: 360x360 to 4K (3840x2160)
  // Aspect ratio: 1:1 to 1:2.4 or 2.4:1 to 1:1
  // Use for: Video content analysis and embeddings
  // Note: Use StartAsyncInvoke for large video files
  AWS_BEDROCK_TWELVELABS_INPUT_TYPE_VIDEO = 5;
}

// Embedding Options (which embedding types to generate)
enum AWSBedrockTwelveLabsEmbeddingOption {
  // Unspecified embedding option
  AWS_BEDROCK_TWELVELABS_EMBEDDING_OPTION_UNSPECIFIED = 0;
  
  // Visual-Text - Visual embeddings optimized for text-based search
  // Best for: Text queries against video visual content
  AWS_BEDROCK_TWELVELABS_EMBEDDING_OPTION_VISUAL_TEXT = 1;
  
  // Visual-Image - Visual embeddings optimized for image-based search
  // Best for: Image queries against video visual content
  AWS_BEDROCK_TWELVELABS_EMBEDDING_OPTION_VISUAL_IMAGE = 2;
  
  // Audio - Audio embeddings from video/audio content
  // Best for: Audio-based search and similarity
  AWS_BEDROCK_TWELVELABS_EMBEDDING_OPTION_AUDIO = 3;
  
  // Transcription - Transcription embeddings (3.0 only)
  // Encodes spoken content and on-screen text
  // Best for: Natural language search over video transcripts
  AWS_BEDROCK_TWELVELABS_EMBEDDING_OPTION_TRANSCRIPTION = 4;
}

// Embedding Scope (granularity level)
enum AWSBedrockTwelveLabsEmbeddingScope {
  // Unspecified scope
  AWS_BEDROCK_TWELVELABS_EMBEDDING_SCOPE_UNSPECIFIED = 0;
  
  // Clip - Individual segment embeddings
  // Returns embeddings for each temporal segment
  // Best for: Temporal precision, timestamp-based search
  AWS_BEDROCK_TWELVELABS_EMBEDDING_SCOPE_CLIP = 1;
  
  // Asset - Whole video embedding
  // Returns single embedding for entire video
  // Best for: Video-level similarity, broad search
  AWS_BEDROCK_TWELVELABS_EMBEDDING_SCOPE_ASSET = 2;
}

message AWSBedrockTwelveLabsEmbedConfig {
  // Embedding dimension (model-specific)
  // 2.7: 1024 dimensions
  // 3.0: 512 dimensions (optimized)
  // Note: Dimension is model-determined, not configurable
