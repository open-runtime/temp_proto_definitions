// - Qwen3-32B (Dense): Dense model (32B) for real-time/edge deployment
//
// Key Features:
// - Mixture of Experts (MoE) architecture for efficient inference
// - Agentic capabilities: Multi-step reasoning and structured planning
// - Tool calling and external API integration
// - Long-context handling: Up to 256K tokens natively, 1M with extrapolation
// - Repository-scale code analysis support
//
// Request Format:
// - Use AWSBedrockQwenRequest with messages array (conversational format)
// - Supports Converse API and InvokeModel operations

