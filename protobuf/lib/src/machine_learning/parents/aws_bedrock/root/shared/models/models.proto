//------------------------------------------------------------------------------
// Amazon Titan Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock Titan inference format
// Provider: Amazon
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-models.html
// Subscription: Required for all Titan models
//
// Amazon Titan Model Family:
// - Titan Text G1: Text generation models (Lite, Express, Premier variants)
//   Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-text.html
// - Titan Text Embeddings V2: Text embedding generation (256, 512, 1024 dimensions)
//   Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
// - Titan Multimodal Embeddings G1: Mixed text and image embeddings
//   Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-image.html
// - Titan Image Generator G1: Image generation from text prompts
//   Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-image.html
//
// Request Format:
// - Text models: Use AWSBedrockTitanRequest with inputText and textGenerationConfig
// - Embedding models: Use AWSBedrockTitanEmbedRequest with inputText and optional normalize
// - Image models: Use AWSBedrockTitanImageRequest with taskType and task-specific parameters

// Titan Text Generation Request
// Used for Titan Text G1 models (Lite, Express, Premier)
message AWSBedrockTitanTextRequest {
  // Required: Input text prompt for generation
  // Maximum length varies by model variant
  string input_text = 1;
  
  // Required: Text generation configuration parameters
  AWSBedrockTitanInferenceConfig config = 2;
}

// Titan Text Generation Configuration
message AWSBedrockTitanInferenceConfig {
  // Temperature (0.0-1.0) - Controls randomness in token selection
  // Lower values (0.0-0.3): More deterministic, focused responses
  // Higher values (0.7-1.0): More creative, diverse responses
  // Default: Model-specific
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  // Specifies cumulative probability mass to consider
  // Default: Model-specific
  float top_p = 2;
  
  // Maximum tokens to generate (0-8192)
  // Controls output length and affects quota allocation
  // Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-token-burndown.html
  uint32 max_token_count = 3;
  
  // Stop sequences - Custom termination strings
  // Model stops generating when any sequence is encountered
  // Useful for limiting output length or specific formats
  repeated string stop_sequences = 4;
}

// Titan Text Embeddings Request
// Used for Titan Text Embeddings V2 models
// Note: Embedding models do NOT support inference parameters (temperature, top_p, etc.)
message AWSBedrockTitanEmbedRequest {
  // Required: Text to embed
  // Can be a single string or array of strings
  string input_text = 1;
  
  // Optional: Normalize embeddings to unit length
  // When true, embeddings are normalized to have magnitude 1.0
  // Useful for cosine similarity calculations
  // Default: false
  bool normalize = 2;
  
  // Optional: Output dimension (256, 512, or 1024)
  // Only applicable for Titan Text Embeddings V2
  // Default: 1024
  uint32 output_dimension = 3;
}

// Titan Multimodal Embeddings Request
// Used for Titan Multimodal Embeddings G1 (text + image inputs)
message AWSBedrockTitanMultimodalEmbedRequest {
  // Required: Input text
  string input_text = 1;
  
  // Optional: Input image (binary bytes, base64-encoded in JSON)
  // Protobuf automatically handles base64 encoding/decoding in JSON serialization
  // Supported formats: JPEG, PNG
  bytes base64_input_image = 2;
  
  // Optional: Normalize embeddings to unit length
  bool normalize = 3;
}

// Titan Unified Request Wrapper
// Supports all Titan model variants with type-safe operation selection
message AWSBedrockTitanRequest {
  // Operation type determines which Titan model and task is used
  oneof task {
    // Text generation (Titan Text G1 models)
    AWSBedrockTitanTextRequest text = 1;
    
    // Text embeddings (Titan Text Embeddings V2)
    AWSBedrockTitanEmbedRequest embed = 2;
    
    // Multimodal embeddings (Titan Multimodal Embeddings G1)
    AWSBedrockTitanMultimodalEmbedRequest multimodal_embed = 3;
    
    // Image generation (Titan Image Generator G1)
    AWSBedrockTitanImageRequest image = 4;
  }
}

// Titan Image Generator Request
// Used for Titan Image Generator G1 models
message AWSBedrockTitanImageRequest {
  // Required: Task type specifying the image generation operation
  AWSBedrockTitanImageTaskType task_type = 1;
  
  // Task-specific parameters (use oneof based on task_type)
  oneof task_params {
    // Text-to-image parameters
    AWSBedrockTitanTextToImageParams text_to_image = 2;
    
    // Image variation parameters
    AWSBedrockTitanImageVariationParams image_variation = 3;
  }
  
  // Required: Image generation configuration
  AWSBedrockTitanImageConfig image_generation_config = 4;
}

message AWSBedrockTitanTextToImageParams {
  // Required: Text prompt describing desired image
  // Maximum length: 512 characters
  string prompt = 1;
  
  // Optional: Negative prompt (what to avoid)
  string negative_prompt = 2;
}
  
message AWSBedrockTitanImageVariationParams {
  // Required: Input image for variation/edit tasks (binary bytes, base64-encoded in JSON)
  // Protobuf automatically handles base64 encoding/decoding in JSON serialization
  bytes base64_image = 1;
  
  // Optional: Mask for editing tasks (binary bytes, base64-encoded in JSON)
  // Protobuf automatically handles base64 encoding/decoding in JSON serialization
  bytes base64_mask_image = 2;
  
  // Optional: Text description of mask for editing
  string mask_prompt = 3;
}

enum AWSBedrockTitanImageTaskType {
  // Unspecified task type
  AWS_BEDROCK_TITAN_IMAGE_TASK_TYPE_UNSPECIFIED = 0;
  
  // Text-to-image generation
  // Generate image from text prompt
  AWS_BEDROCK_TITAN_IMAGE_TASK_TYPE_TEXT_IMAGE = 1;
  
  // Image variation
  // Create variations of existing image
  AWS_BEDROCK_TITAN_IMAGE_TASK_TYPE_IMAGE_VARIATION = 2;
  
  // Color-guided generation
  // Generate image constrained to specific color palette
  AWS_BEDROCK_TITAN_IMAGE_TASK_TYPE_COLOR_GUIDED_GENERATION = 3;
  
  // Background removal
  // Remove background from image
  AWS_BEDROCK_TITAN_IMAGE_TASK_TYPE_BACKGROUND_REMOVAL = 4;
}

message AWSBedrockTitanImageConfig {
  // Required: Image quality level
  // Controls the tradeoff between quality and generation speed
  AWSBedrockTitanImageQuality quality = 1;
  
  // Number of images to generate (1-5)
  uint32 number_of_images = 2;
  
  // CFG Scale (1.1-10.0) - Prompt adherence strength
  // Higher values: More adherence to prompt
  // Lower values: More creative interpretation
  float cfg_scale = 3;
  
  // Image height in pixels (default: 1408)
  uint32 height = 4;
  
  // Image width in pixels (default: 1408)
  uint32 width = 5;
  
  // Random seed (0-2,147,483,646) for reproducibility
  // Same seed + same prompt = same image
  // Default: 42
  uint32 seed = 6;
}

// Titan Image Quality Levels
// Controls the tradeoff between image quality and generation speed
enum AWSBedrockTitanImageQuality {
  // Unspecified quality (uses default: standard)
  AWS_BEDROCK_TITAN_IMAGE_QUALITY_UNSPECIFIED = 0;
  
  // Standard - Faster generation, good quality
  // Balanced option for most use cases
  // Recommended for: High-volume generation, cost optimization
  AWS_BEDROCK_TITAN_IMAGE_QUALITY_STANDARD = 1;
  
  // Premium - Higher quality, slower generation
  // Enhanced detail and accuracy
  // Recommended for: High-quality outputs, detailed imagery
  AWS_BEDROCK_TITAN_IMAGE_QUALITY_PREMIUM = 2;
}

//------------------------------------------------------------------------------
// Mistral AI Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock Mistral inference format
// Provider: Mistral AI
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral.html
// Subscription: Required for all Mistral models
//
// Mistral Model Family:
// - Mistral Large 2 (24.07): 123B parameters, flagship model with function calling
// - Mistral Small (24.02): 24B parameters, latency-optimized
// - Mixtral 8x7B: Sparse MoE (46.7B total, 12.9B active per token)
// - Pixtral Large (25.02): 124B parameters, multimodal vision-language model
//
// Key Features:
// - Tool use/function calling (Mistral Large 2)
// - JSON mode for structured outputs
// - Streaming support via InvokeModelWithResponseStream and ConverseStream
// - Apache 2.0 license (open-weight models)
//
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral.html

message AWSBedrockMistralRequest {
  // Required: Messages array for conversational API
  repeated AWSBedrockMistralMessage messages = 1;
  
  // Required: Inference configuration
  AWSBedrockMistralInferenceConfig config = 2;
  
  // Optional: Tool definitions for function calling (Mistral Large 2)
  // Enables model to invoke external tools/functions
  repeated AWSBedrockMistralTool tools = 3;
  
  // Optional: Tool choice configuration
  // Controls when and how tools are used
  AWSBedrockMistralToolChoice tool_choice = 4;
}

message AWSBedrockMistralMessage {
  // Required: Message role
  AWSBedrockMistralRole role = 1;
  
  // Required: Message content
  // Can be text string or content blocks (for tool results)
  oneof content {
    string text = 2;
    AWSBedrockMistralContentBlocks blocks = 3;
  }
}

enum AWSBedrockMistralRole {
  // Unspecified role
  AWS_BEDROCK_MISTRAL_ROLE_UNSPECIFIED = 0;
  
  // System role - System-level instructions
  // Sets model behavior and context
  AWS_BEDROCK_MISTRAL_ROLE_SYSTEM = 1;
  
  // User role - User messages and queries
  // User input in conversational interactions
  AWS_BEDROCK_MISTRAL_ROLE_USER = 2;
  
  // Assistant role - Model responses
  // Assistant messages in conversational interactions
  AWS_BEDROCK_MISTRAL_ROLE_ASSISTANT = 3;
  
  // Tool role - Tool execution results
  // Used for returning tool call results back to model
  AWS_BEDROCK_MISTRAL_ROLE_TOOL = 4;
}

message AWSBedrockMistralContentBlocks {
  repeated AWSBedrockMistralContentBlock blocks = 1;
}

message AWSBedrockMistralContentBlock {
  // Content block (use oneof for type safety)
  // Only one field can be set at a time, enforced by protobuf
  oneof content {
    // Text content block
    string text = 1;
    
    // Image content block (for Pixtral multimodal models)
    // Pixtral Large (mistral.pixtral-large-2502-v1:0) supports vision-language tasks
    // with image inputs alongside text
    AWSBedrockMistralImageSource image = 2;
    
    // Tool call content (when model requests tool invocation)
    AWSBedrockMistralToolCall tool_call = 3;
    
    // Tool result content (when returning tool execution results)
    AWSBedrockMistralToolResult tool_result = 4;
  }
}

// Mistral Image Source
// Used for Pixtral multimodal models to provide image inputs
// Pixtral Large (mistral.pixtral-large-2502-v1:0) supports vision-language tasks
// with image inputs alongside text in conversational messages.
//
// Uses oneof pattern for type safety: protobuf enforces that only one source type can be set
// Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral.html
message AWSBedrockMistralImageSource {
  // Required: Media type of the image
  // Specifies the image format for proper decoding
  AWSBedrockImageMediaType media_type = 1;
  
  // Required: Image source (use oneof for type safety)
  // Only one field can be set at a time, enforced by protobuf
  oneof source {
    // Base64-encoded image data
    // Binary image bytes - protobuf automatically handles base64 encoding/decoding in JSON
    // When serialized to JSON, protobuf automatically encodes bytes as base64 strings
    // Use for: Small to medium images (< 1 MB), images already in memory
    bytes base64_data = 2;
    
    // S3 location for cloud-stored images
    // Specifies bucket and key for S3-hosted images
    // AWS Bedrock retrieves the image from S3 during inference processing
    // Use for: Large images (> 1 MB), images already in S3
    AWSBedrockS3Location s3_location = 3;
  }
}

// Note: AWSBedrockMistralImageSourceType enum removed - oneof provides type safety

// Note: AWSBedrockMistralContentBlockType enum removed - oneof provides type safety

message AWSBedrockMistralTool {
  // Tool name
  string name = 1;
  
  // Tool description
  string description = 2;
  
  // Tool input schema (JSON schema)
  google.protobuf.Struct input_schema = 3;
}

message AWSBedrockMistralToolChoice {
  // Tool choice configuration
  oneof choice {
    // Auto - Model decides whether to use tools
    AWSBedrockMistralToolChoiceAuto auto = 1;
    
    // None - Model will not use tools
    AWSBedrockMistralToolChoiceNone none = 2;
    
    // Any - Model must use at least one tool
    AWSBedrockMistralToolChoiceAny any = 3;
    
    // Specific tool - Force use of specific tool
    AWSBedrockMistralToolChoiceTool tool = 4;
  }
}

message AWSBedrockMistralToolChoiceAuto {
  // Empty message - presence indicates auto mode
}

message AWSBedrockMistralToolChoiceNone {
  // Empty message - presence indicates no tool use
}

message AWSBedrockMistralToolChoiceAny {
  // Empty message - presence indicates any tool mode
}

message AWSBedrockMistralToolChoiceTool {
  // Tool name to force
  string name = 1;
}

message AWSBedrockMistralToolCall {
  // Tool call ID
  string id = 1;
  
  // Tool name
  string name = 2;
  
  // Tool arguments (JSON object)
  google.protobuf.Struct arguments = 3;
}

message AWSBedrockMistralToolResult {
  // Tool call ID (matching the tool_call id)
  string tool_call_id = 1;
  
  // Tool execution result content
  string content = 2;
  
  // Whether the tool execution resulted in error
  bool is_error = 3;
}

message AWSBedrockMistralInferenceConfig {
  // Temperature (0.0-1.0) - Controls randomness
  // Lower values: More deterministic, focused outputs
  // Higher values: More creative, diverse outputs
  // Default: 0.7
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  // Cumulative probability mass to consider
  // Default: 1.0
  float top_p = 2;
  
  // Top-K - Number of top tokens to consider
  // Must be passed via additionalModelRequestFields in Converse API
  // Range: 1-200
  uint32 top_k = 3;
  
  // Maximum tokens to generate
  // Default varies by model
  uint32 max_tokens = 4;
  
  // Stop sequences - Custom termination strings
  // Model stops when any sequence is encountered
  repeated string stop = 5;
  
  // Random seed for reproducible outputs
  // Same seed + same params = same output (for temperature=0)
  // Default: random
  uint32 random_seed = 6;
}

//------------------------------------------------------------------------------
// Cohere Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock Cohere inference format
// Provider: Cohere
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-cohere.html
// Subscription: Required for all Cohere models
//
// Cohere Model Categories:
// 1. Command Models: Text generation and chat (Command, Command R, Command R+)
//    Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-cohere-command.html
// 2. Embed Models: Text and image embeddings (Embed English v3, Embed Multilingual v3, Embed v4)
//    Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed.html
//    Reference v4: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed-v4.html
// 3. Rerank Models: Document reranking for improved retrieval (Rerank 3.5)
//    Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
//
// Request Format:
// - Command models: Use AWSBedrockCohereRequest with prompt and inference parameters
// - Embed models: Use AWSBedrockCohereEmbedRequest with inputs and embedding configuration
// - Rerank models: Use AWSBedrockCohereRerankRequest with queries and sources

// Cohere Command Request (Text Generation)
// Used for Command, Command R, Command R+ models
message AWSBedrockCohereRequest {
  // Required: Text prompt for generation
  // Maximum length varies by model
  string prompt = 1;
  
  // Required: Inference configuration parameters
  AWSBedrockCohereInferenceConfig config = 2;
}

// Cohere Command Inference Configuration
message AWSBedrockCohereInferenceConfig {
  // Temperature (0-5) - Controls randomness
  // Higher values: More creative, diverse outputs
  // Lower values: More focused, deterministic outputs
  // Default: Model-specific
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  // Specifies cumulative probability mass to consider
  float p = 2;
  
  // Top-K (0-500) - Number of top tokens to consider
  // Restricts token selection pool
  uint32 k = 3;
  
  // Maximum tokens to generate
  // Default varies by model
  uint32 max_tokens = 4;
  
  // Stop sequences - Custom termination strings
  repeated string stop_sequences = 5;
  
  // Number of completions to generate (1-5)
  // Multiple completions provide diverse outputs
  uint32 num_generations = 6;
  
  // Optional: Return likelihood scores with generations
  // Controls whether probability scores are included in response
  // Useful for probability analysis and confidence scoring
  AWSBedrockCohereReturnLikelihoods return_likelihoods = 7;
}

// Cohere Embed Request (Text/Image Embeddings)
// Used for Embed English v3, Embed Multilingual v3, Embed v4 models
message AWSBedrockCohereEmbedRequest {
  // Required: Input type specifying the use case
  // Determines special token prepending for optimal embedding quality
  // Different types should not be mixed in a single request (best practice)
  AWSBedrockCohereEmbedInputType input_type = 1;
  
  // Required: Inputs to embed (text strings and/or images)
  // For Embed v3: Array of text strings only
  // For Embed v4: Array of text strings and/or binary image bytes
  // Context length: Up to ~128K tokens (smaller chunks recommended for RAG)
  repeated string inputs = 2;
  
  // Optional: Embedding types to return (for Embed v4 only)
  // Multiple types can be requested simultaneously
  // Each type provides different storage/accuracy tradeoffs
  repeated AWSBedrockCohereEmbeddingType embedding_types = 3;
  
  // Optional: Output dimension (256-1536 for Embed v4)
  // Smaller dimensions: Faster operations, less storage
  // Larger dimensions: Better quality, more storage
  // Default: 1536 dimensions
  uint32 output_dimension = 4;
  
  // Optional: Truncation behavior for inputs exceeding context length
  // Controls how long inputs are handled
  AWSBedrockCohereTruncate truncate = 5;
}

// Cohere Embed Input Types
// Specifies the use case for embedding generation
// Special tokens are prepended based on input type for optimal quality
enum AWSBedrockCohereEmbedInputType {
  // Unspecified input type
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_UNSPECIFIED = 0;
  
  // Search document - For documents to be indexed in knowledge base
  // Prepends special tokens indicating document content
  // Use when: Indexing documents for retrieval
  // Best practice: Don't mix with search_query in same request
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_SEARCH_DOCUMENT = 1;
  
  // Search query - For queries to search against indexed documents
  // Prepends special tokens indicating search query
  // Use when: Generating embeddings for search queries
  // Best practice: Don't mix with search_document in same request
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_SEARCH_QUERY = 2;
  
  // Classification - For classification tasks
  // Prepends special tokens for classification use cases
  // Use when: Training or using embeddings for classification
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_CLASSIFICATION = 3;
  
  // Clustering - For clustering operations
  // Prepends special tokens for clustering use cases
  // Use when: Generating embeddings for clustering analysis
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_CLUSTERING = 4;
  
  // Image - For image inputs (Embed v4 only)
  // Indicates image content for multimodal embeddings
  // Use when: Embedding images alongside text
  AWS_BEDROCK_COHERE_EMBED_INPUT_TYPE_IMAGE = 5;
}

// Cohere Embedding Types
// Different embedding representations with varying storage/accuracy tradeoffs
enum AWSBedrockCohereEmbeddingType {
  // Unspecified embedding type
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_UNSPECIFIED = 0;
  
  // Float - Standard floating-point 32-bit vectors
  // Full precision semantic space coordinates
  // Use for: Maximum accuracy, standard similarity calculations
  // Storage: 4 bytes per dimension
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_FLOAT = 1;
  
  // Int8 - Signed 8-bit integer vectors
  // Compact storage with minimal accuracy loss
  // Use for: Storage-constrained applications
  // Storage: 1 byte per dimension (4x compression vs float)
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_INT8 = 2;
  
  // UInt8 - Unsigned 8-bit integer vectors
  // Compact storage for non-negative embeddings
  // Use for: Storage optimization with unsigned values
  // Storage: 1 byte per dimension
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_UINT8 = 3;
  
  // Binary - Binary vectors (0 or 1 per dimension)
  // Maximum compression for binary similarity
  // Use for: Extreme storage optimization, binary similarity search
  // Storage: 1 bit per dimension (32x compression vs float)
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_BINARY = 4;
  
  // UBinary - Unsigned binary representations
  // Binary format for unsigned embeddings
  // Use for: Binary similarity with unsigned values
  // Storage: 1 bit per dimension
  AWS_BEDROCK_COHERE_EMBEDDING_TYPE_UBINARY = 5;
}

// Cohere Truncation Behavior
// Controls how inputs exceeding context length are handled
enum AWSBedrockCohereTruncate {
  // Unspecified truncation (uses default)
  AWS_BEDROCK_COHERE_TRUNCATE_UNSPECIFIED = 0;
  
  // Start - Truncate from the beginning
  // Removes tokens from the start of input
  // Use when: End of input is most important
  AWS_BEDROCK_COHERE_TRUNCATE_START = 1;
  
  // End - Truncate from the end
  // Removes tokens from the end of input
  // Use when: Beginning of input is most important
  AWS_BEDROCK_COHERE_TRUNCATE_END = 2;
  
  // None - No truncation
  // Request will fail if input exceeds context length
  // Use when: Input length is guaranteed to fit
  AWS_BEDROCK_COHERE_TRUNCATE_NONE = 3;
}

// Cohere Return Likelihoods
// Controls whether probability scores are returned with generations
enum AWSBedrockCohereReturnLikelihoods {
  // Unspecified (uses default)
  AWS_BEDROCK_COHERE_RETURN_LIKELIHOODS_UNSPECIFIED = 0;
  
  // None - Do not return likelihood scores
  // Fastest option, no probability information
  AWS_BEDROCK_COHERE_RETURN_LIKELIHOODS_NONE = 1;
  
  // Generation - Return likelihood for generated text only
  // Provides probability scores for the generated completion
  // Useful for: Confidence scoring of generated text
  AWS_BEDROCK_COHERE_RETURN_LIKELIHOODS_GENERATION = 2;
  
  // All - Return likelihood for all tokens (prompt + generation)
  // Provides probability scores for entire sequence
  // Useful for: Complete probability analysis
  AWS_BEDROCK_COHERE_RETURN_LIKELIHOODS_ALL = 3;
}

// Cohere Rerank Request (Document Reranking)
// Used for Rerank 3.5 model
// Improves retrieval relevance by scoring documents against queries
message AWSBedrockCohereRerankRequest {
  // Required: Queries to rerank against
  // Array of query text strings
  repeated string queries = 1;
  
  // Required: Documents to rerank
  // Array of document text strings
  repeated string sources = 2;
  
  // Optional: Reranking configuration
  AWSBedrockCohereRerankConfig reranking_config = 3;
}

message AWSBedrockCohereRerankConfig {
  // Reranking model identifier
  // Example: "cohere.rerank-v3-5:0"
  string model = 1;
  
  // Number of results to return
  // Top N documents by relevance score
  uint32 top_n = 2;
}

//------------------------------------------------------------------------------
// AI21 Labs Request/Response
//------------------------------------------------------------------------------
// Maps to AWS Bedrock AI21 Labs inference format
// Provider: AI21 Labs
// Documentation: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-ai21.html
// Subscription: Required for all AI21 Labs models
//
// AI21 Labs Model Families:
// 1. Jamba Models: Advanced architecture with mixture-of-experts (Jamba 1.5 Large, Mini)
//    Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jamba.html
//    - Conversational format with messages array
//    - Supports extended context processing
//    - Efficient inference through MoE architecture
// 2. Jurassic-2 Models: Dense models for text generation (Ultra, Mid)
//    Reference: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jurassic2.html
//    - Completion format with prompt string
//    - Advanced repetition control parameters
//    - Fine-grained token penalty controls
//
// Request Format:
// - Jamba models: Use AWSBedrockAI21Request with messages array (conversational)
// - Jurassic-2 models: Use AWSBedrockAI21JurassicRequest with prompt string (completion)

// AI21 Labs Jamba Request (Conversational Format)
// Used for Jamba 1.5 Large, Jamba 1.5 Mini models
message AWSBedrockAI21Request {
  // Required: Messages array for conversational API
  // Format: Array of messages with role (system, user, assistant) and content
  repeated AWSBedrockAI21Message messages = 1;
  
  // Required: Inference configuration
  AWSBedrockAI21InferenceConfig config = 2;
}

message AWSBedrockAI21Message {
  // Required: Message role
  AWSBedrockAI21Role role = 1;
  
  // Required: Message content (text string)
  string content = 2;
}

enum AWSBedrockAI21Role {
  // Unspecified role
  AWS_BEDROCK_AI21_ROLE_UNSPECIFIED = 0;
  
  // System role - System-level instructions
  AWS_BEDROCK_AI21_ROLE_SYSTEM = 1;
  
  // User role - User messages and queries
  AWS_BEDROCK_AI21_ROLE_USER = 2;
  
  // Assistant role - Model responses
  AWS_BEDROCK_AI21_ROLE_ASSISTANT = 3;
}

// AI21 Labs Jamba Inference Configuration
message AWSBedrockAI21InferenceConfig {
  // Temperature (0.0-2.0) - Controls randomness
  // Higher values: More creative outputs
  // Lower values: More deterministic outputs
  // Note: If n > 1 and temperature = 0, request will fail (all answers guaranteed duplicates)
  float temperature = 1;
  
  // Maximum tokens to generate (0-4096)
  // Also called max_completion_length
  uint32 max_tokens = 2;
  
  // Number of completions to generate (1-16)
  // Multiple completions provide diverse outputs
  uint32 n = 3;
  
  // Stop sequences - Custom termination strings
  repeated string stop_sequences = 4;
  
  // Frequency penalty (0.0-2.0) - Reduces repetition of frequent tokens
  // Higher values decrease likelihood of repeating tokens
  float frequency_penalty = 5;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  float top_p = 6;
  
  // Presence penalty (0.0-2.0) - Reduces repetition of any token
  // Higher values encourage new topics
  // Scale: 0.0 (no penalty) to 2.0 (maximum penalty)
  float presence_penalty = 7;
}

// AI21 Labs Jurassic-2 Request (Completion Format)
// Used for Jurassic-2 Ultra, Jurassic-2 Mid models
message AWSBedrockAI21JurassicRequest {
  // Required: Text prompt for completion
  string prompt = 1;
  
  // Required: Inference configuration with advanced penalty controls
  AWSBedrockAI21JurassicInferenceConfig config = 2;
}

// AI21 Labs Jurassic-2 Inference Configuration
// Includes advanced repetition control parameters
message AWSBedrockAI21JurassicInferenceConfig {
  // Temperature (0.0-1.0) - Controls randomness
  float temperature = 1;
  
  // Top-P (0.0-1.0) - Nucleus sampling threshold
  float top_p = 2;
  
  // Maximum tokens to generate (0-8,191)
  uint32 max_tokens = 3;
  
  // Stop sequences - Custom termination strings
  repeated string stop_sequences = 4;
  
  // Count Penalty (0.0-1.0) - Reduces count of frequently used tokens
  // Scale: 0.0 (no penalty) to 1.0 (maximum penalty)
  // Controls token repetition frequency
  float count_penalty = 5;
  
  // Presence Penalty (0.0-5.0) - Penalizes tokens that appeared previously
  // Scale: 0.0 (no penalty) to 5.0 (maximum penalty)
  // Reduces repetition of previously used tokens
  float presence_penalty = 6;
  
  // Frequency Penalty (0-500) - Reduces frequency of high-frequency tokens
  // Scale: 0 (no penalty) to 500 (maximum penalty)
  // Fine-grained control over token frequency
  uint32 frequency_penalty = 7;
}

