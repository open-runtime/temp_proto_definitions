// Top-level message representing the complete user profile snapshot
message TeamUserServiceProfileSnapshot {
  // User identifier (UUID format)
  string id = 1;
  
  // User ID (internal identifier)
  // API sends both "userId" (camelCase) and "user_id" (snake_case)
  string user_id = 2 [json_name = "user_id"];
  
  // Optional: Authorization ID
  // Deprecated: This field is deprecated and may be removed in a future version
  string autho_id = 3 [deprecated = true, json_name = "autho_id"];
  
  // User's full name
  string name = 4;
  
  // User's given name (first name)
  // API sends both "givenName" (camelCase) and "given_name" (snake_case)
  string given_name = 5 [json_name = "given_name"];
  
  // User's middle name
  // API sends both "middleName" (camelCase) and "middle_name" (snake_case)
  string middle_name = 6 [json_name = "middle_name"];
  
  // User's family name (last name)
  // API sends both "familyName" (camelCase) and "family_name" (snake_case)
  string family_name = 7 [json_name = "family_name"];
  
  // Optional: Paddle payment processor ID
  string paddle_id = 8 [json_name = "paddle_id"];
  
  // Optional: Last webhook received from Paddle
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp paddle_last_webhook_at = 9 [json_name = "paddle_last_webhook_at"];
  
  // User's email address
  string email = 10;
  
  // Optional: User's phone number
  string phone = 11;
  
  // Optional: User's profile picture URL
  string picture = 12;
  
  // Account creation time
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // API sends both "createdTime" (camelCase) and "created_time" (snake_case)
  google.protobuf.Timestamp created_time = 13 [json_name = "createdTime"];
  
  // Last update time
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // API sends both "updatedTime" (camelCase) and "updated_time" (snake_case)
  google.protobuf.Timestamp updated_time = 14 [json_name = "updatedTime"];
  
  // List of login IDs (OAuth providers, email, etc.)
  // API sends both "loginIds" (camelCase) and "login_ids" (snake_case)
  repeated string login_ids = 15 [json_name = "loginIds"];
  
  // Optional: Role names assigned to the user
  // API sends both "roleNames" (camelCase) and "role_names" (snake_case)
  repeated string role_names = 16 [json_name = "roleNames"];
  
  // Optional: SSO application IDs
  // API sends both "ssoAppIds" (camelCase) and "sso_app_ids" (snake_case)
  repeated string sso_app_ids = 17 [json_name = "ssoAppIds"];
  
  // Optional: OAuth configuration
  google.protobuf.Struct oauth = 18;
  
  // Whether the user's email is verified
  // API sends both "isVerifiedEmail" (camelCase) and "is_verified_email" (snake_case)
  bool is_verified_email = 19 [json_name = "isVerifiedEmail"];
  
  // Whether the user's phone is verified
  // API sends both "isVerifiedPhone" (camelCase) and "is_verified_phone" (snake_case)
  bool is_verified_phone = 20 [json_name = "isVerifiedPhone"];
  
  // Whether the user has a password set
  bool password = 21;
  
  // User account status (e.g., "enabled", "disabled")
  string status = 22;
  
  // Whether welcome email was sent
  bool welcome_email = 23 [json_name = "welcome_email"];
  
  // Optional: Vanity username/identifier
  string vanity = 24;
  
  // Optional: Cloud key identifier
  string cloud_key = 25 [json_name = "cloud_key"];
  
  // Optional: OpenAI configuration
  google.protobuf.Struct open_ai = 26 [json_name = "open_ai"];
  
  // Optional: Beta feature flags
  google.protobuf.Struct beta = 27;
  
  // Optional: Resource allocation configuration
  google.protobuf.Struct allocation = 28;
  
  // Organizations the user belongs to
  repeated TeamUserServiceProfileOrganization orgs = 29;
  
  // User-level subscriptions (if any)
  repeated TeamUserServiceProfileSubscription subscriptions = 30;
  
  // User's API keys (list of UUIDs)
  // API sends both "apiKeys" (camelCase) and "api_keys" (snake_case)
  repeated string api_keys = 31 [json_name = "apiKeys"];
  
  // Account creation timestamp (alternative format)
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp created_at = 32 [json_name = "created_at"];
  
  // Last update timestamp (alternative format)
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp updated_at = 33 [json_name = "updated_at"];
}

// Organization message representing a team/organization
message TeamUserServiceProfileOrganization {
  // Organization identifier
  string id = 1;
  
  // Organization name
  string name = 2;
  
  // Optional: Paddle customer ID
  string paddle_id = 3 [json_name = "paddle_id"];
  
  // Organization-level subscriptions
  repeated TeamUserServiceProfileSubscription subscriptions = 4;
  
  // Organization configuration (includes AOT-specific configs like Bedrock)
  TeamUserServiceProfileOrganizationConfiguration configuration = 5;
  
  // Optional: Tenant ID
  string tenant_id = 6 [json_name = "tenant_id"];
  
  // List of domains associated with the organization
  repeated string domains = 7;
  
  // Organization creation time
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // API sends "createdTime" (camelCase)
  google.protobuf.Timestamp created_time = 8 [json_name = "createdTime"];
  
  // Last update time
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // API sends "updatedTime" (camelCase)
  google.protobuf.Timestamp updated_time = 9 [json_name = "updatedTime"];
}

// Subscription message representing a user or organization subscription
message TeamUserServiceProfileSubscription {
  // Product ID from payment processor
  string product_id = 1 [json_name = "product_id"];
  
  // Price ID from payment processor
  string price_id = 2 [json_name = "price_id"];
  
  // Subscription name/plan name
  string name = 3;
  
  // Subscription price (as string, e.g., "2299" for $22.99)
  string price = 4;
  
  // Subscription ID from payment processor
  string subscription_id = 5 [json_name = "subscription_id"];
  
  // Billing term (e.g., "month", "year")
  string billing_term = 6 [json_name = "billing_term"];
  
  // Quantity of seats/licenses
  int32 quantity = 7;
  
  // Creation timestamp
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // Automatically handles RFC 3339 format strings (e.g., "2025-11-19T16:01:36.590336Z")
  google.protobuf.Timestamp created_at = 8 [json_name = "created_at"];
  
  // Next billing date
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  // Automatically handles RFC 3339 format strings (e.g., "2026-11-19T16:02:51.923Z")
  google.protobuf.Timestamp nextbilled_at = 9 [json_name = "nextbilled_at"];
  
  // Optional: Pause date
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp paused_at = 10 [json_name = "paused_at"];
  
  // Optional: Cancellation date
  // Uses google.protobuf.Timestamp for proper ISO 8601 / Unix timestamp handling
  google.protobuf.Timestamp canceled_at = 11 [json_name = "canceled_at"];
  
  // Whether the subscription is currently active
  bool active = 12;
}

// Organization configuration including AOT-specific settings
message TeamUserServiceProfileOrganizationConfiguration {
  // Optional: OpenAI configuration
  google.protobuf.Struct open_ai = 1 [json_name = "open_ai"];
  
  // Optional: Google Gemini configuration
  google.protobuf.Struct gemini = 2;
  
  // Optional: Anthropic Claude configuration
  google.protobuf.Struct claude = 3;
  
  // AWS Bedrock credentials configuration
  // This uses the BedrockCredentialsConfig from the bedrock models
  // Contains both access key credentials and API keys for Bedrock
  runtime.aot.machine_learning.parents.aws_bedrock.AWSBedrockCredentialsConfig bedrock = 4;
  
  // Microsoft Azure OpenAI credentials configuration
  // This uses the MSFTAzureOpenAICredentialsConfig from the msft_azure_openai models
  // Contains both API keys and Microsoft Entra ID credentials for Azure OpenAI
  runtime.aot.machine_learning.parents.msft_azure_openai.MSFTAzureOpenAICredentialsConfig msft_azure_openai = 5;

  // Feature toggle flags (key-value pairs)
  map<string, bool> toggles = 6;
  
  // Processing mode (e.g., "BLENDED")
  string processing = 7;
  
  // Model access configuration
  repeated TeamUserServiceProfileOrganizationModelAccess model_access = 8;
}

// Model access configuration for allowed models
// Based on real API response from /aot endpoint modelAccess array
message TeamUserServiceProfileOrganizationModelAccess {
  // Display name of the model (e.g., "Claude 4.1 Opus Chat Model")
  string name = 1;
  
  // Unique identifier for the model (e.g., "claude-opus-4-1-20250805")
  string unique = 2;
  
  // Model version identifier (e.g., "t42-v01-i01")
  string version = 3;
  
  // Whether the model is cloud-based
  bool cloud = 4;
  
  // Model type (e.g., "ACCURACY", "SPEED", "BALANCED")
  string type = 5;
  
  // Model usage category (e.g., "CODE_CONVERSATION")
  string usage = 6;
  
  // Foundation model family (e.g., "CLAUDE_LATEST", "GEMINI_LATEST")
  string foundation = 7;
  
  // Model provider (e.g., "ANTHROPIC", "GOOGLE")
  string provider = 8;
  
  // Whether the model runs on CPU
  bool cpu = 9;
  
  // Human-readable model label
  string model_label = 10 [json_name = "modelLabel"];
  
  // Model description
  string model_description = 11 [json_name = "modelDescription"];
  
  // Model family identifier (e.g., "anthropic", "google")
  string model_family = 12 [json_name = "modelFamily"];
  
  // Maximum token limits (nested object)
  TeamUserServiceProfileOrganizationModelAccessMaxTokens max_tokens = 13 [json_name = "maxTokens"];
  
  // Whether this is a custom model
  bool custom = 14;
}

// Max token limits for a model
message TeamUserServiceProfileOrganizationModelAccessMaxTokens {
  // Total token limit
  int32 total = 1;
  
  // Input token limit
  int32 input = 2;
  
  // Output token limit
  int32 output = 3;
}

