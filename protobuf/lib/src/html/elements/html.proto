syntax = "proto3";

package html;

import 'lib/src/css/tailwind/tailwind.proto';

//    <div>: A generic container for other elements, often used for layout purposes.
//    <section>: Represents a standalone section within the content, usually with a thematic grouping.
//    <header>: Represents the header of a page or section, typically containing a logo, navigation, and other related content.
//    <nav>: Represents a navigation section, usually containing links to other pages or sections.
//    <footer>: Represents the footer of a page or section, typically containing copyright information, contact details, and other supplementary content.
//    <article>: Represents a self-contained piece of content that can be independently distributed or reused, such as a blog post or news article.
//    <aside>: Represents content that is tangentially related to the content around it, like a sidebar or pull quote.
//    <main>: Represents the main content of a document, excluding headers, footers, and sidebars.
//    <h1> to <h6>: Heading elements that define the structure and hierarchy of a document.
//    <p>: Represents a paragraph of text.
//    <ul> and <ol>: Represent unordered and ordered lists, respectively.
//    <li>: Represents a list item within an unordered or ordered list.
//    <a>: Represents a hyperlink that navigates to another document or section.
//    <button>: Represents a button that can trigger an action.
//    <form>: Represents a section containing form elements and controls for user input.
//    <input>: Represents an input field that allows users to enter data.
//    <textarea>: Represents a multi-line text input field.
//    <label>: Represents a label for an input element.
//    <select>: Represents a drop-down list for selecting options.
//    <option>: Represents an individual option within a drop-down list.
//    <figure>: Represents self-contained content, such as images, diagrams, or illustrations, with optional captions. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/figure
//    <figcaption>: Represents a caption or legend for a <figure> element. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/figcaption
//    <img>: Represents an image, either raster or vector. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img
//    <video>: Represents a video or movie, with optional controls and fallback content. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/video
//    <audio>: Represents audio content, such as music or sound effects, with optional controls and fallback content. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/audio
//    <source>: Represents a media source for use within <video>, <audio>, or <picture> elements. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/source
//    <picture>: Represents a container for multiple <source> elements and an <img> element, allowing the browser to choose the most suitable image based on its capabilities and context. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/picture
//    <table>: Represents a table for displaying tabular data. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/table
//    <thead>, <tbody>, <tfoot>, <tr>, <th>, <td>: Represent the structure and content of a table, including header, body, footer, rows, header cells, and data cells. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element#Table_content
//    <iframe>: Represents an inline frame that embeds external content, such as a video, map, or a complete web page. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe
//    <details>: Represents a disclosure widget from which users can retrieve additional information or controls. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/details
//    <summary>: Represents a summary or heading for a <details> element. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/summary
//    <progress>: Represents the progress of a task, such as a download or file transfer. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/progress
//    <meter>: Represents a scalar measurement within a known range, such as disk usage or a voting score. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meter
//    <datalist>: Represents a set of pre-defined options for use with an <input> element. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/datalist
//    <fieldset>: Represents a group of related form controls, usually with a common label. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/fieldset
//    <legend>: Represents a caption for a <fieldset> element. Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/legend

message AriaProperties {
  string label = 7; // The aria-label of the element
  string labelledby = 8; // The aria-labelledby of the element
  string describedby = 9; // The aria-describedby of the element
  string current = 10; // The aria-current of the element
  bool disabled = 11; // The aria-disabled of the element
  bool hidden = 12; // The aria-hidden of the element
  bool invalid = 13; // The aria-invalid of the element
  string keyshortcuts = 14; // The aria-keyshortcuts of the element
  string roledescription = 15; // The aria-roledescription of the element
  string autocomplete = 16; // The aria-autocomplete of the element
  bool checked = 17; // The aria-checked of the element
  bool expanded = 18; // The aria-expanded of the element
  bool haspopup = 19; // The aria-haspopup of the element
  string level = 20; // The aria-level of the element
  string modal = 21; // The aria-modal of the element
  string multiline = 22; // The aria-multiline of the element
  string multiselectable = 23; // The aria-multiselectable of the element
  string orientation = 24; // The aria-orientation of the element
}

message StructureProperties {
  // Represents an HTML attribute with key-value pairs
  message CustomProperty {
    string key = 1; // The attribute name
    string value = 2; // The attribute value
  }

  string id = 1; // The unique identifier of the element
  repeated string classes = 2; // The CSS class(es) applied to the element
  string text = 3; // The inner text of the element
  repeated string styles = 4; // The CSS styles applied to the element
  repeated CustomProperty custom = 5; // Custom properties for the element
  tailwind.TailwindProperties tailwind = 6; // Custom properties for the element
  string role = 7; // The role of the element
  AriaProperties aria = 8; // The aria properties of the element
  int32 tabindex = 9; // The tabindex of the element
}



