message AnchorStructure {
  StructureProperties properties = 1; // The properties of the a element
  string href = 2; // The URL the hyperlink points to
  string target = 3; // Specifies where to open the linked document (e.g., "_blank" for a new window or tab)
  string rel = 4; // The relationship between the linked resource and the current document
}

// Represents an HTML <button> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/button
message ButtonStructure {
    enum TypeEnum {
  // A submit button input field.
      SUBMIT = 0;
  // A reset button input field.
      RESET = 1;
  // A generic button input field.
      BUTTON = 2;
}

  StructureProperties properties = 1; // The properties of the button element
  TypeEnum type = 2; // The type of the button: "button", "submit", or "reset"
  string value = 3; // The value to be sent to the server when the button is clicked
  string onclick = 4; // The JavaScript to execute when the button is clicked
  bool disabled = 5; // Indicates if the button is disabled
}



// Represents an HTML <input> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input
message InputStructure {

  // An enum representing the type of an HTML input element.
  enum TypeEnum {
    // A text input field.
    TEXT = 0;
    // A password input field.
    PASSWORD = 1;
    // A checkbox input field.
    CHECKBOX = 2;
    // A radio button input field.
    RADIO = 3;
    // A file upload input field.
    FILE = 4;
    // An input field for entering a date. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/date
    DATE = 5;
    // An input field for entering an email address. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/email
    EMAIL = 6;
    // An input field for entering a numeric value. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/number
    NUMBER = 7;
    // An input field for entering a telephone number. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/tel
    TEL = 8;
    // An input field for entering a URL. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/url
    URL = 9;
    // An input field for entering search text. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/search
    SEARCH = 10;
    // An input field for selecting a color. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/color
    COLOR = 11;
    // An input field for entering a time value. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/time
    TIME = 12;
    // An input field for selecting a month and year. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/month
    MONTH = 13;
    // An input field for selecting a week and year. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/week
    WEEK = 14;
  }

  StructureProperties properties = 1; // The properties of the input element
  TypeEnum type = 2; // The type of the input element (e.g., "text", "password", "checkbox", etc.)
  string name = 3; // The name of the input element, used when submitting the form
  string value = 4; // The initial value of the input element
  string placeholder = 5; // A hint to the user of what can be entered in the input element
  bool required = 6; // Indicates whether the input element is required for form submission
  bool disabled = 7; // Indicates whether the input element is disabled
}


// Represents an HTML <textarea> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/textarea
message TextareaStructure {
  StructureProperties properties = 1; // The properties of the textarea element
  string name = 2; // The name of the textarea element, used when submitting the form
  string value = 3; // The initial value of the textarea element
  string placeholder = 4; // A hint to the user of what can be entered in the textarea element
  int32 rows = 5; // The number of visible text lines in the textarea element
  int32 cols = 6; // The number of visible characters in a line within the textarea element
  bool required = 7; // Indicates whether the textarea element is required for form submission
  bool disabled = 8; // Indicates whether the textarea element is disabled
}

// Represents an HTML <span> element
