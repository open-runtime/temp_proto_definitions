}

// Represents an HTML <section> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/section
message SectionStructure {
  StructureProperties properties = 1; // The properties of the section element
}

// Represents an HTML <form> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form
message FormStructure {
  // An enum representing the encoding type used to submit an HTML form.
  enum EncodingEnum {
    // The default encoding type, which sends form data as URL-encoded key-value pairs in the HTTP request body.
    APPLICATION_X_WWW_FORM_URLENCODED = 0;
    // Used when you need to submit binary data, such as files, in addition to text data.
    MULTIPART_FORM_DATA = 1;
    // Sends form data as plain text, with spaces represented as `+` characters and special characters URL-encoded.
    TEXT_PLAIN = 2;
  }

  // An enum representing the HTTP method used to submit an HTML form.
  enum MethodEnum {
    // The "GET" method sends form data as URL parameters in the request URL. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form#attr-method
    GET = 0;
    // The "POST" method sends form data in the body of the HTTP request. See: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form#attr-method
    POST = 1;
  }

  StructureProperties properties = 1; // The properties of the form element
  string action = 2; // The URL to send the form data to
  MethodEnum method = 3; // The HTTP method to use when submitting the form: "GET" or "POST"
  EncodingEnum enctype = 4; // The encoding type for the form data
  string target = 5; // The browsing context for form submission
  string onsubmit = 6; // The JavaScript to execute when the form is submitted
}





// Represents an HTML <select> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/select
message SelectStructure {
  StructureProperties properties = 1; // The unique identifier of the select element
  string name = 2; // The name of the select element (used when submitting form data)
  string size = 3; // The number of visible options in the drop-down list
  bool multiple = 4; // Indicates if multiple options can be selected at once
  string onchange = 6; // The JavaScript to execute when the selected option changes
}

// Represents an HTML <option> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/option
message OptionStructure {
  StructureProperties properties = 1; // The properties of the option element
  string value = 2; // The value to be sent to the server when the option is selected
  bool selected = 3; // Indicates if the option is initially selected
}

// Represents an HTML image element
message ImageStructure {
  enum LoadingTypeEnum {
    AUTO = 0; // The browser decides the loading behavior
    LAZY = 1; // The browser defers loading of the image until it reaches a calculated distance from the viewport
    EAGER = 2; // The browser loads the image immediately, regardless of its position relative to the viewport
  }

  StructureProperties properties = 1; // The properties of the image element
  string src = 2; // The URL of the image source
  string alt = 3; // Alternative text for the image
  uint32 width = 4; // The width of the image in pixels
  uint32 height = 5; // The height of the image in pixels
  string crossorigin = 6; // The crossorigin attribute for CORS requests
  string longdesc = 7; // The URL of a detailed description of the image
  string referrerpolicy = 8; // The referrer policy for fetching the image
  bool ismap = 9; // Indicates if the image is a server-side image map
  string usemap = 10; // The URL of a client-side image map
  string decoding = 11; // The decoding hint for the browser
  LoadingTypeEnum loading = 12; // The loading behavior (0 = auto, 1 = lazy, 2 = eager)

}

// Enum for the possible values of the "loading" attribute



// Represents an HTML <video> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/video
message VideoStructure {
  // An enum representing the crossorigin attribute for HTML video elements.
  enum CrossOriginEnum {
    // The default value, indicating that the video should be loaded without sending any credentials.
    ANONYMOUS = 0;
    // Indicates that the video should be loaded with credentials, such as cookies or HTTP authentication.
    USE_CREDENTIALS = 1;
  }

  StructureProperties properties = 1; // The properties of the video element
  string src = 2; // The URL of the video file
  string poster = 3; // The URL of an image to be shown while the video is downloading or until the user hits the play button
  int32 width = 4; // The width of the video, in pixels
  int32 height = 5; // The height of the video, in pixels
  bool controls = 6; // Indicates whether the video should have playback controls
  bool autoplay = 7; // Indicates whether the video should start playing as soon as it's ready
  bool loop = 8; // Indicates whether the video should start over again after it has finished
  bool muted = 9; // Indicates whether the audio output of the video should be muted
  repeated VideoSourceStructure sources = 10; // The <source> elements for the video
  CrossOriginEnum crossorigin = 11; // The crossorigin attribute for CORS requests
}

// Represents an HTML <source> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/source
message VideoSourceStructure {
  // An enum representing the MIME types that can be used for HTML video sources.
  enum MimeTypeEnum {
    // The most widely-supported video format. See: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Video_codecs
    VIDEO_MP4 = 0;
    // An open, royalty-free video format designed for use on the web. See: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Video_codecs
    VIDEO_WEBM = 1;
    // Another open, royalty-free video format. See: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Video_codecs
    VIDEO_OGG = 2;
  }


  StructureProperties properties = 1; // The properties of the source element
  string src = 2; // The URL of the media file
  MimeTypeEnum type = 3; // The MIME type of the media file
  string media = 4; // Optional media query for responsive design
  string sizes = 5; // Optional sizes attribute for images in a <picture> element
}





// Represents an HTML <audio> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/audio
message AudioStructure {
  // An enum representing the preload attribute for HTML audio elements.
  enum PreloadTypeEnum {
    // Indicates that the audio should not be preloaded.
    NONE = 0;
    // Indicates that only audio metadata (e.g. length) is fetched.
    METADATA = 1;
    // Indicates that the whole audio file can be downloaded, even if the user is not expected to use it.
    AUTO = 2;
  }

  StructureProperties properties = 1; // The properties of the audio element
  string src = 2; // The URL of the audio file
  bool controls = 3; // Indicates whether the audio should have playback controls
  bool autoplay = 4; // Indicates whether the audio should start playing as soon as it's ready
  bool loop = 5; // Indicates whether the audio should start over again after it has finished
  bool muted = 6; // Indicates whether the audio output should be muted
  PreloadTypeEnum preload = 7; // Indicates whether the audio should be preloaded
  repeated AudioSourceStructure sources = 8; // The <source> elements for the audio
}

// Represents an HTML <source> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/source
message AudioSourceStructure {
  // An enum representing the MIME types that can be used for HTML audio sources.
  enum MimeTypeEnum {
    // The most widely-supported audio format.
    AUDIO_MPEG = 0;
    // An open, royalty-free audio format.
    AUDIO_OGG = 1;
    // An uncompressed audio format that delivers high-quality audio with large file sizes.
    AUDIO_WAV = 2;
    // An open, royalty-free audio format designed for use on the web.
    AUDIO_WEBM = 3;
    // A popular audio format commonly used for streaming and high-quality audio applications.
    AUDIO_AAC = 4;
  }

  StructureProperties properties = 1; // The properties of the source element
  string src = 2; // The URL of the media file
  MimeTypeEnum type = 3; // The MIME type of the media file
}


// Represents an HTML <table> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/table
message TableStructure {
  StructureProperties properties = 1; // The properties of the table element
  TableHeadStructure thead = 3; // The table header
  repeated TableBodyStructure tbodies = 4; // The table bodies
  TableFooterStructure tfoot = 5; // The table footer
}

// Represents an HTML <thead> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/thead
message TableHeadStructure {
  StructureProperties properties = 1;
  repeated TableRowStructure rows = 2; // The header rows
}

// Represents an HTML <tbody> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/tbody
message TableBodyStructure {
  StructureProperties properties = 1; // The properties of the tbody element
  repeated TableRowStructure rows = 2; // The body rows
}

// Represents an HTML <tfoot> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/tfoot
message TableFooterStructure {
  StructureProperties properties = 1; // The properties of the tfoot element
