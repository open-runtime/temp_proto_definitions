}

// Represents an HTML <tr> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/tr
message TableRowStructure {
  StructureProperties properties = 1; // The properties of the tr element
  repeated TableHeaderCellStructure headers = 2; // The header cells in the row
  repeated TableDataCellStructure data = 3; // The data cells in the row
}

// Represents an HTML <th> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/th
message TableHeaderCellStructure {
  StructureProperties properties = 1; // The properties of the th element
  string scope = 4; // Specifies the set of cells the header cell relates to
}

// Represents an HTML <td> element
// Documentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/td
message TableDataCellStructure {
  StructureProperties properties = 1; // The properties of the td element
}



message IFrameYouTubeEmbeddedVideoStructure {
  // An enum representing the permissions granted to a YouTube embed.
  enum PermissionsEnum {
    // Allows the use of the device's accelerometer to provide better interactivity.
    ACCELEROMETER = 0;
    // Allows the video to autoplay when the page is loaded.
    AUTOPLAY = 1;
    // Allows the use of the clipboard to copy and paste content.
    CLIPBOARD_WRITE = 2;
    // Allows the video to be played back with encryption enabled.
    ENCRYPTED_MEDIA = 3;
    // Allows the use of the device's gyroscope to provide better interactivity.
    GYROSCOPE = 4;
    // Allows the video to be played in a picture-in-picture mode.
    PICTURE_IN_PICTURE = 5;
    // Allows the use of the Web Share API to share content with other apps.
    WEB_SHARE = 6;
  }
  string title = 1; // The title of the YouTube video.
  repeated PermissionsEnum permissions = 2; // The permissions granted to the embedded video player.
  uint32 start = 3; // The time in seconds from which the video should start playing.
}

message IFrameStructure {
  // An enum representing the various loading states that can be used on web pages.
  enum LoadingTypeEnum {
    // Specifies that the resource should be loaded asynchronously.
    ASYNC = 0;
    // Specifies that the resource should be loaded in the background, but not executed until the page has finished loading.
    DEFER = 1;
    // Specifies that the resource should be loaded lazily.
    LAZY = 2;
    // Specifies that the resource should be preloaded.
    PRELOAD = 3;
  }

  //https://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe todo implement more
  StructureProperties properties = 1; // The properties of the iframe element
  string src = 2; // The URL of the page to embed in the iframe.
  string name = 3; // The name of the iframe.
  int32 width = 4; // The width of the iframe.
  int32 height = 5; // The height of the iframe.
  bool allowfullscreen = 6; // Whether to allow fullscreen mode in the embedded page.
  bool allowpaymentrequest = 7; // Whether to allow payment requests in the embedded page.
  LoadingTypeEnum loading = 8; // Whether the iframe should be loaded lazily.
  IFrameYouTubeEmbeddedVideoStructure youtube = 9; // The YouTube video to embed in the iframe.
  uint32 frameborder = 10; // The width of the iframe's border.
}

// Description list

message DescriptionListStructure {
  StructureProperties properties = 1; // The properties of the dl element
  repeated DescriptionListTermStructure terms = 2; // The terms in the description list
  repeated DescriptionListDetailsStructure descriptions = 3; // The descriptions in the description list
}

// Description List Term Element
message DescriptionListTermStructure {
  StructureProperties properties = 1; // The properties of the dt element
}

// Description List Description Element
message DescriptionListDetailsStructure {
  StructureProperties properties = 1; // The properties of the dd element
}

message SVGStructure {
  StructureProperties properties = 1;
  string fill = 2;
  string width = 3;
  uint32 height = 4;
  string viewBox = 5;
  string preserveAspectRatio = 6;
  string stroke = 7;
}



message SVGPathStructure {
  enum RuleEnum {
    NONZERO = 0;
    EVENODD = 1;
    INHERIT = 2;
    NONE = 3;
  }

  StructureProperties properties = 1;
  RuleEnum clip = 2;
  RuleEnum fill = 3;
  string d = 4;
}







