message TailwindDivisionFormula {
  uint32 divider = 1;
}

message TailwindSlashFormula {
  string value = 1;
}

message TailwindEncapsulationFormula {
  string leading = 1;
  string trailing = 2;
}

message TailwindClassFormula {
  repeated TailwindClassEnum classes = 1;
  repeated TailwindClassChain chains = 2;
  bool negative = 3; // if true, the formula is prefixed with a minus
  bool dash = 4; // if true, the formula is prefixed with a dash i.e. group-{} or data-{}
  TailwindEncapsulationFormula encapsulation = 5; // if true, the formula is wrapped in brackets
  TailwindDivisionFormula division = 6; // if true, the formula is postfixed with a slash
  TailwindSlashFormula slash = 7; // if true, the formula is postfixed with a slash
  repeated TailwindCustomClass custom = 8;
}

message TailwindCustomClass {
  string value = 1;
}

message TailwindClassChain {
  TailwindClassEnum utility = 1;
  TailwindCustomClass custom_utility = 2;
  repeated TailwindClassEnum classes = 3;
  repeated TailwindClassFormula formulas = 4;
  repeated TailwindCustomClass custom = 5;
}

message TailwindProperties {
  repeated TailwindClassEnum classes = 1;
  repeated TailwindClassChain chains = 2;
  repeated TailwindClassFormula formulas = 4;
  repeated TailwindCustomClass custom = 5;
}